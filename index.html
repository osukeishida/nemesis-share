ラクター⟧がいる場合に限る。\nアクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、あなたの部屋にいる別の⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は1⟦HP⟧を失う。\nあなたは2⟦HP⟧を回復するか、重傷を1つ取り除いてもよい。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"COMMAND IN THE DARK","ja":"暗黒の統制","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、あなたのセクションにある⟦シャドウマーカー⟧を最大2つまで選んで取り除く。取り除いた⟦シャドウマーカー⟧をそれぞれ、あなたのセクションにある任意の通路に配置する。\n1つの通路には⟦シャドウマーカー⟧を3つまでしか配置できないことに注意すること。"]],"n":"2つのシャドウマーカーを取り除いた場合、2つの通路に1つずつ配置してもよいし、1つの通路に2つ配置してもよい。"},{"c":"血の穢れ","s":"サングレヴォア","en":"DARK VISION","ja":"闇の幻視","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、シャドウデッキの一番上にあるカードを秘密裏に確認する。\nその後、移動してもよい。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"FAMILIAR SCENT","ja":"馴染みの匂い","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、移動する。\nこの移動中には、グールの攻撃はすべて阻止される。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"RIGHT OF PASSAGE","ja":"通行儀礼","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、あなたのセクションのドアを1つ選んで開ける、または閉じる。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"NEW ALLY","ja":"新たな眷属","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、施設内のブラッドスペクターを1体選んで移動させる。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"RED EYES","ja":"赤い眼光","e":[["","部屋に⟦イントルーダー⟧がいる場合に限る。\nアクション（⟦アクションカード⟧を1枚捨てる）：\nあなたの部屋にいるすべての⟦イントルーダー⟧に、1ヒットずつ与える。あなたの部屋にいるあなた以外のすべての⟦キャラクター⟧は、1⟦HP⟧を失う。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"HASTENED REGENERATION","ja":"再生の加速","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、1⟦HP⟧を回復する。"]],"n":""},{"c":"血の穢れ","s":"サングレヴォア","en":"SUPERIOR PERFORMANCE","ja":"覚醒する能力","e":[["","アクション（⟦アクションカード⟧を1枚捨てる）：\nこのカードを裏返しにして、⟦アクションカード⟧を2枚引く。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"APOCALYPTIC VISION","ja":"終末の幻視","e":[["","あなたが冷却システムにいる場合に：自爆プロシージャーを起動する。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"BLOOD SACRIFICE","ja":"血の生贄","e":[["","あなたの部屋に他の⟦キャラクター⟧がいる場合に：\n1⟦HP⟧を失って、このカードをその⟦キャラクター⟧の捨て山に移動する。"]],"n":"候補のキャラクターが複数いる場合には、手番順に従う。"},{"c":"汚染","s":"サングレヴォア","en":"BLOODLUST","ja":"殺戮衝動","e":[["","あなたの部屋に⟦イントルーダー⟧がいる場合に：\nあなたの部屋にいる⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は1⟦HP⟧を失う。\nあなたの部屋にいるすべての⟦イントルーダー⟧は、1ヒットずつダメージを負う。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"BREATHLESS","ja":"窒息","e":[["","あなたの部屋に他の⟦キャラクター⟧がいる場合に：\n1⟦酸素⟧を消費して、このカードをその⟦キャラクター⟧の捨て山に移動する。"]],"n":"候補のキャラクターが複数いる場合には、手番順に従う。"},{"c":"汚染","s":"サングレヴォア","en":"TERRIFYING AUDIENCE","ja":"恐怖の目撃者","e":[["","あなたの部屋にいる⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は⟦急襲（騒音ダイス）⟧を解決する。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"FROM DARKNESS","ja":"闇からの来訪","e":[["","あなたのセクションにいる⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧のいる部屋に隣接する通路に⟦シャドウマーカー⟧を1つずつ置く。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"FEAST FOR THE HUNGRY","ja":"捕食者の晩餐","e":[["","あなたの部屋に他の⟦キャラクター⟧がいる場合に：\nあなたの部屋に隣接する通路にグールを2体ずつ配置する。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"FORCED CEASEFIRE","ja":"強制停戦命令","e":[["","あなたの部屋に他の⟦キャラクター⟧がいる場合に：\n⟦弾薬⟧を消費して、このカードをその⟦キャラクター⟧の捨て山に移動する。"]],"n":"候補のキャラクターが複数いる場合には、手番順に従う。"},{"c":"汚染","s":"サングレヴォア","en":"GIFT FOR A KING","ja":"王への供物","e":[["","あなたの部屋にブラッドスペクターかキングがいる場合に：\n⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は2⟦HP⟧を失う。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"HYPNOTIC RULE","ja":"精神支配","e":[["","あなたの部屋に他の⟦キャラクター⟧がいる場合に：\nその部屋にいるすべての⟦キャラクター⟧は、手札にある汚染カード以外の⟦アクションカード⟧をすべて捨てる。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"NO PLACE TO HIDE","ja":"逃げ場なし","e":[["","あなたが⟦故障マーカー⟧があるコールドスリープルームにいる場合に：\n部屋に⟦火災マーカー⟧を置いて、1⟦HP⟧を失う。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"YOUR KING","ja":"汝の王","e":[["","あなたの部屋にキングがいる場合に：\n⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は戦術装備トークンを2つ捨てるか、2⟦HP⟧を失う。どちらにするのかはその⟦キャラクター⟧が選択する。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"NO RETREAT","ja":"退路無し","e":[["","あなたが⟦故障マーカー⟧がある着陸地点にいる場合に：\n部屋に⟦火災マーカー⟧を置いて、1⟦HP⟧を失う。このカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"PURIFYING FIRE","ja":"粛清の業火","e":[["","あなたの部屋に⟦火災マーカー⟧がなく、他の⟦キャラクター⟧がいる場合に：\nあなたの部屋に⟦火災マーカー⟧を置く。その部屋にいるすべての⟦キャラクター⟧は、手札にある汚染カード以外の⟦アクションカード⟧を2枚捨てる。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"SUFFOCATION SENTENCE","ja":"窒息の宣告","e":[["","あなたが⟦生命維持：稼働⟧の生命維持システム制御室にいる場合に：\nあなたのセクションの生命維持システムトークンを⟦生命維持：稼働⟧から⟦生命維持：停止⟧に裏返す。\nあなたの部屋に⟦故障マーカー⟧を置く。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"汚染","s":"サングレヴォア","en":"UNAVOIDABLE FEAR","ja":"避けられない恐怖","e":[["","あなたの部屋に⟦セキュアトークン⟧が1つ以上ある場合に：\nその部屋の⟦セキュアトークン⟧をすべて捨てる。あなたの部屋にいる⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧は、手札にある汚染カード以外の⟦アクションカード⟧をすべて捨てる。\nこのカードを汚染デッキに戻す。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"SLASHER","ja":"スラッシャー","e":[["","スラッシャーの攻撃によって⟦キャラクター⟧が重傷を負うか⟦HP⟧を失った場合に、そのスラッシャーは2回目の攻撃を行う。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"CRAWLMINE","ja":"クロールマイン","e":[["","部屋でクロールマインが殺されるたびに、イントルーダーの攻撃カードを3枚引く。『Boom!』のカードが1枚以上引かれた場合、その内の1枚の効果を解決する。\nその後、引いたカードをすべて、攻撃デッキにもどしてシャッフルする。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"IRONCLAD","ja":"アイアンクラッド","e":[["","部屋か通路にアイアンクラッドがいる場合、それらを最初のターゲットにしなければならない。\n通路にいるアイアンクラッドを殺すには、2 回のヒットを必要とする。\n部屋にいるアイアンクラッドを殺した場合、代わりに撃退する。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"FIRESPITTER","ja":"ファイアスピッター","e":[["","⟦キャラクター⟧がファイアスピッターがいる通路に対して掃射攻撃を行う度に、その⟦キャラクター⟧はまずその通路にいるファイアスピッターと同じ数の⟦HP⟧を失う。\nその後、掃射攻撃を解決する。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"TWITCHLING","ja":"トゥイッチリング","e":[["","部屋にいるトゥイッチリングはアダルトイントルーダーと同じルールでヒットを負う（よって、1ヒットで即座には死なない）。\nヒットがすでに適用されている状態でこのスキルが無効になった場合には、それらのトゥイッチリングは即座に死亡する。"]],"n":""},{"c":"スキル","s":"ネオフレッシュ","en":"CULTIST","ja":"狂信者","e":[["","⟦キャラクター⟧が狂信者にヒットや⟦クリティカル⟧を与える度に、その後で、その⟦キャラクター⟧は騒音ロールを行う。\n（狂信者を殺した際にこのスキルを無効化した場合、騒音ロールは行わなくてよい。騒音ロールをするより前にこのスキルが無効化されるため。）"]],"n":""},{"c":"ジリアン","s":"フェイズ","en":"XYRIAN PHASE","ja":"ジリアンフェイズ","e":[["","イベントカードを引く前に、ジリアンフェイズを解決する。\n\nマップ上にジリアンが1体以上いる場合：\nジリアンの行動カードを1枚引いて解決する。\nジリアントークンをイントルーダーバッグに加える。\n1つの部屋にジリアンが2体以上いる場合、最も負傷が少ないジリアン1体を⟦痕跡トークン⟧に置き換える。"]],"n":""},{"c":"ジリアン","s":"探査","en":"EXPLORATION","ja":"ジリアン探査カード","e":[["","ジリアントークンをイントルーダーバッグに加える。"],["","この探査の手順をすべて解決した後で、ジリアン1体と忠誠トークンを、あなたが移動した先の部屋に配置する。"],["","このカードをゲームから取り除き、探査カードをもう1枚引いてその内容を解決する。"]],"n":""},{"c":"ジリアン","s":"探査","en":"EXPLORATION","ja":"ジリアン探査カード","e":[["","⟦痕跡トークン⟧1個をあなたの移動元の部屋に置く。"],["","ジリアントークンをイントルーダーバッグに加える。"],["","このカードをゲームから取り除き、探査カードをもう1枚引いてその内容を解決する。"]],"n":""},{"c":"ジリアン","s":"イベント","en":"NEW COMMANDS","ja":"新たな指令","e":[["引いた時","このカードを引いた際に：\n施設内にいるジリアンが2体以下だった場合、コールドスリープルームにジリアン1体を新たに配置する。\n現在のラウンドが5ラウンド目か、それよりも早いラウンドだった場合、このカードを作戦任務の隣に置く。\n「公式命令」の目的カードを選択するキャラクターは、作戦任務とこのカードの要件の両方を達成しなければならない。\nイベントカードをもう1枚引いてその内容を解決する。"],["下半分","ジリアンアイテムを持った⟦キャラクター⟧が1人以上、施設から脱出せよ。"]],"n":""},{"c":"ジリアン","s":"イベント","en":"SERVANT HUNT","ja":"奴隷狩り","e":[["引いた時","このカードを引いた際に：\n⟦痕跡トークン⟧1個をコールドスリープルームに置く。\nこのカードの下半分が見えるようにして、このカードをジリアンフェイズカードの下に置く。以降は、ジリアンフェイズを解決する際に、このカードの内容も解決する。\nイベントカードをもう1枚引いてその内容を解決する。"],["下半分","すべてのジリアンが忠誠カードを持った⟦キャラクター⟧に向かって2回移動する。"]],"n":""},{"c":"ジリアン","s":"イベント","en":"QUEEN TRACKING","ja":"クイーンの追跡","e":[["引いた時","このカードを引いた際に：\n⟦痕跡トークン⟧1個をコールドスリープルームに置く。\nこのカードの下半分が見えるようにして、このカードをジリアンフェイズカードの下に置く。以降は、ジリアンフェイズを解決する際に、このカードの内容も解決する。\nイベントカードをもう1枚引いてその内容を解決する。"],["下半分","クイーンがマップ上にいる場合：\nすべてのジリアンがクイーンに向かって1回移動する。\nクイーンのいる部屋か、クイーンのいる通路に隣接する部屋にジリアンがいれば、それぞれがクイーンに⟦クリティカル⟧を与える。\nクイーンと同じ部屋にいるジリアンは⟦クリティカル⟧を負う。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","⟦生命維持：稼働⟧があるセクションのジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、重傷を1つ負う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","すべてのジリアンが着陸地点に向かって2回移動する。\n⟦着陸機⟧がある着陸地点にジリアンがいた場合、⟦着陸機⟧とこのカードをゲームから取り除く。\nそうでなければ、ラウンドトラック上にある⟦着陸機⟧を着陸地点にいるジリアンと同じ数のスペース分、上方向に移動する。"],["","このカードをデッキに戻して、デッキをシャッフルする。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","⟦生命維持：稼働⟧があるセクションのジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、重傷を1つ負う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","クイーンがマップ上にいる場合、すべてのジリアンがクイーンに向かって2回移動する。\nクイーンがいない場合、各ジリアンは最も近い⟦キャラクター⟧に向かって2回移動する。\nジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、2⟦HP⟧を失う。\n・クイーンに⟦クリティカル⟧を与える。"],["","クイーンが通路にいる場合、その通路に隣接する部屋にジリアンがいれば、各ジリアンはクイーンに⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","⟦生命維持：稼働⟧があるセクションのジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、重傷を1つ負う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","すべてのジリアンが着陸地点に向かって2回移動する。\nジリアンが移動を終えた各部屋に⟦火災マーカー⟧を置く。\n着陸地点にジリアンがいれば、着陸地点の戦術装備トークンをすべてゲームから取り除く。"],["","ジリアンの部屋にいるすべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、重傷を1つ負う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","ジリアンのいる部屋に⟦故障マーカー⟧を置く。\nその部屋に⟦ロボット⟧がいれば、⟦ロボット⟧にも⟦故障マーカー⟧を置く。\nすべてのジリアンは最も近い⟦キャラクター⟧に向かって1回移動する。"],["","冷却システムにジリアンがいれば、自爆プロシージャーを起動する。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、重傷を1つ負う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","脱出シャトルにジリアンがいれば、そのジリアンを脱出シャトルのスロットに配置する。\nすべてのジリアンは最も近い⟦キャラクター⟧に向かって1回移動する。"],["","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、2⟦HP⟧を失う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧は2⟦HP⟧を失う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","すべてのジリアンは最も近い⟦キャラクター⟧に向かって1回移動する。\nジリアンの部屋にいるすべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["","クイーンと同じ部屋にいるジリアンは⟦クリティカル⟧を負う。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧は2⟦HP⟧を失う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["それ以外のジリアン","いずれかの生命維持システム制御室にジリアンがいれば、そのセクションの⟦生命維持：稼働⟧/⟦生命維持：停止⟧を、反対側に裏返す。\nコールドスリープルームにジリアンがおり、コールドスリープをした⟦キャラクター⟧がまだ1人もいなければ、⟦コールドスリープ稼働⟧を⟦コールドスリープ停止⟧へと裏返す。\nそうでない場合、コールドスリープルームが発見済みであれば、すべてのジリアンがコールドスリープルームに向かって2回移動する。\nジリアンが進入したすべての部屋に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","作業用通路の入口が発見済みの場合：\nすべてのジリアンと、ジリアンと同じ部屋にいるすべての⟦キャラクター⟧を、作業用通路の入口に配置する。\n（騒音ロールは行わなくてよい）"],["それ以外のジリアン","すべてのジリアンは最も近い⟦キャラクター⟧に向かって1回移動する。\nジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧は2⟦HP⟧を失う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["","ジリアンの部屋と、そこに隣接する部屋の⟦セキュアトークン⟧をすべて捨てる。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","ジリアンに隣接するすべての通路に⟦騒音マーカー⟧を置く。\n\nジリアンと同じ部屋にいる、キャラクターボードにラーヴァがある⟦キャラクター⟧は、ラーヴァを捨てて、2⟦HP⟧を失う。"],["それ以外のジリアン","巣が発見済みであれば、すべてのジリアンが巣に向かって3回移動する。\nそのあと、いずれかのジリアンが巣にいれば、巣から卵を2個取り除く。\nジリアンの部屋にいるすべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"],["","デッキを作り直してシャッフルする。"]],"n":""},{"c":"ジリアン","s":"行動","en":"ACTIVATION","ja":"ジリアン行動カード","e":[["キャラクターと同じ部屋のジリアン","各ジリアンは、部屋にいるすべての⟦キャラクター⟧を伴って、ID番号が最も小さい通路を通って移動する（この移動に対しては追撃は発生しない）。\n移動した⟦キャラクター⟧は通常通りに騒音ロールを行う。ドアがあった場合、そのドアを破壊して移動を行う。"],["それ以外のジリアン","⟦イントルーダー⟧と同じ部屋にいるジリアンは⟦クリティカル⟧を負う。\nすべてのジリアンは最も近い⟦キャラクター⟧に向かって1回移動する。"],["","ジリアンは、今いる部屋に対して攻撃を行う。\n・すべての⟦キャラクター⟧はステータスカードを1枚受け取る。受け取れない場合は、2⟦HP⟧を失う。\n・すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"ヘルプ","en":"XYRIAN HELP","ja":"ジリアンヘルプカード","e":[["","ジリアントークンがバッグから引かれた場合、以下の処理を順番に解決する：\n1. マップ上にジリアンがいる場合、ジリアン行動カードを1枚引いて解決する。\n2. 各⟦痕跡トークン⟧を、ジリアンに置き換える。\n3. ジリアントークンを捨てる。バッグには戻さない。"],["","一般的ルール：\n・⟦キャラクター⟧はジリアンをイントルーダーとして扱う。\n・⟦キャラクター⟧はジリアンと同じ部屋にいても戦闘中とはならない。\n・ジリアンのいる部屋に⟦セキュアトークン⟧を新たに置くことはできない。\n・ジリアンは決して追撃は行わない。\nジリアンの負傷：\n・負傷トークンを持たないジリアンに致死のダメージを与えた場合、そのジリアンからすべてのヒットを取り除き、負傷トークンをジリアンのモデルの下に置く。\n・ジリアンの行動を解決する際に、負傷トークンを持つジリアンは行動をせずに、代わりにそのトークンを取り除く。\n移動：\n・ジリアンは部屋から部屋へと移動する。\n・ジリアンは⟦セキュアトークン⟧とドアを無視する。\n・ジリアンが⟦イントルーダー⟧がいる通路を通過する場合、その中で一番大きい⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"アイテム","en":"LIFE SUPPORT TECH","ja":"生命維持技術","e":[["取得時","このアイテムを取得した際に、重傷を1つ捨てて、3⟦HP⟧を回復する。"],["効果","パスをするたびに、 7⟦酸素⟧を獲得する。\nターンの終了時に、⟦火災マーカー⟧による⟦HP⟧の損失を無視する。"]],"n":""},{"c":"ジリアン","s":"アイテム","en":"COMBAT TECH","ja":"戦闘技術","e":[["取得時","このアイテムを取得した際に、重傷を1つ捨てて、3⟦HP⟧を回復する。"],["効果","あなたが⟦イントルーダー⟧に攻撃された後で：\nあなたが死んでいなければ、攻撃をした⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"ジリアン","s":"アイテム","en":"STEALTH TECH","ja":"ステルス技術","e":[["取得時","このアイテムを取得した際に、重傷を1つ捨てて、3⟦HP⟧を回復する。"],["効果","騒音ロールを行う際に、⟦急襲（騒音ダイス）⟧以外の結果をすべて無視する。"]],"n":""},{"c":"ジリアン","s":"ステータス","en":"ENTANGLED","ja":"拘束","e":[["効果","あなたはいかなる方法でも移動したり移動させられたりすることができない。"],["捨てる方法","このカードを捨てるために：\n1回のアクションとして、⟦アクションカード⟧を2枚捨てて2⟦HP⟧を失う。\nまたは\n破壊工作のアクションカードをプレイする。\n（カードに書かれた効果は解決しない）"]],"n":""},{"c":"ジリアン","s":"ステータス","en":"ENVENOMED","ja":"毒","e":[["効果","パスをするたびに、1⟦HP⟧と1⟦酸素⟧を失う。"],["捨てる方法","1⟦HP⟧以上を回復した時に、このカードを捨ててもよい。"]],"n":""},{"c":"ジリアン","s":"ステータス","en":"MARKED","ja":"標的","e":[["効果","あなたがパスをするたびに：\nすべてのジリアンがあなたに向かって2回移動する。"],["捨てる方法","手術室のルームアクションを行うことで、このカードを捨てることができる。\nそうした場合、そのルームアクションでは通常の手術室の効果は解決しない。"]],"n":""},{"c":"ジリアン","s":"忠誠","en":"ALLEGIANCE","ja":"忠誠カード","e":[["利用可能（表）","忠誠トークンのある部屋にいる⟦キャラクター⟧は以下のアクションを実行することができる：\n⟦アクションカード⟧を1枚捨てて、忠誠トークンをゲームから取り除く。このカードを取得する。"],["獲得（裏）","あなたはジリアンに対して武器を使用することはできない。\n\nジリアン行動カードの「それ以外のジリアン」のパートを解決する際に、ジリアンはあなたを無視する。\n\nあなたの部屋にジリアンがいる場合、以下のアクションを実行することができる：\n⟦アクションカード⟧1枚とアイテム1個をすてて、ジリアンの行動を1回解決する。\nこの行動中、ジリアンはあなたを完全に無視する。"]],"n":""}];const ICONS={"キャラクター": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACwAAAAvCAYAAACYECivAAAFKklEQVR42sWZa4hVVRTHf/c6TmpmqZWGYo4OpZklYoX4KimKshdUpGDqh5SIGAIjiEAM6UEIfsgh6MNoGJhmooJoUJQP7GGZUvkqbdJRc3RmnMbUcWb+fVkndpt97j3n3Nu4YDNzzl5rr7X3+e/1ujlJlImGAWOBEUAVMATYD3wBbCuXEiSVOkZLWiepS/H0taRJZdBVssH3SGpWMmqX9GypBudKgER/4HegXwqZLuBhYGtWpfkS0DQvpbGRvmVARXcbnANeyCg7Cngkq8FZd3oLUA3sBTpTyt4BjAc2dKfBEU0HmlLKHLENdyskOiKvmEH2LNDQ3QY3GxSGZZAdDhzuboObgM3AQynlbgeuAbZciUj3mKRGSTck5M9L2iVp6ZWKdD0kfS5pbUL+hZLqJQ0oxeBSAkcn8DgwNCE0ZgAPZvAq/w0AKUJzDlgCnACWO++vAy4BF4rIDwZOOc+zLKtbCRz/PzA8QVKbZWflyPKGSPpW0pw0ckkCRx9gCvAicNly3HJQg534M0AjsB34q9QTflnSJSdFbC7T6UZjo7N2h6T3S0kvK4E/gEHOuxZLKyPqaaMyMHJ2MTstMjYDrZ6OjcCjXvo5BjiQ5YSfCyTh7gnfrfR0UtJTMScc0YdZ3VpNETTtBv5MidvBQH0RnplWF6YKzRMsBYzoALAjUD2sS2nweWCP926fbd7NIGvSQmK584laJVVJujFw6aalhMTKwKWbIamfpKMO3xlJlUlD81WSmhzhuU4oPhvID06kKEKrYgxG0mRJnQ7/k0n98BOOJ/gUWOGE4qYALOZZQp4vMn4DjhaAyw7gbeA1e54LrE8CiV9sh5ck3eTN7Ze0T9ISSQMz+t7+kupMT6dzwkjqJanB9F8OJUoVMUkNwBrgpDe3DZhvHZ7ZwFtAe8qL9xIwzv4/ZHVhRBeBN4H3LKr+neSEa2yH4wNzfSVtU3log102X0elpaGrk/rhgYanHwJzbcBUYEGJecQiuyutgbl2oM6LqAVPeLW5mNcljTD 弾薬トークン'];const INSIDER=[{"n":1,"en":"Life Support Control A,B,C","ja":"生命維持システムA,B,C","t":"ドアが開かれると、耐え難い熱風が襲ってきた。\n反射的に目を覆う。燃え盛る炎を前に思考が暴走する。\n誰が燃やそうとしているのか？なぜ？ここで何が起きている？","x":[2]},{"n":2,"en":"Life Support Control A,B,C","ja":"生命維持システムA,B,C","t":"全てのセンサーが赤く点滅している。ちくしょう…火災が広がりすぎている。食い止める方法が無い。「施設全体が燃えている！」唸り声をあげる。「クソ！こうなったら酸素の流入を止めるしかない！行くぞ！！」","x":[3]},{"n":3,"en":"Life Support Control A,B,C","ja":"生命維持システムA,B,C","t":"部屋に駆け込む。女がそこいた。\n技術者らしくコンソールにかじりつき、最後のデータを更新するのに忙しそうだ。","x":[]},{"n":4,"en":"Drilling Station","ja":"掘削基地","t":"ドリルステーション…\n背筋がゾクゾクするが、それはドリルという漢のロマンに対してではなく、\n誰かが埋め込んだ大量の爆発物に対してだ。\nまぁ、イントルーダーを締め出すことには成功しているが…\nこれは天才の所業か？\nそれとも狂気の産物なのか？","x":[5]},{"n":5,"en":"Drilling Station","ja":"掘削基地","t":"通信は不明瞭で雑音にかき消されているが、なんとか意味は分かる。\n「閉じ込められたわ…手段がない…ちょっと…衝撃が…」\n状況は分かりやすい。\n妨害工作の主は自分自身を閉じ込めてしまい、抜け出せずにいる。\n直感が働く‐この女は基地について知っている事が多い。このまま死なせるには惜しい‐\n「救助に向かう」と通信を送り、行動を開始した。","x":[6]},{"n":6,"en":"Drilling Station","ja":"掘削基地","t":"部屋に飛び込んだ瞬間、生死を分けるギリギリのラインだと気付く。\n怯えている女に向かってイントルーダーが突撃している。\n即座に指を引き金にかけた。","x":[]},{"n":7,"en":"Surgery Room","ja":"手術室","t":"大量の血液が飛び散った床を踏みしめ、大虐殺の跡を見る。\n「誰かがここで有機生命体の手術を試みた…そして恐らく失敗した。」\nモニターに目をやると、その一つが冷凍睡眠室を映し出している。\nズームされた映像には睡眠ポッドと、そこでうごめく生物が見える。","x":[8]},{"n":8,"en":"Surgery Room","ja":"手術室","t":"部屋には臨床検査技師の女がいた。\n「会えて嬉しいわ。」青白い顔に微かに笑みを浮かべる。\n「貴方とシェアしたい物があるの。これよ。受け取って。」\n彼女は小瓶を強引に渡してくる。\n「本当は検査とかいろいろ必要なんでしょうけど、今は時間がないのです。これは私が開発した薬で、飲めばイントルーダーに気付かれずに動ける。これは奴らを欺き、人間を仲間だと思わせるのよ。」\nこちらの目に浮かぶ疑念を見た彼女は付け加えた。\n「さぁ飲んで！私も試したから。ちゃんと効くわよ。」","x":[9,10]},{"n":9,"en":"Surgery Room","ja":"手術室","t":"ただただ不味い。錆びた金属の味がする。\nこの場で全て吐き出したいが、ここは田舎の酒場じゃない。\n吐き気と共に飲み込む。\n今は科学を信じるべきだ。","x":[]},{"n":10,"en":"Surgery Room","ja":"手術室","t":"苦痛の叫びが空気を切り裂く。\n彼女が地面に倒れ無意識に痙攣している。\n本能的に距離を取り、武器を構え、周囲を見渡す…が、敵の姿は無い。\n代わりに、彼女の体が突然、内側から爆ぜた。\nむせ返す殺戮の場から、血と肉をかき分け、成熟し、致命的で、危険性を秘めたイントルーダーが這い出てきた。","x":[]},{"n":11,"en":"Server Room","ja":"サーバールーム","t":"部屋は空っぽだが、コンソールの上にメモだけがある。\nそれを手に取り読む。\n「データは全部消しちゃった☆コピーはあちしの身体のインプラントにあるよ★」\nメモを握り潰し、怒りのため息をつく\n「データが必要だ。この泥棒が致命的なバカをする前に探し出すぞ。」","x":[12]},{"n":12,"en":"Server Room","ja":"サーバールーム","t":"見つけた！脱出艇に向かって走る泥棒猫だ！\n女の意図は明らかだ。こちらも走り出す。\n「もう十分だ！」続けて叫ぶ「止まれ！そっちは危険すぎる！」\n彼女は止まり、怪訝そうな顔でこちらを見つめる。\n「それ…まぢ❓❓」\n「危険すぎる…」息を切らしながら続ける。\n「一緒に来い！我々のランダーはすぐに到着する！」","x":[13,14]},{"n":13,"en":"Server Room","ja":"サーバールーム","t":"ランダーの扉が閉まる。\n「おぢさんばいばーい✋」\nその言葉とは裏腹に泥棒猫の唇は引き締まり、目は決意に輝いている。\n今は一目見ただけで、生き残る為には何でもするし、誰も待ちはしない女だと分かる。\n驚きはしない。\n誰だってこの地獄から逃げ出したいって思うだろ？","x":[]},{"n":14,"en":"Server Room","ja":"サーバールーム","t":"『何が何でもその女性を脱出させろ』\n司令部の追加オーダーは大真面目だ。\n迷いは消えた。女の方を見る。\n「ランダーに乗るンダー☆」\n仕方なく頷く。\n「そうでございますお嬢様。私めがエスコート致します。」と吐き捨てた。","x":[]},{"n":15,"en":"Cooling System / Reactor","ja":"冷却システム / リアクター","t":"この部屋に集められている爆薬を眺めていると、突然、この基地を破壊するには十分すぎる量と気付く。\n慌てて配線を確認すると、ゾッとする様な結論が出た。\n「破壊計画をしているのが誰であれ、リアクターのパワーを使う様だ…」\n自分の呼吸が荒くなっているのに気付く。","x":[16,17]},{"n":16,"en":"Cooling System / Reactor","ja":"冷却システム / リアクター","t":"部屋にたどり着いた瞬間、銃声が鳴り響いた。\n本能的に身を屈めるが、銃弾はこちらを狙ってはいなかった。\nピストルを持った女が血まみれで倒れている。\nこちらの心臓も止まる。\n何が彼女をここまでさせたのか？\nそしてモニターに目をやると、自爆モードの最終カウントダウンが表示されている。\nダメだ…いやダメだダメだ…どうやって止めればいい？","x":[17]},{"n":17,"en":"Cooling System / Reactor","ja":"冷却システム / リアクター","t":"遅すぎた。\n自爆モードは始まり、あの女はカウントダウンを止める全ての手段を無効化していた。\n凶行に走った理由を考えるどころか、ビッチと罵る暇すらない。\nやる事は一つ。\n逃げろ。\n逃げなきゃ明日はない。","x":[]},{"n":18,"en":"Nest","ja":"巣","t":"巣に入るとスライムまみれの女がいた。\nサンプルを採取しながらこちらを見上げる。\n疲れ切っているようだが、目は輝いている。\n「やっとで分かったわ。」と囁く。\n「あいつらの弱点を解析する方法よ。卵をひったくるの。」\n笑い話だ。\n「卵をひったくる？俺は養鶏農家か？君の朝飯の為の卵なら、あいつらも喜んでシェアしてくれるさ。」\n「今必要なのは皮肉じゃなくて卵よ。」と彼女のお説教が始まった時、雄鶏が急に家に帰ってきた。恐怖の悲鳴を上げながら彼女は走り去る。\n「卵をお願い！」銃声が響く中でのオーダーだ。\n「私のテーブルまで！カリカリのベーコンもを添えてね！！」","x":[19]},{"n":19,"en":"Nest","ja":"巣","t":"10番テーブルに注文を届けると、彼女は感謝の言葉も忘れ、すぐに仕事を始めた。\n手術台に卵を置くと、コンソールにいくつものコマンドを打ち込む。\n最初は驚きもあったが、卵と彼女の仕事を見て言いたい事を飲み込んだ。\n彼女が夢中になっている理由はさておき、デートの誘い文句を考える時間は十分にありそうだ。","x":[20]},{"n":20,"en":"Nest","ja":"巣","t":"「分かったわ！」\n彼女は勝ち誇った様に叫んだ。\n「私は奴らの秘密を握った！ネットの閲覧履歴まで丸見えよ！！」\nデートはまだまだ先になりそうだ…","x":[]},{"n":21,"en":"Escape Shuttle","ja":"脱出艇","t":"誰かが…見覚えのない誰かが脱出艇に向かって走っている。\nその意図は明らかだ。\n「おい！止まれ！動くな！！」\nこちらの叫び声の後に女の声が響く。\n「待って！置いていかないで！」\n声の主はよろめきながら追いつこうとしていた。\n怪我をしている可能性が高い。\n逃走者はペースを上げる。\n時間は待ってくれない。\n事態が悪化する前に撃ちたい衝動に駆られるが、弾薬にも限りがある。\n覚悟を決める時だ。\nそいつは間も無く貴重な脱出艇と共に姿を消すだろう…","x":[22]},{"n":22,"en":"Escape Shuttle","ja":"脱出艇","t":"置き去りにされた女の肘を診ながら経緯を聞く。\n「友人と避難していました…けど、最後の瞬間、彼は自分の身を守るため私に襲いかかってきて…」\n身体的な傷以上に彼女はボロボロで怯えている。\n「私を…助けてください…」\n暫く続いた沈黙の後、重い口を開く\n「我々はランダーに乗る為の難しい段取りをしている。」\n彼女は安堵の表情を浮かべ、懇願する。\n「一緒に…避難させて下さい…お手伝いは出来ます…この施設には詳しいんです。」","x":[23]},{"n":23,"en":"Escape Shuttle","ja":"脱出艇","t":"「もうこれ以上待てないわ！！」\n彼女は予想外の叫びと共に着陸地点に向かって走り始めた。\nこれはデジャヴか？\nまた覚悟を決める時が来た。","x":[]},{"n":24,"en":"Decontamination Room","ja":"除染室","t":"科学者の女が出迎えてくれた。\n目を輝かせながら早口でしゃべる。\n「あたし、偉大な秘密を解析できたの！もちろんイントルーダーについてね。あいつらの最大の謎の一つを解き明かしたの。凄くない？もちろん、あなたには教えるよ。でも、これって界隈にもちゃんと広めた方がいいと思うの。ただ問題があって、あたしちょっち体調が悪いの。変な意味じゃなくてよ。だから、私を手術室に連れて行ってくれないかな？そっちの方がお互いの為になるよね！わかる？」","x":[25,26]},{"n":25,"en":"Decontamination Room","ja":"除染室","t":"部屋に入るや否や、彼女は説明し始める。\n「ここにはAIがコントロールする手術室なの。今はぜーんぶAIにおまかせ。ちょっと待っててね。」\nやっとで静寂が訪れるかと思ったのも束の間。AIは仕事が早いが空気が読めない。\n「あたしね。この手術の結果、トンデモない結論に達したの。いま生成されたアンプルを見てよ！あたしの体液から摘出された成分で作られたの！あ、これも変な意味じゃないからね！これこそ、あたしが寝る間も惜しんで研究した成果よ！」","x":[]},{"n":26,"en":"Decontamination Room","ja":"除染室","t":"彼女の働き者の口から喘ぎ声が漏れると、突然腹部を押さえたまま倒れこんだ。\n苦しんでいるのは間違いないが、激しく反応する感染チェッカーが救出を阻む。\n恋しかった静寂が今は恐ろしい。","x":[]},{"n":27,"en":"Emergency Room","ja":"応急処置室","t":"部屋には女がいる。\n「わたくしは医師でございます。」\n丁寧に彼女は続ける。\n「この基地にはスタッフの数に応じた酸素節約システムがあるのをご存じでしょうか？」\nいいえ、存じ上げません。\n「今、そのシステムを稼働した所でございます。」\nお嬢様は丁寧に付け加えた。","x":[28]},{"n":28,"en":"Emergency Room","ja":"応急処置室","t":"酸素節約システムが鍵だ。\n少しでもその仕組みを理解するべきだった。\n最後のスタッフを失った瞬間、施設は自動的にシステムをシャットダウンするようだ。\n狂った様に思考を巡らせるが、どの結論も意味をなさない。\nシステムは再起動もリブートも出来ない。\n全てが遅すぎる。\nあのお嬢様が死んだ後では…\nクソっ…","x":[]},{"n":29,"en":"Shelter","ja":"シェルター","t":"開錠パットの上で百戦錬磨の指が踊るが、どの組み合わせでもアソコは開かない。\n呼び鈴がわりのアラームボタンも不感症だ。\n最後は足技を使うが、蹴ってもビクンともしない。\nこんな強固な閉鎖は内側に人がいる証拠だ。\n「ドアを開けろ！聞こえているのか！？」\n「…で…きない…」\n女の弱々しい返事が返ってきた。\n「奴らに…一度捕まって…出血してる…た…助けて…応急パックを…パックを通気口から…」","x":[30]},{"n":30,"en":"Shelter","ja":"シェルター","t":"医療パックの使い方と手際の良さを見るに、この女は医師なのだろう。\n「あの…ありがとうございます。」言い淀みながら続ける\n「本当に…ご親切にどうも。ええっと…私に何か御用ですか？」\n「元気になったところで、アンタがガチガチにしてくれたアレを全部何とかしてくれないか？」\n「…アレ？」\n優しく説明すると、彼女は快く応じてくれた。","x":[31]},{"n":31,"en":"Shelter","ja":"シェルター","t":"女王は突然現れた。\nその眼は邪悪な知性で輝き、その動きは残像が残るほど速い。\nマイペースな女医の動きとは真逆で、一瞬でイかされそうだ。\nそして、彼女は一度逃がした獲物を再び連れ去った。","x":[]},{"n":32,"en":"Gunnery Room","ja":"砲術室","t":"砲術システムが稼働してる。\nこれは狡猾なAIが人には真似できない反応速度で砲身を操作し、\n準備万端24時間営業しているということだ。\n「悪い知らせだな…」独り言は続く。「システムに検知されたお客さんは敵味方関わらずハチの巣状態ってわけか…」\nこうなったら妨害者を見つけるしかない。\nそいつがシステムを稼働したって事だから、止め方も知っているハズだ。","x":[33]},{"n":33,"en":"Gunnery Room","ja":"砲術室","t":"女はこちらを見てショックを受けて、そして本能からか逃走を試みようとしている。\n「ちょ、待てよ！」優しく且つ強く呼びかける。\n「ぶっちゃげると、俺たちは救助隊だ。うちのチームならアンタを助けられる…メイビー」\n彼女の眼は全てを理解し輝いた。","x":[34]},{"n":34,"en":"Gunnery Room","ja":"砲術室","t":"あの狂った女を信用すべきじゃなかった。\n既に正気を失っているのは間違いない。\n「どうした？俺じゃダメか？」\nそう言いながら覗き込んだ彼女の表情は、\nつぶらな瞳と動物的で歪んだしかめっ面のアンバランスで成り立っていた。\n彼女に近づけは血を見る事になる。\n全てを敵とみなし、自分と心中しようとしている古き良き時代の女だ。","x":[]},{"n":35,"en":"Sprinklers Control","ja":"スプリンクラー制御","t":"配線は煙を上げ、目くらましの火花が上がる。\nモニターには故障の警告と共に破損した空気循環システムのデータが表示されている。\nまた別のモニターからは冷凍睡眠室の様子が見える。\n睡眠ポッドの一つが故障しているが、閉鎖状態のままだ。\n誰かが入っているに違いない。","x":[36]},{"n":36,"en":"Sprinklers Control","ja":"スプリンクラー制御","t":"ポッドが音を立てて開き、中から作業着を着た女が這い出てきた。\n意識は朦朧としている。\n最初は呟くだけだったが、だんだんと目の焦点が合ってきた。\n「この故障は何ですか？システムは問題ないはずです。睡眠ポッドを起動した時は大丈夫だった…私が修理します。」","x":[]},{"n":37,"en":"Alarm Room","ja":"警報室","t":"部屋で見かけた女に思わず手を振ると同時に何か不自然な動きをしてる事に気付いた。\nそして振る手が固まった…\n衝撃的なシーンだが、全ての疑問は解決した。\n女は血まみれのアンドロイドだ。\n「嘘だろ…早くプログラムし直さないと…アレは人類を狩り続けるぞ！！」","x":[38]},{"n":38,"en":"Alarm Room","ja":"警報室","t":"「これは役に立つ。」\n入手したデータの中身を、腕の装備のオプション画面で見ながら呟く。\n「アンドロイド安全モジュール。なるほど…あぁ、パスワードね。OKOK。パスワードを入手してアンドロイドに近いコンピューターでシステムに入れば、あの殺戮モードは止められる。」","x":[39]},{"n":39,"en":"Alarm Room","ja":"警報室","t":"アンドロイドのこちらへの敵意は無くなった様だ。\n審判の日を回避した事に心の底から安堵し、ため息をもらす。\n「暴れ足りないだろ？」\nアンドロイドに新たなプログラムをする。\n「我々に近づくな。イントルーダーを撃退しろ。」","x":[]},{"n":40,"en":"Experimental Military Lab","ja":"軍事実験室","t":"部屋で見つけたタブレットが点滅し、報告書のヘッダーが表示される。\n\"イントルーダー撲滅兵器の設計と運用\"\n眉をひそめながら報告書を読み進めると、典型的な軍事用語が並ぶが海兵隊のそれとは少し違う。\n”今なら施設の確保は可能だ。冷凍睡眠室と発着場にそれを設置する。”","x":[41,42]},{"n":41,"en":"Experimental Military Lab","ja":"軍事実験室","t":"冷凍睡眠室はまるで悪夢のワンシーンの様だった。\n煙が立ち込め、配線は破損し、壁からは火花が噴き出している。\n職員が入っていたポッドは全て解放され、バイタルサインは途切れている。\n惨状を目の前にし、更なる不安がよぎる。\n「報告書にはここの他に発着場にも触れていた…奴らの考えが分かったぞ！」","x":[42]},{"n":42,"en":"Experimental Military Lab","ja":"軍事実験室","t":"目の前の完全武装した軍人の女は、その装備以上の強固な意志を持っている様だ。\nこちらを狙っていたが、ゆっくりと武器を下ろす。\n「アンタ達の仕事はここまでだ。この施設から去れ！退避するなら手伝ってやる。」\n「あんたはどうする？」\n「私はここに残る。奴らに対する効果的な兵器は作ったが、まだこの施設で確認しなきゃいけない場所がある。発着場に向かうなら、同行してやってもいいぞ！」","x":[]},{"n":43,"en":"Security Robot Room","ja":"セキュリティロボットルーム","t":"部屋には女がいた。\n整備士の様だが、我々の入室に驚くと共に安堵している。\n「お会いできて嬉しいです。私一人ではどうにもならなくて…」\n「挑戦の機会をもらえるのはいつでも嬉しいですよ。」\n皮肉をギリギリ隠しながら答える。\n「で…何の用です？」\n彼女は話し始める。\n「ロボットです。この子は風邪を引いてるの。みんなでリアクターまで運んでくれれば、私がすぐに診察して治しますよ。」\nはぁ…よし。では早速始めよう。","x":[44,45]},{"n":44,"en":"Security Robot Room","ja":"セキュリティロボットルーム","t":"無言のまま、ロボットを整備している様子を眺める。\n彼女の手は素早く無駄がない。\n「もう少しで終わります…ソフトウェアの改良と再接続をしてっと…あぁ、気にしないで。要するに、私はこの子の隠し機能\"マルチバースモード\"をアクティブにしたって事。これで、この子も私達ももう大丈夫だわ。」","x":[45]},{"n":45,"en":"Security Robot Room","ja":"セキュリティロボットルーム","t":"聞く事は無いと思っていた不吉なアラームが鳴り響く。\nこの意味は深刻だ。\n彼の母親が死んだのだ。\n天涯孤独の身となり、虚無を感じたセキュリティロボットは「エブリシング・エブリウェア・オール・アット・イレース」を実行する。","x":[]},{"n":46,"en":"Technical Corridor Entrance","ja":"作業用通路入口","t":"予期せぬ音に思わず驚き飛び退いた。\n女が通気ダクトから這い出て来たのだ。\n「驚かないで」\n「全然ビビッてねぇよ」\n「あらそう？私はここの保守監督官よ。各種作業用通路を含め、この施設には詳しいから安全な移動の手助けは出来るわ…とはいえ、私はサーバールームに用事があるの。連れて行って下さる？」","x":[47]},{"n":47,"en":"Technical Corridor Entrance","ja":"作業用通路入口","t":"サーバールームは監督官様の実家の様だ。\nくつろぎながらも素早くシステムにログインし、必要なデータを全てダウンロードする。\n「見て。施設内全ての監視カメラと繋がったの。これで部外者の動きは全て把握できるわ。」","x":[48]},{"n":48,"en":"Technical Corridor Entrance","ja":"作業用通路入口","t":"あの監督官は嘘つきではでないが、『部外者』に我々が含まれている事に今気付いた。\nこの女の思惑は脱出艇の発射準備が整っているかを確認し、出来るだけ早くここから脱出する事だった。\nこれが仕事が出来る女って事か…","x":[]},{"n":49,"en":"Armory","ja":"武器庫","t":"武器庫に足音がこだまする。\n完全に空っぽだ。\n取るものどころか、見るものさえない。\nギアは全て避難済みって事か…\nハードラックとダンスっちまったぜ。","x":[50]},{"n":50,"en":"Armory","ja":"武器庫","t":"女が走ってこちらに向かってきた。\n「お会いできて嬉しいです！武器庫からお戻りですか？」\n「あぁ…無駄足だったよ。誰もいない、それだけだ。」\n彼女は少し恥ずかしそうに答えた。\n「…ごめんなさい。それ私なんです。あちこちに隠したものがあるの。」","x":[]},{"n":51,"en":"Door Control Room","ja":"ドア制御室","t":"女が文句を言いながらコンピューターと睨めっこしている。\n「システム全体はとっくの昔に更新されてるのに！」\nハードウェアにも明るいオペレーターの彼女は、原因究明の為にメンテナンスボックスのネジを外そうとしている。\n「ここがダメならあｔ…」\n突然の爆破がそれを拒絶し、彼女を地面に投げ飛ばした。\nそして、全てのコンピューターが即座に停止する。\n「たすけて…」重傷を負ったが辛うじて彼女は生きていた。","x":[52,53]},{"n":52,"en":"Door Control Room","ja":"ドア制御室","t":"「死ぬかと思ったわ…」と囁く彼女に手際よく手当てを施す。\n仕上げにアドレナリンを投与すると、すぐに立ち上がれる様になった。\n「歩けますか？」\n「大丈夫よ。」歯を食いしばりながら彼女は答える。\n「よかった。あなたのコンピューターの専門知識が役に立つかもしれません。」","x":[53]},{"n":53,"en":"Door Control Room","ja":"ドア制御室","t":"オペレーターは死んだ。\nだが、彼女の亡霊はまだここで働いている様だ。\n彼女が死ぬ直前にリファクタリングしていた自動自爆手順が走り始めた事に気付き、血の気が引くのを感じた。","x":[]},{"n":54,"en":"Pressure Control","ja":"プレッシャーコントロール","t":"部屋には、目に見えて震えている女がいた。\nこちらを見て、彼女は歓喜の声を上げた。\n「あなたに逢えて本当に嬉しいの！１秒が5分くらい長く感じてたわ。システムは持ちこたえてくれたけど、私の命は常に危険にさらされていたわ。けど、今は生まれ変わった気分！これはきっと運命！私はなんて…」\n彼女は白馬の王子様に会えて嬉しいし、そのままお城まで連れて行ってくれるのを望んでいる。\nしかしだ、このお姫様のミュージカルは終わる気配がしない。\nそして、トラブルの予感しかない…","x":[]},{"n":55,"en":"Supply Room","ja":"補給庫","t":"モニター越しに冷凍睡眠室が見え、誰かが睡眠ポッドに隠れた事に気付く。\nその女は高級なスーツを身にまとった企業の高級管理職であることがすぐにわかった。\n自分の懐が寒い事を思い出す。","x":[]}];const TEX={"setup": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA0JCgwKCA0MCwwPDg0QFCIWFBISFCkdHxgiMSszMjArLy42PE1CNjlJOi4vQ1xESVBSV1dXNEFfZl5UZU1VV1P/2wBDAQ4PDxQSFCcWFidTNy83U1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1NTU1P/wgARCAF6A4QDASIAAhEBAxEB/8QAGQABAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/9oADAMBAAIQAxAAAAH4nOZuN656M651e/O8k1cRdsDdwN85lenTltNJhEka3049Etxo25VOuJTOOmVy6ZXd8/RPROdS8tl5u2TlpzXrrgT0Tn0N6wTWc5X1zz9US5LnEGsiyF2zU6YCzMN3FNXmOsxTVg3M0rA6ZzDTGTtnMGVXLpkNC9Oe0uHJejiO0yN5YNsw3IN651Ns4Os507MjON4Nazo52VemNxOc1hbQWCsQ3rl1LkTMpVQamhKJAu+OztM6TE6Q556cl1vjo9M5VO056Gd6PNvryLqDM3TO7yNSZLFFlJpRN5I7DlNZMt5EUlQtlKlM1BneTO3QzULlDTEOk5F6M1M43lZqU1ZURhdMjRDVhKzoyo2FmN4TVZIF6Z1Ew1lRS43E5tVS5GsbMyhENa57N5pM52XndaJqEM5XrzmzLdOU6jndQdOWj0c9RIgtyN5uTWd 7P/2Q=="};const TIPS={"T": {"アクション|CHAIN OF COMMAND": ["着陸機の到着を1ラウンド早める／遅らせるか、ランクが低い仲間に移動・射撃・掃射をさせる。", "着陸機の到着を早めれば脱出が早まり、遅らせれば準備の時間が稼げる。指令は仲間の手番を使わずに動かせる。リアクションで、自分に向けられた指令を無効にできる。", "指令はランクが自分より低い相手にだけ。追撃を受ける移動は命令できない。"], "アクション|DEMOLITION": ["手の届くドアを1つ壊すか、自分の部屋に故障マーカーを置く。", "閉じたドアで進めないときの突破口。故障マーカーを置く方は、他の人に部屋（脱出用の部屋など）を使わせない妨害にもなる。", "壊したドアは二度と閉じられない。"], "アクション|REPAIRS": ["カード1枚を追加で捨てて故障マーカーを1つ外すか、手の届くドアを1つ開け閉めする。", "壊れた部屋（生命維持システム制御室・脱出用の部屋）や武器を直せる。ドアを閉めてイントルーダーを足止めできる。", ""], "アクション|FAST REPAIRS": ["故障マーカーを1つ外すか、手の届くドアを1つ開け閉めする（追加コストなし）。", "「修理」の上位版。カード1枚で直せる。", ""], "アクション|REST": ["手札の感染カードをスキャンし、陰性だったカードをゲームから取り除く。", "陰性の感染カードを減らせる数少ない手段。ゲーム終了時の羽化で死ぬ確率が下がる。陽性ならラーヴァが付くので、その後に手術室で取り除く。", "スキャンするのは手札の感染カードだけ。陽性が1枚でもあるとラーヴァが付く。"], "アクション|SEARCH": ["今いる部屋のアイテムアイコンの数だけアイテムを引き、1枚を選んで取る。", "アイテムを手に入れる基本の方法。アイコンが多い部屋ほど選択肢が多い。", "選ばなかったカードは他の人に見せずにデッキの一番下へ。"], "アクション|SECURE": ["自分の部屋にセキュアトークンを2個置くか、カード1枚を追加で捨てて隣の空の通路を1つ補強する。", "セキュアトークンは部屋に入ってくるイントルーダーの攻撃を1回ずつ防ぐ。補強した通路には騒音ロールで騒音マーカーが置かれなくなる。", "セキュアトークンは1部屋3個まで。イントルーダーがいる部屋には置けない。補強できるのは、キャラクターかロボットがいる部屋へつながる空の通路。"], "アクション|FAST SECURE": ["「安全確保」の上位版。補強のときもカードを追加で捨てなくてよい。", "", ""], "アクション|TAKING AIM": ["射撃攻撃か掃射攻撃を行い、1回目の結果が悪ければ振り直せる。", "倒したい相手を確実に倒したいときに使う。", "振り直したら2回目の結果を必ず使う。"], "アクション|COMPUTER SKILLS": ["コンピューターのある部屋で、その部屋を使用するか、施設内のドアを1つ開け閉めする。", "「部屋を使用する」（通常カード2枚）をこのカード1枚でできる。遠くのドアも操作できる。", "コンピューターのアイコンがある部屋にいるときだけ。"], "アクション|ALWAYS PREPARED": ["部屋を使用する（その後で部屋のイントルーダー全員に攻撃される）か、カード1枚を捨ててアイテムを2枚引き1枚取る。", "イントルーダーがいない部屋なら、部屋の使用（通常カード2枚）がこのカード1枚でできる（Awaken Realms社に確認済み）。", "イントルーダーがいる部屋で使うと全員から攻撃される。"], "アクション|DUCK AND COVER": ["カード1枚を追加で捨てて移動し、その移動中の攻撃を1回防ぐ。リアクション：自分が攻撃されるとき、同じ部屋の別の人に身代わりさせる。", "戦闘中の部屋から逃げるとき、追撃を1回減らせる。リアクションは他の人の手番でも使える。", "防げるのは移動中の攻撃1回だけ。騒音ロールや探査カードの進入時効果で起きた攻撃は防げない。手札が足りないと使えない。"], "アクション|WEAK SPOT": ["イントルーダー1体に1ヒットを与えてから、射撃攻撃か近接攻撃をする。", "射撃は「出目≦ヒット数」で倒せるので、先に1ヒット置くと倒せる確率が上がる。", ""], "アクション|FORCING FIRE": ["遠距離武器の弾薬を消費して、自分の部屋のイントルーダーを全員撃退する。", "戦闘中の部屋を一気に空にできる。押し出す通路は自分で選ぶ。", "撃退した先の部屋にキャラクターがいると、その人が攻撃される。"], "アクション|MOVE QUIETLY": ["騒音ロールをせずに、発見済みの部屋へ移動する。", "騒音ロールなしで移動できる数少ない手段。危ない部屋の近くや、脱出前の移動に。", "未発見の部屋（未探査の通路）へは使えない。追撃は普通に受ける。"], "アクション|FIRE AT WILL": ["着陸機を1マス動かすか、自分の部屋か隣の部屋にいる全員に、同じ通路へ掃射させる（指令）。", "複数人で同じ通路を一斉に掃射でき、大きな群れを一掃できる。各自の手番を使わない。", "各キャラクターの弾薬は消費される。"], "アクション|FIRST IN COMMAND": ["着陸機を1マス動かすか、ランクが低い仲間1人に移動・射撃・掃射をさせる（指令）。", "「指揮系統」と同じ指令効果。オフィサーは指令カードを多く持つ。", ""], "アクション|LET'S GO!": ["着陸機を1マス動かすか、移動する。そのとき仲間1人を連れて行ける（同意不要）。", "連れて行かれた人は騒音ロールをしない。一緒に脱出用の部屋へ向かうときに便利。", "騒音ロールで来るイントルーダーは、カードを使った本人を攻撃する。"], "アクション|OFFICER'S CHANNEL": ["着陸機を1マス動かすか、手札の「指令」カードをもう1枚出し、その範囲を施設全体に広げる。", "遠く離れた部屋の仲間にも指令（移動・射撃・掃射、全員掃射、全員1枚引く）を出せる。", "範囲以外の条件（ランクが低い相手のみ・追撃を受ける移動は不可）はそのまま。手札に指令カードがないと使えない。"], "アクション|STAY CALM": ["着陸機を1マス動かすか、自分の部屋か隣の部屋の全員が1枚引く（指令）。リアクション：同じ部屋の誰かへの攻撃を1回防ぐ。", "リアクションで仲間を守れる。手札補充で仲間の行動回数を増やせる。", ""], "アクション|SPRINT": ["移動する。さらに酸素を1払えば、もう一度移動できる。", "カード1枚で2部屋進める。遠くの脱出用の部屋へ急ぐときに。", "2回とも騒音ロールと追撃は普通に起きる。"], "アクション|SCOUTING": ["発見済みの部屋へ慎重な移動（通常カード2枚）をするか、未探査の通路を通って探査し、移動先でアイテムを探す。", "探査とアイテム探索を1枚でまとめてできる。慎重な移動ならセキュアトークンも置ける。", "騒音ロールは必要。探査では探査カードの進入時効果に従う。奇襲されても死ななければアイテムは取れる。"], "アクション|SHOOT FIRST": ["空の通路を通って移動し、その途中の好きなタイミングで射撃か掃射を1回する。", "戦闘中の部屋から出る前に撃てる。倒せれば追撃を受けずに出られる。1枚で移動と攻撃の両方。", "通るのはイントルーダーがいない通路だけ。攻撃は1回だけ。"], "アクション|EXPLOSIVES": ["グレネードトークンを1つ捨てて、自分の部屋から別の発見済みの部屋へ新しい通路を作るか、黄アイテムのある部屋でグレネードを1つ取る。", "近道を作れる。グレネードの補充にもなる。", ""], "アクション|TACTICAL RETREAT": ["カード1枚と弾薬を払い、空の通路を通って移動する。仲間1人を連れて行ける（同意必要）。移動中の攻撃をすべて防ぐ。", "戦闘中の部屋から追撃なしで抜け出せる。重傷の仲間を連れて逃げられる。", "イントルーダーがいる通路は通れない。移動後の騒音ロールや探査カードの進入時効果による攻撃は防げない。"], "アクション|PYROTECHNICS": ["火災マーカーを1つ取り除くか、グレネードを1つ捨てて隣の通路のイントルーダー全員にクリティカルを与える。", "グレネード1個で通路の群れを全滅させられる（掃射ダイス不要）。", ""], "アクション|BASIC SECURE": ["カード1枚を追加で捨ててセキュアトークンを2個置くか、隣の空の通路を補強する。", "「安全確保」より少し重いが同じ働き。", ""], "アクション|HEADSHOT": ["弾薬のあるスナイパーライフルで、カード1枚を追加で捨てて、隣の部屋のイントルーダー1体にクリティカル。", "隣の部屋の敵を確実に倒せる。クイーンにも有効。", ""], "アクション|HOLD POSITION": ["自分の部屋にセキュアトークンが2個以上あれば、カードを2枚引く。", "守りを固めた部屋で手札を増やせる。", ""], "アクション|ONE BY ONE": ["弾薬のあるスナイパーライフルで、「隣の通路に1ヒット→射撃ダイス」を何度でも繰り返せる。", "1枚で通路のアダルト・ラーヴァを次々に倒せる。弾薬が減るのはクリティカルか弾薬マークが出たときだけ。", "通路のドローンとアイアンクラッドは倒せない（1回の攻撃で2ヒット必要なため。BGGの非公式FAQ、Awaken Realms確認済み）。"], "アクション|AUTODESTRUCTION": ["UAVを最大4回動かすか、UAVを自爆させる：UAVの部屋と隣の通路すべてのドアを壊し、イントルーダー全員にクリティカル、キャラクター全員に3ダメージ。", "大きな群れやクイーンを丸ごと吹き飛ばす切り札。", "UAVはゲームから取り除かれる。部屋に故障マーカーと火災マーカーが置かれる。仲間も巻き込む。"], "アクション|DEFENSE SYSTEMS": ["UAVを最大2回動かすか、隣の部屋のUAVのところへ騒音ロールなしで移動する。リアクション：UAVの部屋で誰かが受ける攻撃を1回防ぐ。", "UAVを先に送っておけば、安全な移動先や防御拠点になる。", ""], "アクション|EXPLORATION": ["UAVを最大2回動かすか、UAVで未探査の通路の先を探査する（進入時効果なし）。", "自分は危険を冒さずに部屋を発見できる。", ""], "アクション|PICKUP AND DELIVERY": ["UAVのいる部屋から物を取ってくる（巣なら卵、着陸地点なら戦術装備トークン、他の部屋ならアイテム1枚）。その後UAVを自分の部屋へ戻す。", "危険な巣の卵を安全に手に入れられる。", ""], "アクション|ADRENALINE BOOST": ["酸素1を払ってカード2枚を引ける。同じセクションの仲間も同じことができ、使った人は接続トークンを受け取る。", "セクションの全員で手札を増やせる。", "接続トークンを持つと「掌握」で操られる。"], "アクション|SLOWER METABOLISM": ["HP1を払って酸素2を得られる。同じセクションの仲間も同じことができる（接続トークン）。", "酸素切れの対策。", ""], "アクション|NEURAL CONNECTION": ["自分と同じセクションの仲間が、コストなしで射撃か掃射をしてよい（接続トークン）。", "セクション全員による一斉攻撃。", ""], "アクション|TAKEOVER": ["同じセクションの接続トークンを持つ人1人に、移動・射撃・掃射をさせる。リアクション：接続トークンを持つ人のアクションを無効にする（コストは払わせる）。", "仲間を操れる。裏切り者の行動を止めることもできる。", ""], "アクション|BREAKTHROUGH": ["遠距離武器で掃射し、その通路を通って移動する。移動中の攻撃をすべて防ぐ。", "通路を掃射してから突破できる。群れを削りながら追撃なしで抜けられる。", "移動後の騒音ロールなどの攻撃は防げない。"], "アクション|CONTINUOUS FIRE": ["弾薬のあるブレン軽機関銃で、捨てたカードの枚数だけ隣の通路にヒット。その後さらに掃射してよい。", "手札を弾に変えて大量のヒットを出せる。", ""], "アクション|FAST RELOAD": ["遠距離武器に自分の弾薬トークンを1つ入れることと、射撃か掃射を、好きな順番で行う。", "装填と攻撃を1枚でできる。", "サプライからではなく、自分の戦術ベルトなどにある弾薬トークンを使う。1個だけ（Awaken Realms確認済み）。武器に空きスロットが必要。"], "アクション|COMBAT DRUGS": ["医療パックを1つ捨てて、同じ部屋のキャラクター1人が手札3枚まで引く。", "手札が尽きた仲間を立て直せる。", "感染カードも手札に数える。"], "アクション|FIELD SURGERY": ["カード1枚を追加で捨てて、同じ部屋の誰かの重傷を1つ治す。その後、自分が医療パックを捨てるか、相手が感染カード1枚を受け取る。", "手術室に行かずに重傷を治せる。", "他の人を治すときは相手の同意が必要。"], "アクション|FIRST AID": ["HPを1回復するか、緑アイテムのある部屋で医療パックトークンを1つ取る。", "", ""], "アクション|HIPPOCRATIC OATH": ["同じ部屋に重傷を負った仲間がいれば、イントルーダー1体に2ヒットを与えてから射撃か近接攻撃。", "2ヒット置いてから撃つので倒しやすい。", ""], "アクション|FIGHT FIRE WITH FIRE": ["火災マーカーを取り除くか、アイテムかトークンを1つ捨てて部屋に火災マーカーを置く。", "火災で部屋のイントルーダーを毎ラウンド削れる。巣を燃やせば卵を減らせる。", "火災マーカーが尽きると施設が破壊される。"], "アクション|TECHNICAL CORRIDORS": ["黄アイテムのある部屋から、カード1枚を追加で捨てて、施設内の黄アイテムのある別の部屋へ移動し、パスする。", "遠くの部屋へワープできる。", "騒音ロールは必要。今いる部屋のイントルーダーからの追撃も受ける。移動後はパス。"], "アクション|NERVES OF STEEL": ["自分の手番中、イントルーダー1体から攻撃を受けるときに、その攻撃を防ぐ。", "追撃・騒音ロールの奇襲・近接攻撃の反撃など、自分の手番中の攻撃を1回無効にする。", "イントルーダーフェイズの攻撃には使えない。防ぐのは攻撃だけで、脱出用の部屋の失敗判定は変わらない。"], "アクション|FULL AUTO": ["ソルジャーの銃で、掃射攻撃を何回でも行う。", "1枚で通路を次々に掃射できる。撃つたびに別の通路を選べる。", "掃射のたびに弾薬を消費する。弾薬が尽きたら終わり。途中で装填はできない。"], "アクション|ADRENALINE": ["自分の部屋にイントルーダーがちょうど1体いれば、カードを2枚引く。", "", ""], "アクション|RECONNAISSANCE": ["未探査の通路を通って移動し、探査カードを2枚引いて好きな方を使う。", "安全な部屋やアイテムの多い部屋を選んで開けられる。", ""], "アクション|SCAVENGING": ["部屋のアイテムアイコンの数だけ引き、2枚を取る（普通の探索は1枚）。", "アイテム集めの効率が倍。", ""], "アクション|FANNING": ["旧式六連発拳銃の弾丸を好きな数だけ使い、同じ数のヒットを隣の通路か、自分の部屋のイントルーダー1体に与える。", "通路なら1ヒットで1体倒せる。部屋の敵にヒットを溜めてから射撃すると倒しやすい。", "部屋のイントルーダーはダイスを振らないヒットだけでは死なない（ラーヴァ以外）。"], "アクション|FISTFUL OF BULLETS": ["旧式六連発拳銃に弾丸を1発込め、捨てたカードの枚数だけさらに込める。", "", ""], "アクション|BASH WITH THE BARREL": ["旧式六連発拳銃で近接攻撃し、反撃は武器に故障マーカーを置かずに防ぐ。", "反撃を受けない近接攻撃。", "近接攻撃なので感染カード1枚は受け取る。"], "アクション|AUTHORITY": ["自分の部屋か隣の部屋のキャラクター1人に、移動・射撃・掃射をさせる。", "ランクの条件がない指令のような効果。", ""], "アクション|DEFENSE PLAN": ["セキュアトークンを最大3個置くか、カード1枚を追加で捨てて隣の空の通路を補強する。", "1枚で部屋をセキュアトークンの上限まで固められる。", ""], "アクション|STUN": ["手札3枚以下のキャラクター1人に、手札を全部捨ててパスさせる。または、武器に故障マーカーを置き感染カード1枚を受け取って、部屋のイントルーダーを1体撃退する。", "裏切りそうな人や、自分と目的がぶつかる人の行動を止められる。", "対象は同じ部屋の人と読むのが自然（局所的な効果）。撃退は代償が重い。"], "アクション|IT SHOULD WORK": ["故障マーカーがあっても部屋を使用するか、アイテムかロボットの故障マーカーを1つ外す。", "壊れた脱出用の部屋や生命維持システム制御室を、直さずにそのまま使える。", ""], "アクション|CLEAN UP": ["故障マーカーを1つ外すか、火災マーカーを取り除く。", "", ""], "アクション|JURY RIGGING": ["カード1枚と黄アイテム1つを捨てて、支援装備を3枚引き1枚取る。", "強力な支援装備を手に入れるチャンス。", ""], "アクション|RISK ASSESSMENT": ["コンピューターのある部屋で、イベントデッキの一番上を見て、上か下に戻す。", "危険なイベントを先送りできる。", ""], "アクション|INTRANET": ["コンピューターのある部屋から、施設内のコンピューターのある別の部屋を使う。", "遠くの部屋の効果を使える。", ""], "アクション|BLOCKING ACCESS": ["コンピューターのある部屋を使うか、コンピューターのある別の部屋に故障マーカーを置く。", "他の人に部屋を使わせない妨害にも。", ""], "アクション|DESPERATE ATTACK": ["イントルーダー1体に2ヒットを与えて近接攻撃。反撃はアイテム1つを捨てて防いでもよい。", "2ヒット置くので倒しやすい。", "近接攻撃なので感染カード1枚。"], "アクション|VENTS": ["カード1枚を追加で捨てて施設内の好きな部屋へ移動する。両方の部屋のセキュアトークンは全部捨て、アダルトの攻撃を1回受ける。", "どこへでもワープできる。", ""], "アクション|OBSTINATE": ["カードを1枚＋重傷の数だけ引くか、アイテム1つを捨てて重傷を1つ治す。", "重傷が多いほど手札が増える。", ""], "アクション|DISTRACTION": ["アイテムかトークンを1つ捨てて移動し、移動中の攻撃をすべて防ぐ。", "イントルーダーがいる通路も追撃なしで突破できる。", "移動後の騒音ロールや探査カードの進入時効果による攻撃は防げない。"], "アクション|WEIRD METABOLISM": ["感染カード1枚を捨ててカード2枚を引くか、巣にいればHP2回復か重傷1つを治す。", "", ""], "アクション|SENSITIVE HEARING": ["自分のセクションの通路から騒音マーカーを1つ取り除くか、置く。", "危ない騒音マーカーを消せる。", ""], "アクション|INCONSPICUOUS": ["急襲（騒音ダイス）を解決するときに、それを無視する。", "奇襲を1回なかったことにできる。", ""], "アクション|NEURAL LINK": ["施設内のどこにいるロボットでも起動するか、スマートガンの故障マーカーを外す。", "", ""], "アクション|OVERRIDE": ["コンピューターのある部屋で、どのセクションの生命維持でも切り替えるか、スマートガンの故障マーカーを外す。", "生命維持システム制御室へ行かずに酸素を確保できる。", ""], "アクション|OVERMIND": ["カード1枚と細胞標本1つを捨てて、自分のセクションのイントルーダー1体を好きな方へ動かす。", "戦闘中のイントルーダーも動かせる（Awaken Realms確認済み）。", ""], "アクション|FIELD EXPERIENCE": ["細胞標本を1つ置く。リアクション：バッグからトークンが引かれた直後に、細胞標本1つを捨てて引き直させる。", "クイーンなど危険なトークンを引き直させられる。", ""], "アクション|VIVISECTION": ["探査アームを持っていれば、細胞標本の数だけヒットを与えてから探査アームで近接攻撃。または探査アームの故障マーカーを外す。", "標本が多いほどほぼ確実に倒せる。標本は減らない。", "近接攻撃なので感染カード1枚。"], "アクション|CONNECTION": ["コンピューターのある部屋から施設内のロボットを起動するか、ロボットかコンピューターがある部屋を使用する。", "", ""], "アクション|PILOTING": ["着陸機かロボットがある部屋で隣の通路に掃射ダイス分のヒットを与えるか、着陸機を1マス動かす。", "弾薬なしで掃射できる。", ""], "アイテム|AMMO": ["弾薬トークンを1つ得る。取った直後ならコストなしで使える。", "", ""], "アイテム|ANTI-AIRCRAFT CODES": ["コンピューターのある部屋で、対空防御トークン2枚をこっそり見て、好きな順に並べ替える。", "着陸機を確実に着陸させられる（上を「停止」にする）。逆に他の人の脱出を妨害もできる。", "故障マーカーがある部屋では使えない。"], "アイテム|EXPLORING DRONE": ["隣の未探査の部屋を、移動せずに探査する（進入時効果なし）。", "危険を冒さずに部屋を発見できる。", ""], "アイテム|FLASHBANG": ["移動し、その移動中の攻撃をすべて防ぐ。", "イントルーダーがいる通路も追撃なしで突破できる。", "移動後の騒音ロールや探査カードの進入時効果による攻撃は防げない。閉じたドアは通れない。"], "アイテム|GRENADE": ["隣の通路にグレネードを1発（掃射ダイス＋2ヒット）か、グレネードトークンを1つ得る。取った直後ならコストなし。", "通路の群れを一掃できる。", ""], "アイテム|PERSONAL LOG CODES": ["コンピューターのある部屋で、施設内のキャラクター1人の目的カードをこっそり見る。", "裏切り者（裏の動機・自己保身）を見つけたり、自分が狙われていないか確かめたりできる。", "見た内容は話してよい（嘘も可）が、カードを見せることはできない。"], "アイテム|PORTABLE BARRIER": ["手の届く場所に閉じたドアを1つ置く（ドアスロットがない場所や壊れたドアの場所にも）。", "イントルーダーの進路をふさげる。", ""], "アイテム|MILITARY TASER": ["部屋のイントルーダーを1体撃退するか、キャラクター1人の手札を全部捨てさせる。", "", "使い捨ての重量アイテム（英語版の表記）。"], "アイテム|REMOTE DETONATOR": ["自分のセクションのセキュアトークンがある部屋で、セキュアトークンを1つ捨て、そこのイントルーダー全員にクリティカル。", "離れた部屋の群れを一掃できる。", "その部屋にいるキャラクターは3ダメージ。"], "アイテム|ADRENALINE INJECTION": ["カードを1枚引き、この手番は好きなだけアクションできる。最後にパス。", "手札がある限り連続行動できる。脱出前の追い込みに。", ""], "アイテム|ANTISEPTIC": ["手札の感染カード1枚を、スキャンせずにゲームから取り除く。", "陽性かもしれないカードを安全に消せる。", ""], "アイテム|CAFFEINE PILLS": ["カードを3枚引く。", "", ""], "アイテム|EMERGENCY LIFE SUPPORT CODES": ["コンピューターのある部屋から、どのセクションの生命維持でも1つ切り替える。", "生命維持システム制御室へ行かずに酸素を確保できる。窒息からも立ち直れる。", "反応炉を止めた後は使えない。"], "アイテム|MEDPACK": ["HPを2回復するか、医療パックトークンを1つ得る。取った直後ならコストなし。", "", ""], "アイテム|MEDICAL STAPLER": ["重傷を1つ治すか、HPを2回復する。", "", ""], "アイテム|STIMULANTS": ["HPを2回復するか、カードを2枚引く。", "", ""], "アイテム|TERMINATION CODES": ["コンピューターのある部屋で、施設内の部屋1つの周りのドアをすべて閉じる（ドアスロットがない場所や壊れたドアの場所も）。", "イントルーダーを閉じ込めたり、自分の部屋を完全に封鎖したりできる。", ""], "アイテム|HEAVY OXYGEN TANK": ["酸素を7得る（満タン）。", "", ""], "アイテム|MEDKIT": ["重傷を1つ治す、HPを3回復する、またはその両方。", "回復アイテムの中で最も強い。", ""], "アイテム|DUCT TAPE": ["故障マーカーを1つ外すか、重量アイテムを2つ1つのハンドスロットに重ねて持てるようにする。", "重い武器を3つ持てるようになる。", "使い捨て（英語版の表記）。"], "アイテム|OXYGEN TANK": ["酸素を3得るか、酸素トークンを1つ得る。取った直後ならコストなし。", "", ""], "アイテム|PHOSPHATES": ["隣の空の通路を1つ補強するか、火災マーカーを取り除く。", "作戦任務「補給路の確保」に役立つ。", ""], "アイテム|TOOLS": ["故障マーカーを1つ外すか、手の届くドアを1つ開け閉めする。", "", ""], "アイテム|FIRE EXTINGUISHER": ["火災マーカーを取り除くか、部屋のイントルーダーを1体撃退する。", "", ""], "アイテム|ROBOT CONTROLLER": ["どこにいるロボットでも起動するか、このアイテムを捨ててロボットの空きスロットに戦術装備トークンを補充する。", "", ""], "支援装備|ASSAULT SHOTGUN": ["イントルーダーに攻撃されるたびに、この武器の弾薬を使って、その相手に1ヒットを与え攻撃を防げる。", "弾薬がある限り攻撃を防げる強力な防御用の銃。", ""], "支援装備|AUTOLOADER BELT": ["このカードの上の弾薬トークンを、自分のどの武器にも入っているものとして使える。", "弾薬を武器ごとに分けなくてよい。", ""], "支援装備|BAYONET": ["遠距離武器と同じハンドスロットに置ける。攻撃されたとき、これに故障マーカーを置けば攻撃を防げる。", "手を使わずに防御手段が1つ増える。", ""], "支援装備|BIOHAZARD ARMOR": ["感染カードを受け取る代わりに、HPを1失う。", "感染カードが増えないので、ゲーム終了時に羽化で死ぬ心配が減る。", "必ず適用される（感染カードを選ぶことはできない）。"], "支援装備|PERIMETER SECURITY DEVICE": ["新しい部屋を発見するとき、急襲（騒音ダイス）の結果を無視する。", "探索担当が持つと、探索中の奇襲がなくなる。", "重量アイテム。数字の目は普通に解決する。"], "支援装備|DRUM MAG RIFLE": ["特別な効果のない素直な銃。", "クセがなく扱いやすい。弾薬スロットの数を実物で確認。", ""], "支援装備|ENGINEERING EQUIPMENT": ["故障マーカーか火災マーカーを取り除くか、このアイテムを捨てて隣の空の通路を補強する。", "", ""], "支援装備|ENTRENCHING TOOL": ["手の届くドアを1つ壊すか、セキュアトークンを2個置く。", "カード1枚でセキュアトークン2個。何度でも使える。", "壊したドアは二度と閉じられない。"], "支援装備|FLAMETHROWER": ["掃射・射撃で生命維持が停止中のセクションなら酸素を1払う。★か弾薬マークで自分の部屋に火災マーカー。", "効果文はデメリットだけなので、カード名の下の特性（弾薬不要か）を確認。弾薬不要なら掃射し放題。", "自分の部屋が燃えるリスク。火災マーカー切れは施設の破壊。"], "支援装備|GATLING GUN": ["掃射の後、弾薬を使わずに同じ通路へ2回目の掃射をしてよい。★で故障マーカー。", "弾薬1回分で掃射2回。", "1回目は普通に弾薬が減る。1回目で★が出ると故障して2回目は撃てない。"], "支援装備|GRENADE LAUNCHER": ["掃射の前か代わりに、この武器のグレネードを好きな数だけ撃てる。", "1回の掃射アクションでグレネードを連発できる。別々の通路も狙える。", "ランチャーに載っているグレネードだけ。グレネードでは★の効果は出ない。"], "支援装備|HEAVY ARMOR": ["重傷を負うたびに、代わりにHPを2失ってもよい。", "重傷は治しにくいので、HPで肩代わりできるのは大きい。", ""], "支援装備|HAND CANNON": ["掃射の結果−1、射撃の結果−1。", "射撃は「出目≦ヒット数」で倒すので、−1は倒しやすくなる（良い効果）。", "掃射の−1はヒットが減る（悪い効果）。"], "支援装備|SECURITY SYSTEM CONTROL": ["自分のセクションでセキュアトークンがある部屋を選び、トークンを1つ捨てて、その部屋の隣の通路に掃射ダイス分のヒット。", "離れた通路を、弾薬も武器もなしで撃てる。セキュアトークンを置くカードと組み合わせると何度も撃てる。", "★でこのアイテムに故障マーカー。"], "支援装備|NOISE SCANNER": ["施設内のどこかの騒音マーカーを1つ取り除いて騒音ロール。その通路の番号が出たらそこにイントルーダーが出る。", "脱出用の部屋や仲間の近くの、危ない騒音マーカーを遠くから消せる。", "騒音ロールの通常の効果（自分の周り）も起きると考えるのが安全。"], "支援装備|PLASMA GUN": ["★か弾薬マークで、武器の上の汎用マーカーの2倍のHPを失い、汎用マーカーを1つ足す。", "効果文はデメリットだけなので、特性や弾薬スロットを実物で確認。", "使うほど反動が大きくなる。"], "支援装備|PORTABLE DEVICE": ["コンピューターのある部屋か生命維持システム制御室で、故障マーカーがあってもその部屋を使える。", "", ""], "支援装備|RPG LAUNCHER": ["隣の部屋とその周りの通路のドアをすべて壊し、イントルーダー全員にクリティカル。キャラクター全員に3ダメージ。", "クイーンや大群をまとめて倒す切り札。", "仲間も巻き込む。"], "支援装備|SUBMACHINE GUN": ["射撃ダイスで弾薬マークが出ると、クリティカル（即死）になる。", "倒せる目が増える。", "弾薬は普通どおり消費する。"], "支援装備|SUPPORTING ROBOT CONTROLLER": ["どこにいるロボットでも起動するか、ロボットを自分の部屋に呼び寄せる（未発見なら公開してから）。", "自分が反応炉にいるときに呼べば、作戦任務「護衛任務」の条件（ロボットを反応炉へ）が一瞬で満たせる。序盤からロボットを使える。", ""], "支援装備|TACTICAL ARMOR": ["イントルーダーの攻撃でHPを失うとき、1少なくなる。", "", ""], "支援装備|TACTICAL HATCHET": ["近接攻撃で、ダイスを振らずにクリティカル（必ず倒す）。その後この武器に故障マーカー。", "確実に1体倒せる。", "直すまで次は使えない。近接攻撃なので感染カード1枚。"], "支援装備|SONIC GUN": ["掃射の3と4の目は2として扱う。★か弾薬マークで自分の部屋に故障マーカー。", "弾薬不要の武器（英語版の表記）なので、弾薬なしで撃ち続けられる。", "1回の掃射は最大2ヒット。"], "支援装備|UTILITY VEST": ["効果文なし。", "戦術装備スロットを増やすためのアイテムと考えられる。実物のスロットを確認。", ""], "キャラクターアイテム|BF GUN": ["掃射の1の目を2として扱う。★でこの武器に故障マーカー。", "掃射が最低でも2ヒットになる。", ""], "キャラクターアイテム|ASSAULT RIFLE": ["射撃の後、弾薬を使って同じ相手にもう一度射撃してよい。", "2回目はヒットが2つ溜まった状態で振るので倒しやすい。", ""], "キャラクターアイテム|AUTOMATIC SHOTGUN": ["射撃の前に1ヒットを与える。射撃ダイスでクリティカルが出たら、可能なら弾薬を消費。", "最初の射撃から2ヒット状態で振れる。", ""], "キャラクターアイテム|SAWED-OFF SHOTGUN": ["通常の射撃の代わりに、弾薬を使って部屋のアダルト1体を撃退してよい。", "戦闘を素早く抜けられる。", ""], "キャラクターアイテム|CARBINE": ["射撃で倒せなかったら、相手にもう1ヒットを与える。", "外しても次の射撃が当たりやすくなる。", ""], "キャラクターアイテム|BULLETPROOF VEST": ["重傷を負うとき、代わりにこのアイテムを捨てる。", "重傷を1回なかったことにできる。", "一度に複数の重傷なら防げるのは1つ。"], "キャラクターアイテム|HANDGUN": ["掃射の結果−1。", "", ""], "キャラクターアイテム|PERSONAL DEFENSE WEAPON": ["掃射で★が出ると、4ヒットではなく1ヒット。", "", ""], "キャラクターアイテム|SNIPER RIFLE": ["通常の掃射の代わりに、弾薬を使わずに隣の通路に1ヒット。", "弾薬を使わずに通路を削れる。スナイパーのカードと組み合わせる。", ""], "キャラクターアイテム|SMART RIFLE": ["自分の部屋にUAVがいれば、射撃を1回振り直してよい。", "", ""], "キャラクターアイテム|PLASMA TORCH": ["手の届く場所に閉じたドアを1つ置く（ドアスロットがない場所にも）。", "", ""], "キャラクターアイテム|MECHANIC'S SAWED-OFF": ["射撃ダイスで弾薬マークが出るとクリティカル。", "倒せる目が増える。", "弾薬は普通どおり消費する。"], "キャラクターアイテム|SCIENTIST'S PISTOL": ["射撃ダイスでクリティカルが出ても、倒す代わりに弾薬を消費する。", "", "クリティカルで倒せない弱い銃。"], "キャラクターアイテム|WHEELCHAIR WITH HOLO COMPUTER": ["自分の手番中、自分の部屋をコンピューターのある部屋として扱ってよい。", "コンピューターが条件のカードやアイテムをどこでも使える。", ""], "キャラクターアイテム|CAPTAIN'S OLD SIX SHOOTER": ["汎用マーカー6個を弾丸として使う銃。撃つたびに1発。掃射は全部1の目。弾薬マークはクリティカル。", "弾薬トークンが要らない。扇状射撃と組み合わせる。", "弾丸の補充は六連発弾薬カートリッジと「一握りの弾丸」だけ。"], "キャラクターアイテム|SIX SHOOTER CARTRIDGE": ["旧式六連発拳銃の弾丸を6発に戻す。", "", ""], "キャラクターアイテム|SCOUT'S RIFLE": ["射撃の前に、弾薬を使って2ヒットを与えてよい。", "2ヒットから振れるので倒しやすい。", ""], "キャラクターアイテム|MOTION SCANNER": ["騒音ロールをするたびに、カード1枚を捨てて振り直してよい。", "急襲などの悪い結果を避けられる。", ""], "キャラクターアイテム|PILOT'S SHOTGUN": ["射撃の後、部屋のイントルーダー全員に1ヒット。", "", ""], "キャラクターアイテム|ORBITAL MANEUVERING SYSTEM": ["着陸機が3マス以内なら、隣の部屋に着陸機を呼び込み、そこから乗り込める。", "着陸地点まで行かずに脱出できる。", "部屋のキャラクターは2ダメージ。対空防御が稼働中なら着陸機は破壊（BGG・AR確認済み）。"], "キャラクターアイテム|KARCHER": ["この武器に故障マーカーを置いて、火災を消すか、イントルーダー1体を撃退する。", "", ""], "キャラクターアイテム|NAIL GUN": ["弾薬を消費する代わりに、この武器に故障マーカーを置く。", "弾薬がなくても撃てる。ジャニターの修理カードで直せる。", "故障中は使えない。"], "キャラクターアイテム|SENTRY'S SMG": ["射撃で倒したらカードを1枚引く。", "", ""], "キャラクターアイテム|NBC SUIT": ["パスするたびに酸素を1得る。", "", ""], "キャラクターアイテム|CHEAT CODES": ["コンピューターのある部屋で、発見済みの生命維持システム制御室を使うか、施設内のドアを好きなだけ開け閉めする。", "", ""], "キャラクターアイテム|SMART GUN": ["射撃の結果−2（倒しやすい）。★か弾薬マークで故障マーカー。", "射撃がとても当たりやすい。", "ハッカーのカードで故障を直せる。"], "キャラクターアイテム|LAB RAT'S GUN": ["掃射の3と4の目を2として扱う。", "", ""], "キャラクターアイテム|BLOODY CAMOUFLAGE": ["部屋に入ってきたイントルーダーが自分を攻撃するとき、同じ部屋の別の人に攻撃させる。", "", ""], "キャラクターアイテム|MAKESHIFT ARMOR": ["重傷を負うとき、これに故障マーカーを置いて、代わりにHPを1失ってよい。", "", ""], "キャラクターアイテム|SURVIVOR'S FAVORITE": ["掃射の結果＋1。★か弾薬マークで故障マーカー。", "掃射のヒットが増える。", ""], "キャラクターアイテム|XENOBIOLOGIST'S GUN": ["掃射で★が出ると、4ヒットではなく1ヒットになり、カードを1枚捨てる。", "", ""], "キャラクターアイテム|PROBE ARM": ["近接武器として使え、近接攻撃のたびに細胞標本を1つ得る。", "「生体解剖」の威力を上げる。", "近接攻撃のたびに感染カード1枚。"], "キャラクターアイテム|OLD MILITARY ARMOR": ["攻撃されたとき、イントルーダーの攻撃カードを引き直してよい。", "致命的な攻撃カードを避けられる。", "引き直したら2枚目を必ず使う。"], "キャラクターアイテム|SOLDIER'S GUN": ["掃射の1の目を2として扱う。射撃でも弾薬を消費。弾薬マークはクリティカル。", "「フルオート射撃」で連続掃射できる。", ""], "ロボット|SERVER ROBOT": ["最大3回移動するか、ロボットのいるコンピューターの部屋を使う（故障マーカーがあっても）。", "", ""], "ロボット|TECHNICAL ROBOT": ["最大2回移動するか、ロボットの部屋の故障マーカーか火災マーカーを1つ取り除く。", "部屋の中の武器などの故障も直せる（AR確認済み）。", ""], "ロボット|MILITARY ROBOT": ["1回移動するか、ロボットの隣の通路に掃射ダイス分のヒット。", "離れた場所の群れを削れる。", "★でロボットに故障マーカー。"], "ロボット|MEDICAL ROBOT": ["最大2回移動するか、同じ部屋のキャラクター1人の重傷を治すかHP2回復。", "", ""], "ロボット|SECURING ROBOT": ["最大3回移動するか、隣のドアを開け閉めするか、ロボットの部屋にセキュアトークンを2個置く。", "", ""], "ロボット|EXPLORATION ROBOT": ["最大2回移動するか、未探査の通路の先を探査する（進入時効果なし）。", "", ""], "目的|STATE'S EVIDENCE": ["生還者の中で、データトークンを持っているのが自分だけ。", "サーバールームでデータトークンを取り、他の人に取らせない。", ""], "目的|INSIDER INFORMATION": ["同上（データトークンを持つ生還者が自分だけ）。", "", ""], "目的|CREW'S FAVORITE": ["ランクが最も低い人を生還させる、または最も高い人を生還させ <script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const II=k=>ICONS[k]?`<img class="ico" src="${ICONS[k]}" alt="">`:'';
const ic=s=>esc(s).replace(/⟦([^⟧]+)⟧/g,(m,k)=>`<span class="ic">${II(k)}${k}</span>`);
const IC=k=>`<span class="ic">${II(k)}${k}</span>`;
const KEY='nemesis-nav-v1';
const DEF={tab:'setup',players:4,race:'prime',xy:false,ins:false,con:false,checks:{},step:0,round:1,lander:{pos:10,st:'track'},auto:null,aa:'不明',bodies:[8,11,14],alert:'',gear:[]};
let S;try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},DEF)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ───────── gauge ───────── */
const LST={track:'ラウンドトラック上',landed:'着陸地点に着陸済み',gone:'破壊・除去',launched:'離陸済み'};
function gauge(){
  $('#rVal').textContent=S.round;
  const t=[];
  const L=S.lander;
  t.push(`<button class="tk${L.st==='gone'||L.st==='launched'?' off':''}" id="tkL" title="着陸機の位置と状態を変更">${ICONS["着陸機トークン"]?`<img class="ico big" src="${ICONS["着陸機トークン"]}" alt="">`:`<span class="dot">着</span>`}着陸機 <b>${L.st==='track'?'R'+L.pos:LST[L.st]}</b></button>`);
  t.push(`<button class="tk auto${S.auto?'':' off'}" id="tkA">${ICONS["自爆トークン"]?`<img class="ico big" src="${ICONS["自爆トークン"]}" alt="">`:`<span class="dot">爆</span>`}自爆 <b>${S.auto?(S.auto>14?'終了時':'R'+S.auto):'未起動'}</b></button>`);
  t.push(`<button class="tk" id="tkAA">${ICONS["対空防御：停止"]?`<img class="ico big wide" src="${ICONS[S.aa==="稼働"?"対空防御：稼働":"対空防御：停止"]}" alt="">`:`<span class="dot">対</span>`}対空防御 <b>${S.aa}</b></button>`);
  if(S.race==='neo') t.push(`<button class="tk" id="tkB"><span class="dot">体</span>死体 <b>${S.bodies.length?S.bodies.map(b=>'R'+b).join('・'):'なし'}</b></button>`);
  t.push(`<button class="tk${(S.gear||[]).length||S.char||(S.wounds||[]).length?'':' off'}" id="tkG" title="自分の装備を登録"><span class="dot" ${S.char?`style="background:${chCol(S.char)}"`:''}>🎒</span>${S.char?esc(chName(S.char)):'装備'} <b>${(S.gear||[]).length}</b>${(S.wounds||[]).length?` <b class="wbad">🩸${S.wounds.length}</b>`:''}</button>`);
  t.push(`<button class="tk ng" id="tkN" title="新しいゲームを始める（全部初期化）">⟲ 新しいゲーム</button>`);
  t.unshift(`<button class="tk em-tk" id="tkE" title="敵の出現・移動・行動のメモ"><span class="dot">👾</span>敵の動き</button>`);
  $('#gTokens').innerHTML=t.join('');$('#tkN').onclick=()=>edit('N');$('#tkG').onclick=()=>edit('G');$('#tkE').onclick=()=>edit('E');
  $('#tkL').onclick=()=>edit('L');$('#tkA').onclick=()=>edit('A');$('#tkAA').onclick=()=>edit('AA');
  if($('#tkB'))$('#tkB').onclick=()=>edit('B');
  // forecast
  const f=[];
  if(S.ended){const a=$('#gAlert');a.hidden=false;a.innerHTML=`<span class="gend"><strong>ゲーム終了${{boom:'（自爆）',destroyed:'（施設破壊）',out:'（全員が退場）',time:'（ラウンド14終了）'}[S.ended]||''}</strong>「ラウンド進行」に終了の手順を表示しています。</span>`;return}
  if(S.alert) f.push(S.alert);
  const nx=S.round+1;
  if(S.auto && S.auto!==nx && !(S.auto>14&&S.round===14)) f.push(sdMsg());
  if(S.auto && S.auto===nx) f.push('<strong>このラウンドの終わりに施設が爆発します。</strong>脱出シャトル・コールドスリープ・着陸機への搭乗はこのラウンドのプレイヤーフェイズまで。着陸機はイベントフェイズ開始時に離陸しないと爆発に巻き込まれます。コールドスリープ中のキャラクターも死亡します。');
  if(S.auto && S.auto>14 && S.round===14) f.push('<strong>自爆はゲーム終了時に発動します。</strong>コールドスリープ中のキャラクターも死亡します。');
  if(L.st==='track' && L.pos===nx) f.push('<strong>このラウンドの終わりに着陸機が着陸を試みます。</strong>対空防御の上のトークンを公開して判定します。');
  if(S.race==='neo' && S.bodies.includes(nx)) f.push('<strong>このラウンドの終わりに死体の取り込みが起きます。</strong>');
  if(S.round===14) f.push(finalMsg());
  else if(L.st==='gone'&&!/撃墜/.test(S.alert||'')) f.push('<strong>着陸機は撃墜済み。</strong>残る脱出手段は<b>脱出シャトル</b>（セクションC・1人だけ）と<b>コールドスリープ</b>（セクションB・稼働が必要。脱出扱いにはならない）。');
  if(L.st==='landed'&&S.round<14) f.push('着陸機は着陸地点で待機中。乗り込みはプレイヤーフェイズに着陸地点のルームアクション、離陸はイベントフェイズ開始時です。');
  const a=$('#gAlert');a.hidden=!f.length;a.innerHTML=f.join('<br>');a.querySelectorAll('[data-lj]').forEach(b=>b.onclick=()=>ljudge(b.dataset.lj));
}
let editing=null;
function edit(w){editing=editing===w?null:w;renderEditor()}
function renderEditor(){
  let box=$('#gEdit');
  if(!box){box=document.createElement('div');box.id='gEdit';box.className='card';box.style.marginTop='8px';$('#gauge').insertBefore(box,$('.tabs'))}
  if(!editing){box.hidden=true;return}
  box.hidden=false;
  let h='';
  if(editing==='L'){
    h=`<div class="ctrl"><div><label class="t">着陸機トークンの位置</label><div style="display:flex;gap:6px;align-items:center"><button class="ib" data-a="lp-">−</button><b class="num" style="font-size:20px">R${S.lander.pos}</b><button class="ib" data-a="lp+">+</button></div></div>
    <div><label class="t">状態</label><div class="seg">${Object.keys(LST).map(k=>`<button data-a="ls:${k}" aria-pressed="${S.lander.st===k}">${LST[k]}</button>`).join('')}</div></div></div>
    <p class="note">カード効果（指揮系統など）で着陸機トークンが動いたら位置を合わせてください。</p><button class="btn" data-a="lp:reset">着陸機を初期状態に戻す（R10・ラウンドトラック上）</button>`;
  }else if(editing==='A'){
    const left=S.auto?(S.auto>14?'ゲーム終了時':`R${S.auto}（あと${S.auto-S.round}ラウンド）`):'未起動';
    h=`<div class="sdp"><div class="eyebrow">Self-destruct procedure</div><h3>自爆プロシージャー <span class="sdst${S.auto?' on':''}">${S.auto?'作動中：'+left:'未起動'}</span></h3>
    <div class="ctrl"><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><button class="btn pri" data-a="au:on">今ラウンドで起動した（＋5マス）</button>${S.auto?`<button class="ib" data-a="au-">−</button><b class="num">${S.auto>14?'終了時':'R'+S.auto}</b><button class="ib" data-a="au+">+</button><button class="btn" data-a="au:off">反応炉で停止した</button>`:''}</div></div>
    <ol class="sdo"><li><b>起動</b>：冷却システム（セクションB）のルームアクション。<b>自爆トークンを今のラウンドマーカーの5マス先</b>に置く（間に空きが4マス）。14を超えるなら最後のマスの後ろ＝<b>ゲーム終了時</b>に発動。ジリアンの行動など、カードの効果で起動することもある。</li>
    <li><b>カウントダウン</b>：時間の経過でラウンドマーカーが自爆トークンのマスに着いたら、<b>その瞬間に施設が爆発してゲーム終了</b>。</li>
    <li><b>爆発で死ぬ人</b>：施設内のキャラクター全員と、<b>コールドスリープ中のキャラクター</b>。生き残るのは脱出した人だけ。</li>
    <li><b>助かる方法</b>：着陸機（着陸済みなら、爆発前のイベントフェイズ開始時に離陸）か、脱出シャトル（セクションC・1人だけ）。</li>
    <li><b>止める方法</b>：反応炉（セクションC）だけ。止めると施設の電源がすべて落ち、<b>生命維持は全セクション停止・対空防御は除去</b>（着陸機は必ず着陸できる）。二度と戻せない。</li></ol>
    <p class="note">爆発の1ラウンド前には上に「このラウンドの終わりに施設が爆発します」と出ます。カード効果で自爆トークンが動いたら −／+ で合わせてください。</p></div>`;
  }else if(editing==='AA'){
    h=`<div><label class="t">対空防御（自分が確認した内容のメモ）</label><div class="seg">${['不明','稼働','停止','除去済み'].map(k=>`<button data-a="aa:${k}" aria-pressed="${S.aa===k}">${k}</button>`).join('')}</div></div>
    <p class="note">生命維持システム制御室Bで2枚とも秘密裏に確認し、上下を入れ替えられます。判定に使うのは上のトークンです。反応炉を停止すると対空防御トークンは除去され、着陸機は必ず着陸できます。</p><button class="btn" data-a="aa:不明">対空防御を初期状態（不明）に戻す</button>`;
  }else if(editing==='G'){

function renderSetup(){
  segs();
  const bd=bagDef();const tot=bd.reduce((a,b)=>a+b[1],0);
  $('#bagTitle').textContent=`イントルーダーバッグの中身（${RACE[S.race]}・${S.players}人）`;
  $('#bag').innerHTML=bd.map(([k,n,s])=>`<div class="tok"><div class="n">${n}</div><div class="k">${k}</div><div class="s">${s}</div></div>`).join('')+`<div class="tok total"><div class="n">${tot}</div><div class="k">合計</div><div class="s">個をバッグへ</div></div>`;
  const notes=[];
  if(S.race==='prime')notes.push(`<p class="note">クイーンとドローンのトークンは最初は入れません（バッグの発展で増えます）。トークンの総数は ブランク1・クイーン9・ドローン8・アダルト16・ラーヴァ6。開始後に山に残るのは アダルト${16-(3+S.players)}・ラーヴァ4・ドローン8・クイーン9。</p>`);
  if(S.race==='neo')notes.push('<p class="note">マザーブレイン（クイーン相当）のトークンは最初は入れません。バッグに入るのは「死体の取り込み」のときだけで、入ったらクイーンが生きている限り取り除かれません。トークンを追加するときは、山の一番下から見ずにバッグへ落とすのがおすすめです。和訳では追加のアダルトは「プレイヤーの数」と書かれています。</p>');
  if(S.race==='sang')notes.push('<p class="note">キングのトークンは最初は入れません。ラーヴァに相当する種族はいません。</p>');
  if(S.xy)notes.push('<p class="note">ジリアン：ジリアントークンはバッグの横。探査カードやイベントで初めてバッグに入ります。</p>');
  if(S.ins&&(S.race!=='prime'||S.xy))notes.push('<div class="warn danger"><b>注意：</b>インサイダーは標準の Nemesis: Retaliation 専用です。種族を変える拡張やジリアンとは組み合わせられません（キャラクター追加の拡張は可）。</div>');
  $('#bagNotes').innerHTML=notes.join('');
  $('#setupLists').innerHTML=setupLists().map(g=>`<div class="card"><div class="eyebrow">${g.e}</div><h2>${g.h}</h2><ul class="cl">${g.items.map(i=>`<li class="${S.checks[i.id]?'done':''}"><input type="checkbox" id="ck-${i.id}" ${S.checks[i.id]?'checked':''} aria-label="完了"><span>${i.tag?`<span class="tag">${i.tag}</span>`:''}${i.txt}</span></li>`).join('')}</ul></div>`).join('');
  document.querySelectorAll('#setupLists input').forEach(c=>c.onchange=()=>{S.checks[c.id.slice(3)]=c.checked;c.parentElement.classList.toggle('done',c.checked);save()});
}

['落とし穴','体力・アーマー・重傷で間違えやすいこと',`<ul><li>アーマーは瀕死セクションに置く。ヘルスマーカーがその<b>セクションに入るとアーマーは壊れて捨てる</b>（カードに書かれた効果がない限り、ダメージは減らない）。</li><li><b>すでに瀕死のときにアーマーを手に入れても装備できず、捨てる</b>。アーマーは同時に1つだけ。</li><li>重傷カードはヘルスセクションをふさぐので<b>最大HPが減る</b>。同じ重傷が2枚あっても効果は重ならない。</li><li>死亡すると、持っていたアイテムはすべて失われる。</li></ul>`],
