<p class="note">移動ではないけれど出現する場面：騒音マーカーの解決では<b>通路に</b>現れ、騒音ダイスの急襲では<b>自分の部屋に直接</b>現れて即攻撃します。</p>`],

['イントルーダーの動き','イントルーダーの「撃退」とは？',`<p>イントルーダーを<b>押し返して1マス遠ざける</b>効果です。倒すわけではなく、ヒットも与えません。主に、自分の部屋にいるイントルーダーを通路へ追い出して戦闘状態を解くために使います。</p>
<h3>どこへ動くか</h3><ul><li><b>自分と同じ部屋</b>のイントルーダーを撃退：撃退した人が、隣接する通路の中から行き先を選ぶ。</li><li><b>隣接する通路</b>のイントルーダーを撃退：撃退した人（効果の発生源）から遠ざかる方向へ、通路の先の部屋に移動。</li><li>発生源の部屋やそれに隣接する通路より遠くにいるイントルーダーを撃退する場合は、行き先が決められないので、ID番号が最も小さい通路・部屋へ移動。</li></ul>
<h3>動けないとき・特殊なケース</h3><ul><li>行き先が未探査の通路の先（まだマップにない場所）なら、<b>移動せずその場に残る</b>。</li><li>閉じたドアがあれば、移動せずに<b>ドアを破壊</b>して残る。</li><li>押し出した先の部屋にキャラクターがいれば、そこへ入って<b>手番順で最初のキャラクターを攻撃</b>する（セキュアトークンがあれば1個捨てて防ぐ）。</li><li>押し出した先の通路がいっぱい（6体、クイーンは4体分）なら、通常の移動と同じく入れるぶんだけ移動。</li><li>部屋で負ったヒットのマーカーは、通路に出ると捨てる（傷はリセット）。</li></ul>
<h3>撃退する主な手段</h3><ul><li>アイテム：軍用テーザー銃、消火器（どちらも部屋から1体）。</li><li>アクションカード：強襲射撃（遠距離武器の弾薬を消費して自分の部屋の全員）、セントリーの気絶（武器に故障マーカー＋感染カード1枚で1体）。</li><li>武器：オフィサーのソードオフショットガン（射撃の代わりに弾薬を消費してアダルト1体）、ジャニターの高圧洗浄機。</li><li>クイーンヘルスカードの「クイーンを撃退する」、ネオフレッシュのアイアンクラッド（部屋で倒すと死ぬ代わりに撃退される）。</li></ul>
<p class="note">ジリアンは部屋から部屋へ移動するので、撃退でも隣の部屋へ移ります（通路には出ない）。</p>`],
['イントルーダーの動き','部屋に入ってきたら必ず攻撃される？',`<ul><li>イントルーダーがキャラクターのいる部屋に<b>入った・置かれた</b>ときは、理由に関係なく即攻撃（奇襲攻撃）。</li><li>${IC("セキュアトークン")}がある部屋なら、攻撃の代わりにセキュアトークンを1個捨てる（拒否できない）。ただし<b>すでに部屋にいる</b>イントルーダーの攻撃（イントルーダーフェイズの攻撃など）は防げない。</li><li>プレイヤーの効果で入ってきたなら、その効果を使ったキャラクターを攻撃。それ以外は手番順で最初のキャラクター。</li><li>部屋から出るときは<b>追撃</b>：今の部屋と、通ろうとする通路にいるイントルーダーが大きい順に攻撃（最大3回）。</li></ul>`],
['カードの疑問','アクションカード「一つずつ（ONE BY ONE）」は、弾薬が尽きるまで1アクションで何ヒットでも与えられる？',`<p><b>はい。</b>弾薬のあるスナイパーライフルを持っている限り、1回のアクション（カードのプレイ）の中で効果を何度でも繰り返せます。やめたいところで自分で止めてもかまいません。</p>
<ol><li>隣接する通路に1ヒット。</li><li>射撃ダイスを1つ振る。</li><li>${IC("射撃ダイス（クリティカル）")}か${IC("射撃ダイス（弾薬）")}が出たらスナイパーライフルの弾薬を消費。数字の目なら弾薬は減らない。</li></ol>
<ul><li>弾薬は「出目しだい」で減るので、何回続くかは運次第。満装填の弾薬トークン1個で、その2つの目が2回出るまで続けられます。</li><li>通路では1ヒットでアダルトとラーヴァを1体ずつ倒せます。</li><li><b>ドローンとアイアンクラッドは倒せません。</b>通路のドローンは1回の攻撃でちょうど2ヒットが必要で、この効果は1回ごとに1ヒットのため（BGGの非公式FAQ、Awaken Realms確認済み）。</li><li>掃射攻撃ではないので、ファイアスピッターの反撃や、武器の「掃射」効果は関係しません。</li></ul>
<div class="warn"><b>カードに明記なし：</b>繰り返すたびに違う通路を選べるか、クイーンのヒットトラックを1ヒットずつ進められるかは書かれていません。カードには「隣接する通路に1ヒット」とだけあり、同じ通路に限るとの指定はないので、毎回選び直せると読むのが自然です。</div>`],


['よくある疑問','手術室で陰性（INFECTEDでない）カードは取り除けない？',`<p><b>手術室では取り除けません。</b>手術室で除外されるのはスキャンで陽性だったカードだけで、陰性のカードはデッキに戻してシャッフルします。陰性カードを減らす方法は次のとおりです。</p>
<div class="tbl"><table><tr><th>方法</th><th>取り除けるカード</th></tr>
<tr><td>休憩（REST）のアクションカード</td><td>感染チェック手順をして、<b>手札の陰性カードをゲームから除外</b>（陽性ならラーヴァ）</td></tr>
<tr><td>除染室（ランダムな部屋）</td><td>酸素2を払い手札を捨てる。<b>デッキと捨て山の感染カードを陰性・陽性に関係なくすべて除外</b></td></tr>
<tr><td>シェルタールーム（ランダムな部屋）</td><td>ボードにラーヴァがいなければ、<b>手札の感染カードをスキャンせずにすべて除外</b></td></tr>
<tr><td>殺菌剤（緑アイテム）</td><td>手札の感染カード1枚をスキャンせずに除外</td></tr></table></div>
<p class="note">パス時に手札の感染カードを捨てられるが、捨て山に行くだけでデッキからは消えない。手術室の効果文は「手札のアクションカードをすべて捨てる」で、そのとき手札にある感染カードの扱いは明記されていない。</p>`],
['よくある疑問','コールドスリープ中にイントルーダーが部屋に入ってきたら起こされる？',`<p><b>起こされません。</b>コールドスリープしたキャラクターはゲーム終了の確認まで参加しない扱いで、イントルーダーの標的にも攻撃の対象にもなりません。失敗するかどうかが決まるのは、コールドスリープする瞬間の騒音ロールの後だけです。</p><p>ただし<b>施設が破壊されたら死亡</b>します（自爆、または火災マーカー切れ）。</p>`],
['よくある疑問','自爆プロシージャーとは？',`<p>施設を丸ごと吹き飛ばす時限装置です。</p><ol><li><b>起動</b>：冷却システム（セクションB）のルームアクション。自爆トークンを現在のラウンドの<b>5マス先</b>に置く（14を超えるなら最後のマスの後ろ＝ゲーム終了時に発動）。</li><li><b>発動</b>：クリーンアップの時間の経過で、ラウンドマーカーが自爆トークンのマスに入った瞬間に施設が破壊され、ゲーム終了。</li><li><b>結果</b>：施設内のキャラクターは<b>コールドスリープ中も含めて全員死亡</b>。イントルーダー（クイーン含む）も全滅し、巣も破壊扱い。脱出シャトルか、離陸済みの着陸機で出た人だけが助かる。</li><li><b>停止</b>：反応炉（セクションC）だけ。止めると施設の電源がすべて落ち、生命維持・自爆・対空防御は二度と戻せない。</li></ol><p class="note">「クイーンを殺せ」「巣を破壊しろ」などの目的は、施設の破壊でも達成になる。ただし本人が脱出できていなければ勝てない。</p>`],
['よくある疑問','コールドスリープルームにつながる通路には騒音マーカーが置かれない？',`<p><b>コールドスリープルームが未発見の間だけ</b>置かれません。いずれかの部屋がコールドスリープルームにつながった時点で「未発見」タイルを外し（ロボットカードも公開）、以後は普通に騒音マーカーが置かれます。</p><p class="note">別ルールとして、コールドスリープルームにつながる通路は<b>補強できません</b>（ずっと）。</p>`],
['よくある疑問','巣（NEST）でルームアクションをすると騒音ロールをする？',`<p><b>する。</b>巣のルームアクションは「卵を1つ取得するか破壊する。<b>騒音ロールを1回行う。</b>」です。移動で巣に入ったときの騒音ロールとは別に、ルームアクションのたびに振ります。</p><ul><li>卵は重量アイテム（ハンドスロットが必要）。</li><li>巣は安全確保できない（セキュアトークンを置けない）。</li><li>卵がなくなると巣は破壊扱い（汎用マーカーを置く）。巣に火災があると、イントルーダーフェイズのたびに卵が1個壊れる。</li></ul>`],
['よくある疑問','武器庫の弾薬とグレネードは無限に取れる？',`<p><b>無限ではありません。</b>制限は2つあります。</p><ol><li><b>空いている戦術装備スロットの数まで</b>：取ったトークンは対応する色か灰色の空きスロットに置く必要がある。アクションの前や途中に、手持ちのトークンを1回だけ好きなだけ捨てて空きを作れる。</li><li><b>サプライに残っている数まで</b>：弾薬・グレネード・酸素・医療パックは各20個。黄金律「コンポーネントの上限」により、サプライにないぶんは取れない。</li></ol>`],
['よくある疑問','使った弾薬・グレネードやアイテムカードは除外？ それとも再利用される？',`<p><b>戦術装備トークンは除外されず、サプライに戻ります。</b></p><ul><li>使った・捨てたトークンはサプライへ戻り、武器庫・軍事実験研究室などの効果でまた取れる。</li><li>弾薬トークンは2回使える。満装填→裏返して半装填→捨ててサプライへ。</li><li>着陸地点に置いたトークン（各4個）は、取ったらそのぶん減る。補充されるルールはない。</li></ul>
<p><b>アイテムカードは捨て札になります。</b></p><ul><li>捨てた・使い捨てのアイテムは、その色のアイテムの捨て山へ。</li><li>探索で引いて選ばなかったカードは、デッキの一番下に戻る（中身は他の人に見せない）。</li><li>キャラクターが死亡すると持っていたアイテムは失われる。</li></ul>
<div class="warn"><b>ルールに記述なし：</b>アイテムデッキが尽きたときに捨て山をシャッフルし直すルールは書かれていません。黄金律どおり、なくなったら引けない扱いになると考えられます。</div>`],


['準備','同行者（Contractors）の選び方と使うカード',`<h3>どうやって選ぶ？（キャラクター選択）</h3><ol>
<li>キャラクター選択の前に、<b>同行者選択カード12枚</b>（小さいカード。「PICK SOLDIER」などと書かれている）をシャッフルし、<b>2枚をテーブル中央に表向き</b>に置く。</li>
<li>通常どおり、プレイヤー1から順にキャラクター選択カードを2枚ずつ受け取る。自分の番では、<b>手元の2枚か、中央の同行者2枚</b>の中から1人を選べる（実質4択）。</li>
<li><b>同行者は1ゲームに1人だけ。</b>誰かが同行者（中央の拡張の同行者でも、基本セットの「同行者」のキャラクター選択カードでも）を選んだら、<b>残りの同行者選択カードと、基本の同行者のキャラクター選択カード</b>をゲームから除外。以降の人は同行者を選べない。</li></ol>
<h3>どのカードを使う？（キャラクターのセットアップ）</h3><ol>
<li><b>キャラクタータイル</b>：拡張の両面タイル6枚（12人分）から選んだ同行者の面をボードに置く。ミニチュアは過去作（Nemesis／ロックダウン）のモデルか、基本セットの同行者のモデル。</li>
<li><b>アクションカード（10枚）</b>：基本セットの同行者のアクションカード10枚を取り、カードの<b>一番下に「Contractor: Consultant」</b>と書かれた5枚を抜く。代わりに<b>選んだ同行者の5枚</b>（一番下に「Contractor: ○○」）を入れて<b>ちょうど10枚</b>のデッキにする。<b>足すのではなく入れ替え</b>なので、15枚にはならない（他のキャラクターと同じ10枚）。ゲーム中に感染カード・汚染カードが混ざって増えるのは通常どおり。
<ul><li><b>残す5枚</b>（一番下が「Contractor」だけ）：基本的な安全確保・破壊工作・休憩・探索・修理</li><li><b>抜く5枚</b>（「Contractor: Consultant」）：常に準備万端・コンピュータースキル・脅威に身を潜める・隠密移動・弱点</li></ul>
<p class="note">振り分けは実物カードの一番下の表記で確認済みです。</p></li>
<li><b>キャラクターアイテム（2枚）</b>：基本の同行者のアイテム（防弾ベスト・拳銃）の代わりに、<b>選んだ同行者のアイテム2枚</b>を使う。重量アイテム→ハンドスロット、アーマー→ヘルストラックの瀕死セクション、弾薬スロットには満装填の弾薬トークン。</li>
<li><b>支援装備の選択には参加しない</b>（すでにアイテムを2個持っているため）。戦術ベルトのトークン4個は通常どおり選ぶ。</li></ol>
<p class="note">基本セットの同行者（コンサルタント）を選んだ場合は、10枚すべてをそのまま使い、アイテムは防弾ベスト・拳銃。こちらも支援装備の選択には参加しない。</p>
<h3>12人の同行者とカード</h3><div class="tblw"><table class="ctbl"><thead><tr><th>同行者</th><th>固有アクションカード5枚</th><th>キャラクターアイテム2枚</th></tr></thead><tbody><tr><th>メカニック<small>Mechanic</small></th><td>火には火を・作業用通路・迅速な修理・常に準備万端・脅威に身を潜める</td><td>プラズマトーチ・メカニックのソードオフショットガン</td></tr><tr><th>ソルジャー<small>Soldier</small></th><td>鋼の心臓・フルオート射撃・弱点・狙いを定める・強襲射撃</td><td>旧式軍用アーマー・ソルジャーの銃</td></tr><tr><th>スカウト<small>Scout</small></th><td>アドレナリン・偵察任務・ガラクタ漁り・弱点・隠密移動</td><td>スカウトのライフル銃・動体スキャナー</td></tr><tr><th>キャプテン<small>Captain</small></th><td>扇状射撃・一握りの弾丸・銃身による殴打・権限・弱点</td><td>旧式六連発拳銃・六連発弾薬カートリッジ</td></tr><tr><th>セントリー<small>Sentry</small></th><td>防衛計画・気絶・隠密移動・弱点・コンピュータースキル</td><td>セントリーのサブマシンガン・生化学防護服</td></tr><tr><th>ジャニター<small>Janitor</small></th><td>まだ動くはずだ・掃除・その場しのぎ・脅威に身を潜める・コンピュータースキル</td><td>高圧洗浄機・釘打ち機</td></tr><tr><th>サイエンティスト<small>Scientist</small></th><td>リスク評価・イントラネット・アクセスブロック・脅威に身を潜める・コンピュータースキル</td><td>科学者の拳銃・ホロコンピューター搭載車椅子</td></tr><tr><th>サバイバー<small>Survivor</small></th><td>やけくそな攻撃・通気口・屈強・目くらまし・常に準備万端</td><td>即席アーマー・サバイバーのお気に入り</td></tr><tr><th>ラボラット<small>Lab Rat</small></th><td>奇妙な代謝・鋭敏な聴覚・影に潜む・隠密移動・脅威に身を潜める</td><td>ラボラットの拳銃・血塗られた迷彩</td></tr><tr><th>ハッカー<small>Hacker</small></th><td>脳神経接続・上書き・隠密移動・常に準備万端・コンピュータースキル</td><td>チートコード・スマートガン</td></tr><tr><th>ゼノバイオロジスト<small>Xenobiologist</small></th><td>思考占拠・実地経験・生体解剖・脅威に身を潜める・コンピュータースキル</td><td>ゼノバイオロジストの拳銃・探査アーム</td></tr><tr><th>パイロット<small>Pilot</small></th><td>接続・操縦・弱点・常に準備万端・コンピュータースキル</td><td>パイロットのショットガン・軌道操縦システム</td></tr></tbody></table></div>
<p class="note">Contractors拡張の内容物：アクションカード60枚（1人5枚）、キャラクターアイテム24枚（1人2枚）、同行者選択カード12枚、両面キャラクタータイル6枚。他の拡張と組み合わせられます。</p>`],
['準備','テレイン拡張とは？',`<p><b>見た目を立体にするための拡張</b>（Terrain Expansion / Terrain Pack）です。トークンの代わりに置く3Dモデルのセットで、<b>ルールは何も変わりません</b>。持っていなくてもゲームに影響はありません。</p>
<h3>中身</h3><ul><li>ロボットモジュール 6個</li><li>ドア 14個</li><li>着陸機 1個</li><li>卵 8個</li><li>死体 5個</li><li>酸素発生装置 3個</li><li>対空防御 1個</li></ul>
<h3>ルールブックに書かれていること（ロボットだけ）</h3><ul><li>ロボットは6種類のうちどれか分からない状態で始まるので、準備では<b>ロボットを組み立てない</b>。コールドスリープルームに<b>土台（ベース）だけ</b>を置く。</li><li>ロボットカードが公開されたら（いずれかの部屋がコールドスリープルームにつながったとき）、その種類のモジュールを土台に付ける。</li></ul>
<h3>他のモデルの置き方（推定）</h3><ul><li>ドア→ドアトークンの代わり、卵→巣の卵トークンの代わり、着陸機→着陸機が着陸したときの目印、対空防御→セクションBの対空防御スロットの飾り、酸素発生装置→各セクションの生命維持トークンの横の飾り、死体→ネオフレッシュの死体（取り込まれた死体）などの演出用。</li><li>ルールの数え方（ドアの数の上限など）はトークンと同じに考えてください。</li></ul>
<p class="note">「推定」の部分は商品説明に置き場所の記載がないためです。実物の説明書があればそちらを優先してください。</p>`],
['準備','目的カードの「個人」「作戦」と作戦任務デッキ、どのカードがどれ？',`<p>カードに書かれた種類名で見分けます。ゲームで使うのは3つの束で、ソロ/協力用は通常のゲームでは使いません。</p>
<div class="tbl"><table><tr><th>束</th><th>カードの表記</th><th>枚数</th><th>中身</th></tr>
<tr><td><b>個人の目的</b></td><td>PRIVATE OBJECTIVE</td><td>15</td><td>証拠提供者／内部情報／クルーのお気に入り／過去の因縁／一撃の好機／より良き移住先／古い確執／敵対的買収／企業契約／実験対象／魅力的なオファー／検疫／大物狩り／来た、見た、勝った／シャットダウン</td></tr>
<tr><td><b>作戦の目的</b></td><td>MISSION OBJECTIVE</td><td>7</td><td>公式命令（作戦任務を達成せよ）／裏の動機（作戦任務の達成を阻止せよ）／自己保身（唯一の生還者になれ）。同じタイトルのカードが複数枚入っている</td></tr>
<tr><td><b>作戦任務</b></td><td>MISSION TASK</td><td>8</td><td>第一のサンプル／周辺警戒掃討／補給路の確保／重要データの回収／駆逐作戦／護衛任務／施設の再起動／偵察任務</td></tr>
<tr><td>ソロ/協力用</td><td>ソロ/協力の作戦任務</td><td>12</td><td>掃討／対決／閉鎖された施設／重要な情報／科学的サンプル／死角は残さず／入場口の検査／調理サンプル／深層の探索／安全処置／シャットダウン／システムのバックアップ</td></tr></table></div>
<ol><li>個人と作戦の目的の束から、<b>カードに書かれた人数マーク（「2+」「3+」など）が参加人数より大きいカードを抜く</b>。作戦任務の束も同じ。例：3人なら「3+」は残し、4人以上が必要なカードは抜く。</li><li>各自に個人1枚・作戦の目的1枚を伏せて配る。</li><li>作戦任務を1枚だけ表向きでラウンドトラック下のスロットへ。これが全員共通の任務で、作戦の目的カードはこの任務を参照する（公式命令なら達成、裏の動機なら阻止）。</li></ol>
<p class="note">「シャットダウン」は個人の目的とソロ/協力用の両方に同じ名前のカードがあるので、種類の表記で区別してください。作戦の目的の内訳（どのタイトルが何枚か）は和訳データにないため、実物で確認してください。</p>`],
['よくある疑問','火災マーカーがサプライから無くなったら？',`<p><b>施設が破壊され、その瞬間にゲーム終了です</b>（壊滅的な火災）。火災マーカーを置く必要があるのに、サプライに1つも残っていなければ発生します。</p><ul><li>施設内のキャラクターは<b>コールドスリープ中も含めて全員死亡</b>。イントルーダーも全滅し、巣も破壊扱い。</li><li>すでに脱出シャトルや離陸済みの着陸機で出た人だけが、ゲーム終了の手順に進める。</li><li>火災マーカーは全部で9個。すでに火災がある部屋に置く指示は無視なので、そのぶんは減らない。</li><li>${IC('故障マーカー')}が尽きたときは代わりに火災マーカーを置くので、故障マーカー切れから施設の破壊につながることもある。</li></ul>`],


['よくある疑問','通路の補強（強化）とは？ イントルーダーがいる通路も補強できる？',`<p><b>イントルーダーがいる通路は補強できません。</b>補強できるのは<b>空の通路</b>だけで、「空の通路」はイントルーダーが1体もいない通路のことです（${IC('騒音マーカー')}だけがある通路は空の通路に含まれる）。</p>
<h3>補強するとどうなる？</h3><ul><li>騒音マーカーがあれば取り除き、通路タイルを裏返して「0」の面にする。</li><li>騒音ダイスに「0」の目はないので、<b>騒音ロールでは騒音マーカーが置かれなくなる</b>。デッドリーモードでも「0」だけ。</li><li>イベントカードなど、騒音ロール以外で「騒音マーカーを置く」と指示された場合は置かれる。</li><li><b>イントルーダーは補強された通路にも普通に入ってくる・通り抜ける。</b>防壁ではなく、騒音で呼び寄せにくくなるだけ。</li><li>一度補強した通路は、その後イントルーダーが入っても補強されたまま。</li></ul>
<h3>補強できない通路</h3><ul><li>イントルーダーがいる通路（いなくなれば補強できる）。</li><li>コールドスリープルームにつながる通路（ずっと不可）。</li></ul>
<h3>補強する方法</h3><ul><li>安全確保・迅速な安全確保・基本的な安全確保のアクションカード：キャラクターかロボットがいる隣接する部屋へ通じる空の通路。</li><li>セントリーの防衛計画、アイテムのリン酸塩、支援装備の野戦工兵機器：隣接する空の通路。</li><li>セキュリティロボット室：ロボットがいる部屋に隣接する空の通路。</li></ul>
<div class="warn"><b>要確認：</b>カード和訳表のメモには「未探査の通路は空の通路とみなされないので補強できない」とありますが、ルールブックの定義（空＝イントルーダーがいない通路）にはその記述がありません。</div>`],
['よくある疑問','ドアスロットのある通路とは？',`<p>通路タイルの<b>片方の端にドアを立てる場所（ドアスロット）が描かれている通路</b>のことです。通路タイルの説明図で「C. ドアスロット」と示されている部分で、ここにドアトークン（スタンドに立てた駒）を置くと「閉じたドア」になります。すべての通路にあるわけではなく、ドアスロットのない通路も多くあります。</p>
<ul><li><b>向き</b>：通路を置くときは、ドアスロットを<b>新しく置いた部屋の側</b>に向ける。ゲーム開始時に着陸地点につなぐ3本は、着陸地点の側に向ける。</li>
<li><b>最初は開いている</b>：ドアスロットがあるだけでは何も起きない。駒を置いて初めて閉じた状態になる。</li></ul>
<div class="tbl"><table><tr><th>ドアの状態</th><th>盤面</th><th>効果</th></tr>
<tr><td>開いている</td><td>駒なし</td><td>普通の通路と同じ</td></tr>
<tr><td>閉じている</td><td>駒を立てる</td><td>キャラクターは移動・掃射できない。イントルーダーは通ろうとすると移動せずにドアを破壊。火災は延焼しない。騒音マーカーだけは関係なく置かれる。</td></tr>
<tr><td>破壊されている</td><td>駒を倒す</td><td>開いているのと同じ扱い。二度と閉じられない。</td></tr></table></div>
<p class="note">閉じたドアの向こう側のものには、キャラクターは影響を与えられない（「施設内の任意の部屋へ移動」など、施設内のどこでもと明記された効果は除く）。閉じたドアがあっても、通路と部屋は隣接している扱いのまま。</p>`],
['よくある疑問','ドアトークン（扉の駒）が無くなったら？',`<p><b>そのドアは閉じられず、何も起こりません。</b>ドアトークン（14個）には不足時の特別なルールがないので、黄金律「コンポーネントの上限」により、置けないぶんは無視します。</p><p class="note">破壊されたドア（倒したトークン）は開いている扱いのまま盤面に残るので、サプライには戻りません。開けたドアのトークンはサプライに戻ります。</p>`],
['よくある疑問','「この部屋の周りのドアをすべて閉じる」は、ドアのイラストが無い通路にもドアが生える？',`<p><b>生えません。</b>ドアを閉じられるのは<b>ドアスロットがある通路だけ</b>です（通路タイルに描かれたドアの位置）。ドアスロットのない通路は、普通の「ドアを閉じる」効果では何も起こりません。破壊されたドアも再び閉じることはできません。</p>
<p>例外は、カードに<b>はっきり書いてある場合だけ</b>です。</p><ul><li>アイテム「遮断コード」：破壊されたドアがある場所や、ドアスロットがない場所も閉じる。</li><li>アイテム「携帯遮蔽壁」・メカニックの「プラズマトーチ」：ドアスロットがない場所や破壊されたドアの場所にも閉じたドアを1つ設置できる。</li><li>インサイダーのシェルターのストーリー：破壊されていても、ドアスロットがない通路でもシェルターの周りのドアを閉じる。</li></ul><p class="note">探査カードの進入時効果「この部屋の周りのドアをすべて閉じる」や、イベントカードのドアを閉じる効果は、ドアスロットがある通路だけが対象です。</p>`],
['ロボット','ロボットはどこからでも操作（起動）できる？',`<p><b>どこからでもは操作できません。</b>「ロボットを起動する」アクション（アクションカード1枚）は、次のどちらかの場所でだけ使えます。</p>
<div class="tbl"><table><tr><th>起動のしかた</th><th>条件</th><th>コスト</th></tr>
<tr><td><b>直接起動</b></td><td>ロボットと同じ部屋にいる</td><td>アクションカード1枚</td></tr>
<tr><td><b>遠隔起動</b></td><td>${IC('コンピューター')}のある部屋にいる（ロボットはどこにいてもよい）</td><td>1枚＋追加1枚＝<b>2枚</b></td></tr>
<tr><td>遠隔起動（データトークン所持）</td><td>${IC('コンピューター')}のある部屋にいて、データトークンを持っている</td><td>追加なしの<b>1枚</b></td></tr></table></div>
<ul><li>データトークンはサーバールーム（セクションB）のルームアクションで手に入る。一度手に入れたら失わず、交換もできない。</li>
<li><b>コールドスリープルームが発見されるまで</b>（いずれかの部屋がつながるまで）はロボットカードが裏向きで、起動できない。</li>
<li>ロボットに${IC('故障マーカー')}があると起動できない（ロボットの戦術装備トークンは使える）。同じ部屋にいれば、故障マーカーを取り除く効果でロボットから外せる。</li>
<li>例外として「施設内の任意の場所にいるロボットを起動」できるカードがあります：ハッカーの脳神経接続、パイロットの接続（コンピューターのある部屋から）、アイテムのロボット制御器、支援装備のサポートロボット制御器。</li>
<li>起動すると、ロボットカードに書かれた選択肢のどれか1つを解決（多くは「最大○回移動する」か「その場で効果」）。ロボットのいる部屋が基準になる効果が多い。</li></ul>`],
['ロボット','「コンピューターのある部屋」って何？',`<p>部屋タイルに${IC('コンピューター')}（モニターの形）のアイコンが描かれている部屋のことです。部屋タイルの左下あたり、アイテムアイコンと並んで描かれています。</p>
<ul><li>アイコン自体には効果がなく、カードや部屋の効果が「コンピューターのある部屋で」と条件にしたときに参照される。</li><li>代表的な使い道：ロボットの遠隔起動、サーバールームの「コンピューターのある部屋を使用」、科学者やハッカーのカード、対空防御システムコード・緊急用生命維持システムコードなどのアイテム。</li>
<li>${IC('故障マーカー')}が部屋にあっても、特に指示がなければコンピューターとしては使える（ただし対空防御システムコードなど「故障マーカーがない部屋」と書いてある効果は使えない）。</li>
<li>どの部屋にあるかは部屋タイルごとに違うので、タイルのアイコンで確認してください。</li></ul>`],
['ロボット','ロボットの移動は通路を通る？ 部屋から部屋？',`<p><b>部屋から隣の部屋へ</b>直接移動します。キャラクターと同じく、ロボットが通路に置かれることはありません（通路はつながりを示すだけ）。</p>
<ul><li>「1回移動」＝通路でつながった隣の部屋へ1部屋分。「最大3回」なら3部屋先まで。</li>
<li><b>イントルーダーは完全に無視</b>（通路にいても通れる。追撃も受けない）。イントルーダーもロボットを狙わない。</li>
<li><b>閉じたドアは通れない。</b></li>
<li><b>未探査の通路は通れない</b>ので新しい部屋は発見しない。騒音ロールもしない。</li>
<li>例外は探査ロボットの効果：未探査の通路を通って探査の手順を解決できる（探査カードの進入時効果は解決しない）。</li>
<li>ロボットは自分からは動かない。動くのはプレイヤーの効果だけ。</li></ul>`],





['ロボット','ロボットの弾薬トークン・酸素トークンはどう使う？',`<p>ロボットはゲーム開始時に<b>弾薬トークン1個と酸素トークン1個</b>を持っています。これは<b>ロボットと同じ部屋にいるキャラクター</b>が使えます。</p><ol><li>ロボットと同じ部屋で<b>「戦術装備を使用する」アクション（コスト1）</b>を行う。</li><li>そのとき、自分の戦術ベルトのトークンと同じように、ロボットのトークンも使える。<ul><li>${IC("弾薬トークン")}：武器を1つ選び、そのトークンを武器の弾薬スロットへ移す（装填）。</li><li>${IC("酸素トークン")}：酸素を3回復（最大7）して捨てる。</li></ul></li><li>同じアクションの中で、ロボットと自分のスロットの間でトークンを<b>移し替える</b>こともできる（使わずに自分のベルトへ持っていく、など）。</li></ol><ul><li>別の部屋からは使えません。ロボットを呼び寄せる（サポートロボット制御器など）か、自分が行く必要があります。</li><li>ロボットに故障マーカーがあっても、ロボットの上の戦術装備トークンは使えます。</li><li>使って空いたスロットは、ロボット制御器を捨てる効果で戦術装備トークンを補充できます。</li></ul>`],
['ロボット','ロボットの故障（故障マーカー）の詳細',`<h3>故障するとどうなる？</h3><ul><li>ロボットは<b>一切使えない</b>：ロボットのアクション（起動）も、ロボットに作用するルームアクション（掘削ステーションなど）も不可。ロボットカードはテキストもアイコンもないものとして扱う。</li><li><b>使えるもの</b>：ロボットの上の戦術装備トークン（弾薬・酸素）は、同じ部屋で「戦術装備を使用する」アクションをすれば今までどおり使える。</li><li><b>ロボットが「そこにいる」ことだけが条件の効果</b>は使える。例：安全確保系のアクションカード「キャラクターまたはロボットがいる隣の部屋へ通じる空の通路を補強」。</li><li>故障中のロボットにさらに故障マーカーを置く指示は<b>無視</b>（重量アイテムと違って壊れて捨てられることはない）。</li><li>故障マーカーがサプライに無いときは、代わりにロボットの部屋に火災マーカーを置く（故障マーカーの上限ルール）。</li></ul>
<h3>何で故障する？</h3><ul><li>イベント「機械の台頭（RISE OF THE MACHINE）」：ロボットと、ロボットのいる部屋に故障マーカー。その部屋のキャラクターは2HP減。</li><li>ネオフレッシュのイベント「狂信者の一端」、ジリアン行動カード（ジリアンの部屋にロボットがいれば）。</li><li>軍事ロボットの掃射で★が出たとき。</li></ul>
<h3>どう直す？</h3><ul><li><b>ロボットと同じ部屋</b>で、故障マーカーを取り除く効果を使えば、ロボットから外せる：アクションカード「修理」「迅速な修理」「掃除」、清掃員の「まだ動くはずだ」、アイテム「ダクトテープ」「工具」、支援装備「野戦工兵機器」など。</li><li>別の部屋からは直せない。故障中は呼び寄せ・遠隔起動もできないので、<b>自分がロボットの部屋まで行く</b>必要がある。</li><li>技術ロボットは自分が故障していると自分のアクションが使えないので、自分では直せない。</li></ul><p class="note">例外：イベントカードのロボットに関する効果（「狂信者の一端」など）は、ロボットが故障していても解決します（ネオフレッシュ和訳FAQ）。</p>`],
['カードの疑問','「戦術的撤退（TACTICAL RETREAT）」の詳細。イントルーダーがいる通路を突っ切れる？',`<p><b>突っ切れません。</b>通れるのは<b>空の通路</b>（イントルーダーがいない通路）だけです。このカードの役目は、<b>イントルーダーがいる部屋から、攻撃を受けずに抜け出す</b>ことです。</p>
<h3>カードの効果（コンバットエンジニア）</h3><ol><li>コスト：このカードに加えて<b>アクションカードを1枚捨て</b>、<b>遠距離武器の弾薬を消費</b>する（弾薬のある遠距離武器が必要）。</li><li>空の通路を通って移動する。</li><li>同意してくれた別のキャラクター1人を一緒に連れて行ける。連れられた人は騒音ロールをしない。</li><li><b>この移動中のイントルーダーの攻撃はすべて阻止される。</b></li></ol>
<h3>阻止される攻撃・されない攻撃</h3><div class="tbl"><table><tr><th>攻撃</th><th>阻止？</th></tr>
<tr><td>今いる部屋のイントルーダーからの<b>追撃</b>（部屋を出るときの攻撃）</td><td>される（自分も連れの人も）</td></tr>
<tr><td>移動後の<b>騒音ロール</b>で通路から入ってきた／急襲で現れたイントルーダーの攻撃</td><td><b>されない</b></td></tr>
<tr><td>未探査の通路の先の探査カードの<b>進入時効果</b>で起きた攻撃</td><td><b>されない</b></td></tr></table></div>
<p class="note">「されない」2つは和訳カード表のメモにある公式Discordの回答に基づきます。阻止されるのは移動そのものの間の攻撃だけ、という扱いです。</p>
<h3>使いどころ</h3><ul><li>自分の部屋にイントルーダーがいて、普通に移動すると追撃を何回も受けそうなとき（追撃は最大3回）。</li><li>重傷・瀕死の仲間を連れて安全な部屋へ逃がしたいとき（仲間の同意が必要）。仲間は騒音ロールも追撃もなしで移動できる。</li><li>脱出用の部屋（着陸地点・脱出シャトル・コールドスリープルーム）へ向かう途中の部屋で戦闘に捕まったとき。</li></ul>
<ul><li>通路がすべてイントルーダーで埋まっていたら使えない。その場合は「通路を掃射して空にしてから次の手番で使う」などが必要。</li><li>移動先では自分の騒音ロールは普通に行う。</li></ul>
<p class="note">似たカード：脅威に身を潜める（移動中の攻撃を1回だけ阻止）、サバイバーの目くらまし（アイテムかトークン1つを捨てて、移動中の攻撃をすべて阻止）、閃光手榴弾（移動中の攻撃をすべて阻止）。未探査の通路も「空の通路」として通れるかは、ルールブックと和訳カード表のメモで食い違いがあり要確認。</p>`],
['カードの疑問','「先制射撃（SHOOT FIRST）」とは？ 部屋にイントルーダーがいても使える？',`<p><b>移動と攻撃を1枚でまとめて行うカード</b>です。「空の通路を通って移動する」のが本体で、その移動のどこか好きなタイミングで射撃攻撃か掃射攻撃を<b>1回</b>だけ割り込ませられます。</p>
<h3>空の通路とは</h3><p>イントルーダーが1体もいない通路のこと。${IC('騒音マーカー')}だけがある通路は空の通路に含まれます。</p>
<h3>部屋にイントルーダーがいても使える？</h3><p><b>使えます。むしろそのためのカードです。</b>カードにわざわざ「イントルーダーの攻撃の直前であっても」と書かれているのは、部屋から出るときの<b>追撃</b>の前に撃てるという意味です。</p>
<ol><li>例：自分の部屋にアダルトが1体いる。</li><li>先制射撃を出し、空の通路を選ぶ。</li><li>追撃を受ける前に、そのアダルトを射撃攻撃する。</li><li>倒せれば追撃は起きずに移動できる。倒せなければ通常どおり追撃を受けてから移動する。</li><li>移動先で騒音ロール（急襲で現れたイントルーダーの攻撃の直前に撃つこともできる。ただし攻撃は合計1回だけ）。</li></ol>
<ul><li>射撃・掃射の条件は通常どおり：故障マーカーがなく弾薬のある遠距離武器が必要。掃射なら弾薬を消費する。</li><li>アクションカード1枚で「移動」と「攻撃」の2つ分の働きをする。</li></ul>
<div class="warn"><b>カードに明記なし：</b>「先に掃射で通路のイントルーダーを全滅させて空にし、その通路を通る」ができるかは書かれていません。効果を選ぶ時点で解決できる必要があるため、カードを出す時点で空の通路があることが前提です。ナイトメアルール（迷ったらプレイヤーに不利な解釈）を当てはめると、通る通路はカードを出す時点で空いている通路から選ぶと扱うのが無難です。</div>`],
['カードの疑問','「偵察（SCOUTING）」は騒音ロールが必要？',`<p><b>必要です（どちらの効果を選んでも、通常の移動と同じく騒音ロールが起きます）。</b>カードに「騒音ロールをせずに」と書かれていないためです。騒音ロールなしで動けるのは「隠密移動」のように明記されたカードだけです。</p>
<div class="tbl"><table><tr><th>選んだ効果</th><th>騒音ロール</th></tr>
<tr><td>① 発見済みの部屋へ慎重な移動</td><td>行う。慎重な移動は「移動→セキュアトークンを置く→騒音ロール」の順。</td></tr>
<tr><td>② 未探査の通路を通って移動し、探査の手順＋アイテムを探す</td><td>移動そのものでは振らず、探査の手順に入る。引いた探査カードの<b>進入時効果</b>に騒音ロールが書かれていれば振る（ほとんどのカードに書かれている）。その後、移動先の部屋のアイテムアイコンごとに1枚引いて1枚取る。</td></tr></table></div>
<ul><li>どちらも移動なので、部屋や通る通路にイントルーダーがいれば<b>追撃</b>も通常どおり受ける。</li><li>①は「慎重な移動」（通常はアクションカード2枚）を、このカード1枚で行えるのが利点。</li><li><b>②で奇襲されてもアイテムは取得できる</b>（死亡しなければ）。非戦闘中アイコンの条件はカードを出す時点だけで判定し、出したカードの効果は書かれた順に最後まで解決する。移動先にイントルーダーが現れて戦闘中になっても、効果の途中で止まるルールはない。ただし奇襲の攻撃で死亡したら、残りの効果は解決できない。</li></ul>
<p class="note">名前が似ているスカウトの「偵察任務（RECONNAISSANCE）」も同じで、未探査の通路を通って移動し、探査カードを2枚引いて1枚を選ぶ。選んだカードの進入時効果に騒音ロールがあれば振る。作戦任務の「偵察任務」は別物（A・B・Cの部屋をすべて発見する任務）。</p>`],
['カードの疑問','「指揮官からの通信（OFFICER’S CHANNEL）」の意味は？',`<p>カードの文の頭には${IC('指令')}のアイコンがあり、正しくは「<b>指令</b>カードを1枚プレイする」です。アイコンが抜けると「何のカード？」となりやすいところです。</p>
<p><b>意味：</b>手札から指令アイコン付きのカードをもう1枚出し、そのカードに書かれた「あなたの部屋か隣の部屋」という<b>範囲の制限を外して、施設内のどの部屋にも</b>使えるようにする。</p>
<h3>指令カードは4種類</h3><div class="tbl"><table><tr><th>カード</th><th>普通の範囲</th><th>このカードと組み合わせると</th></tr>
<tr><td>指揮系統（全員が持つ共通カード）</td><td>自分の部屋か隣の部屋の、ランクが低いキャラクター1人に移動・射撃・掃射をさせる</td><td>施設のどこにいる、ランクが低いキャラクターでも動かせる</td></tr>
<tr><td>部隊指揮官（オフィサー）</td><td>同上</td><td>同上</td></tr>
<tr><td>自由射撃（オフィサー）</td><td>自分の部屋か隣の部屋を選び、そこにいる全員に同じ通路へ掃射させる</td><td>施設のどの部屋でも選べる</td></tr>
<tr><td>落ち着け（オフィサー）</td><td>自分の部屋か隣の部屋の全員がアクションカードを1枚引く</td><td>施設のどの部屋でも選べる</td></tr></table></div>
<ul><li>例：遠くの部屋でイントルーダーに囲まれている仲間に「指揮系統」を使い、その場から掃射させる。</li><li>出した指令カードの効果だけを解決する（指揮系統の「リアクション」部分は関係ない）。</li><li>範囲以外の条件はそのまま：ランクが低い相手にしか使えない、追撃を受けるような移動は命令できない、相手の「指揮系統」のリアクションで無効にされることがある。</li><li>手札に指令カードがなければ、こちらの効果は使えない。そのときはもう一方の効果「着陸機トークンを1マス動かす」を選ぶ。</li></ul>`],
['カードの疑問','「行くぞ！（LET’S GO!）」で一緒に移動して奇襲されたら、どっちが攻撃される？',`<p><b>カードを使った本人（騒音ロールをした人）が攻撃されます。</b></p><ul><li>「行くぞ！」では、一緒に移動するキャラクターは騒音ロールをしない。<b>騒音ロールをするのはカードを使った本人だけ。</b></li><li>騒音ロールで通路から入ってくるイントルーダーは、ルールブックに「<b>騒音ロールを行ったキャラクターを攻撃</b>」とはっきり書かれている。</li><li>急襲（${IC('急襲（騒音ダイス）')}）で部屋に現れたイントルーダーも、プレイヤーの効果がきっかけで入ってきたので、その効果を使ったキャラクター（本人）を攻撃する。</li><li>本人が攻撃できない状況（その攻撃で死亡した後に残りが攻撃する場合など）になって初めて、手番順で次のキャラクターが対象になる。</li></ul>
<p class="note">標的の決め方は「最も近い→攻撃や移動のきっかけを作ったキャラクター→手番順で最初」の順。同じ部屋なら距離は同じなので、きっかけを作った本人が選ばれる。一緒に移動する人の同意は不要（コンバットエンジニアの戦術的撤退は同意が必要）。</p>`],
['アイコン一覧','アイコン一覧（和訳ルールブックの画像から）','__ICONS__'],
['よく迷う順番','自爆が先？ 脱出が先？',`<p>同じラウンドの中では<b>脱出が先、爆発が最後</b>です。</p><div class="timeline">
<div class="tl"><span class="w">プレイヤー</span><span>脱出シャトル・コールドスリープ・着陸機への搭乗は、ここで部屋を使用して行う。</span></div>
<div class="tl"><span class="w">イベント開始時</span><span>着陸機に乗っている人が離陸を決める→脱出成功。</span></div>
<div class="tl"><span class="w">クリーンアップ</span><span>時間の経過でラウンドマーカーが自爆トークンのマスに入る→爆発。</span></div></div>
<ul><li>着陸機に<b>乗っているだけ</b>で離陸していなければ、施設内にいる扱いで死亡します。</li><li><b>コールドスリープ中のキャラクターも爆発で死亡</b>します。爆発するなら、助かるのは脱出シャトルか離陸した着陸機だけ。</li><li>自爆トークンが最後のマスの後ろにある場合は、ゲーム終了時に発動（コールドスリープ組も死亡）。</li><li>火災マーカーが尽きて施設が破壊される場合は、その瞬間にゲーム終了。</li></ul>
<div class="warn"><b>ルールに記述なし：</b>着陸機トークンと自爆トークンが同じマスに重なった場合の順番は書かれていません。ナイトメアルール（プレイヤーに最悪の解釈）に従うなら、爆発が先と扱うのが妥当です。</div>`],
['よく迷う順番','着陸機はいつ確認（判定）する？',`<p><b>クリーンアップの「時間の経過」</b>でラウンドマーカーが着陸機トークンのマスに入った瞬間です。初期位置は「10」なので、通常は<b>ラウンド9の終わり</b>に判定します。</p>
<ol><li>対空防御の重なった2枚のうち、<b>上のトークン</b>を公開。</li><li>停止（または反応炉で対空防御が除去済み）→着陸成功。着陸地点に着陸機を置き、対空防御トークンを除去（以後は変更不可）。</li><li>稼働→着陸機は破壊されて除去。この方法での脱出は不可能に。</li></ol>
<ul><li>着陸した次のラウンドから、着陸地点のルームアクションで乗り込めます。最速の離陸はさらにその次のイベントフェイズ開始時。</li><li>事前に生命維持システム制御室Bで2枚を秘密裏に確認し、上下を入れ替えられます。嘘をついてもよいが、トークンを見せてはいけない。</li><li>指揮系統などのカードで、着陸機トークンを1マス前後に動かせます。</li></ul>
<div class="warn"><b>要確認：</b>英語原文は「ラウンドマーカーが着陸機トークンのマスに置かれたとき（またはその逆）」です。直訳では、カード効果で着陸機トークンをラウンドマーカーのマスに動かした場合も、その場で判定すると読めます。和訳 v1.4 の補足はその場合は判定しないと書いており、原文と食い違っています。</div>`],
['よく迷う順番','着陸機に乗ってから脱出するまでの流れ',`<ol><li>着陸機が着陸地点に着陸済みであること。</li><li>プレイヤーフェイズに着陸地点の「部屋を使用」（アクションカード2枚）→騒音ロール。</li><li>騒音ロールの後、同じ部屋にイントルーダーがいれば<b>失敗</b>（部屋に残る）。いなければ乗り込み成功。モデルは対空防御スロットへ。</li><li>乗っている間：手番はとばす、酸素もHPも減らない（施設の破壊だけは別）、クリーンアップには参加（カードを引く・スタートプレイヤートークンを受け取る）。</li><li>着陸地点にイントルーダーが現れたら、自動的に降ろされる（次の手番から行動可能）。<span class="note">ジリアンが現れても降りなくてよい。</span></li><li>イベントフェイズ開始時に、誰か1人が決めれば離陸→乗っていた全員が脱出。</li></ol>`],
['よく迷う順番','酸素はいつ減る？ 0になったら？',`<ul><li><b>自分の手番の終わり</b>（2アクションの後、火災ダメージの前）に、生命維持が停止しているセクションにいれば酸素−1。パスした手番でも減ります。</li><li>開始時は<b>全セクションが停止</b>。生命維持システム制御室A/B/Cで切り替えます（反応炉を止めると全停止で、以後は戻せない）。</li><li>稼働中のセクションにいても酸素は回復しない。回復は酸素トークン（＋3）や酸素アイテムだけ。上限は7。</li><li>通路が2つのセクションの境界にあっても、キャラクターは常に部屋にいるので、部屋のセクションで判定します。</li><li>酸素を支払う効果は、0未満になるなら使えない。</li></ul>
<p><b>酸素が${IC('ドクロ')}のマスに達したら</b>：窒息トークンを受け取り、ダイヤルを「0」に戻す。窒息トークンを持った状態で次に酸素を失うと<b>死亡</b>。酸素を1以上得るか、稼働中のセクションで手番を終えれば窒息トークンを捨てる（実質あと1手番の猶予）。</p>`],
['よく迷う順番','火災ダメージはいつ？',`<ul><li>キャラクター：自分の手番の終わり（酸素の後）、火災マーカーのある部屋にいればHP−1。</li><li>イントルーダー：イントルーダーフェイズの最初に1ヒット（ラーヴァ以外は死なない）。巣なら卵1個破壊。</li><li>延焼はイベントカードで起きる。閉じたドアは延焼を防ぐ。</li><li>火災マーカーを置く必要があるのにサプライに残っていなければ、<b>施設は破壊されゲーム終了</b>。</li></ul>`],
['よく迷う順番','複数の部屋・通路に同時に効果があるときの順番',`<p>イベントの移動やイントルーダーの攻撃、通路の騒音マーカーに関わる効果は、<b>施設の左上から横の行ごとに</b>左→右、行が終わったら1つ下の行の左端から。キャラクターに関わる効果は<b>手番順</b>（スタートプレイヤーから時計回り）。</p>`],
['ラウンドの処理','イベントカードの処理順',`<ol><li>イントルーダーの移動（カード上部のアイコン）</li><li>主効果</li><li>副次効果</li><li>捨て札へ</li></ol><p>解決できない文は無視して残りを続けます。${''}イベント中にキャラクターのいる部屋へ入ったイントルーダーは、入った時点で攻撃します。</p>`],
['ラウンドの処理','バッグの発展（トークンごとの効果）',BAGTBL],
['ラウンドの処理','イントルーダーの標的の決め方',`<ol><li>最も近いキャラクター</li><li>同じ距離なら、その攻撃・移動を引き起こしたキャラクター</li><li>まだ同点なら手番順で最初のキャラクター</li></ol><p class="note">ルートの長さが同じなら、ID番号の小さい通路・部屋から始まるルート。ドアは最短ルートの計算では無視。</p>`],
['移動と探査','移動の手順',`<ol><li>方向を選ぶ（隣接する通路）。</li><li><b>追撃</b>：今いる部屋と、通る通路にいるイントルーダーが大きい順に攻撃（最大3回）。</li><li>移動の結果：<br>・発見済みの部屋→移動。慎重な移動ならセキュアトークンを置く。<b>騒音ロール</b>。<br>・未探査の通路→探査の手順。</li></ol><p class="note">騒音ロールは他のキャラクターやイントルーダーがいる部屋へ移動するときも必ず行います（特殊効果を除く）。他のキャラクターに追撃を受ける移動を命令してはいけません。</p>`],
['移動と探査','探査の手順',`<ol><li>探査カードを引き、マップと向きを合わせる。</li><li>部屋を置く：指定タイプの部屋をランダムに1枚（山が尽きたら「?」）。</li><li>通路を置く：カードの位置に。ドアスロットは新しい部屋側。施設の外に出る通路と、既存の部屋につながる通路は置かない。</li><li>マーカー・トークンを置く（すでに騒音マーカーがある通路には置かない）。</li><li>キャラクターを移動。慎重な移動ならセキュアトークン。</li><li>進入時効果（多くは騒音ロール）。</li><li>インサイダーのアイコンは基本ゲームでは無視。</li><li>探査カードを捨てる（ゲームから除外する指示がなければ）。</li></ol>`],
['移動と探査','騒音ロールの結果',`<ul><li><b>数字</b>：今いる部屋に隣接する、その数字の通路それぞれについて<br>・イントルーダーがいる→最大の1体が部屋に入って攻撃<br>・騒音マーカーがある→騒音マーカーを解決（イントルーダー出現）<br>・何もない→騒音マーカーを置く</li><li><b>急襲</b>：バッグからトークンを1個引き、そのアイコンの種類を<b>自分の部屋に</b>1体配置して即攻撃（裏の数字は無視）。</li></ul><p class="note">補強された通路は「0」なので騒音ロールでは騒音マーカーが置かれない。未発見のコールドスリープルームにつながる通路にも置かれない。</p>`],
['移動と探査','騒音マーカーの解決',`<p>騒音マーカーを取り除き、バッグからトークンを1個引いて、その通路に対してヘルプシートどおり解決。<b>トークン裏の数字が通路に置く数</b>、<b>赤い数字はドローンの数</b>。引いたトークンは山へ戻す（ブランクはバッグへ）。</p><p class="note">通路の上限：アダルト・ドローン・ラーヴァ合計6体（クイーンは4体分）。入りきらなければ大きい順に入れ、小さいものと入れ替える。</p>`],
['戦闘','射撃・掃射・近接攻撃',`<h3>射撃（同じ部屋の1体）</h3><ol><li>故障マーカーがなく弾薬のある武器を選ぶ。</li><li>1ヒットを置く。</li><li>射撃ダイス：クリティカル→死亡。数字→その数字が対象のヒット数以下なら死亡。弾薬マーク→弾薬を消費。</li></ol>
<h3>掃射（隣接する通路）</h3><ol><li>武器を選び、<b>弾薬を消費</b>して掃射ダイス。</li><li>出目の数だけヒット：アダルト・ラーヴァは1体1ヒット、ドローンはちょうど2ヒット、クイーンは任意。余りは消える。</li><li>★はダイスの4と同じ面。4ヒット＋武器の追加効果。</li></ol>
<h3>近接攻撃（同じ部屋の1体）</h3><ol><li>感染カードを1枚受け取る。</li><li>1ヒット、射撃ダイス（弾薬マークは「効果なし」）。</li><li>生き残ったら反撃。武器に故障マーカーを置けば阻止（すでに1つあれば武器は破壊）。</li></ol>
<p class="note">弾薬トークンは2回分（満装填→裏返す→捨てる）。グレネード：隣接通路に掃射ダイス＋2ヒット（★の効果なし、弾薬不要）。</p>`],
['戦闘','クイーンへのダメージ',`<p>ヒットはクイーンのヒットトラックを進める。最後のマスに達する（またはクリティカル）と、そのアクションの残りのヒットは無視し、クイーンヘルスカードを1枚引く→書かれた枚数を見ずに追加で捨てる→下部の効果を解決→ヒットトラックを0に戻す。カードがすべてなくなればクイーン死亡（ヘルプシートを裏返す）。</p>`],
['感染と終了','感染チェック手順と羽化の手順',`<h3>感染チェック手順</h3><ol><li>手札の感染カードをすべてスキャン。</li><li>「INFECTED」があればボードにラーヴァ（すでにいれば置かない）。</li><li>手札の感染カードを捨て山へ。</li></ol>
<h3>羽化の手順</h3><ol><li>デッキから4枚引く。</li><li>感染カードが1枚でもあれば<b>死亡</b>（スキャンしない）。なければ全部捨てる。</li></ol><p class="note">ゲーム中にこれで死ぬと、その部屋にアダルトを1体置く（同じ部屋の人は攻撃される可能性）。</p>`],
['感染と終了','目的の選択（引く枚数）',`<p>ゲーム中1回、2枚の目的カードの片方を見せずに除外し、目的選択トラックのマーカーを1つ下げてアクションカードを引く。<b>1人目3枚、2・3人目2枚、4・5人目1枚。</b>ゲーム終了までに選ばなかった人は、目的公開の直前に選ぶ。</p>`],
['基本の約束','黄金律',`<ul><li><b>ナイトメアルール</b>：迷ったらプレイヤーにとって最悪の解決。それでも不明なら、手番順で最初のキャラクターにとって最悪の解決。</li><li><b>局所的な効果</b>：対象の指定がなければ、効果を使うキャラクターがいる部屋で解決。</li><li><b>コンポーネントの上限</b>：特別なルールがなければ、足りないときは何も起こらない。</li></ul>`],
['基本の約束','故障マーカー',`<ul><li>部屋：ルームアクションが使えない（アイテムアイコンには影響なし）。1部屋1個まで。</li><li>重量アイテム：一切使えない（戦術装備トークンは使える）。2個目を置く指示があれば破壊。</li><li>ロボット：使えない。2個目は無視。</li><li>サプライに残っていなければ、代わりにその部屋に火災マーカー。</li></ul>`],
['基本の約束','自爆の起動・停止と反応炉',`<ul><li>起動：冷却システム（セクションB）。自爆トークンを現在のラウンドの5マス先へ。</li><li>停止：反応炉（セクションC）だけ。同時に生命維持システム・自爆・対空防御のトークンがすべて除去され、全セクション停止、二度と戻せない（対空防御は停止扱い＝着陸機は必ず着陸）。</li></ul>`],
['カードの疑問','アイテムは使うとなくなる？',`<p><b>基本はなくならず、何度でも使えます。</b>捨てるのは次の場合だけです。</p><ul><li>カードに「1回のみ（ONE USE ONLY）」と書いてある。</li><li>効果の文に「このアイテムを捨てて〜」と書いてある（その効果を選んだときだけ）。</li></ul><p>武器・道具・支援装備（塹壕掘削器、騒音スキャナ、セキュリティシステム制御装置など）は使っても残ります。ただし使うたびにアクション（アイテムの使用）は必要です。捨てたアイテムは対応する色の捨て札へ。</p>`],
['戦闘','掃射ダイスの★（特殊シンボル）って何？',`<p>★は<b>「4」と同じ面</b>にあります。この面が出たら<b>4ヒット＋追加効果</b>の両方を適用します。</p><ul><li>追加効果は、使った武器やアクションカードに「★の場合〜」と書かれているものだけ（例：ガトリング銃は故障マーカー、火炎放射器は自分の部屋に火災マーカー）。</li><li>武器にもアクションにも★の効果がなければ、4ヒットだけ。</li><li>グレネードでは★の効果は解決しません（出目＋2ヒット）。</li></ul>`],
['よくある疑問','イントルーダーの卵は重量アイテム？',`<p><b>はい、重量アイテムです。</b>ハンドスロット1つに1個だけ持てます。両手が埋まっているなら、持っている物を1つ捨てて持ち替えます。巣のルームアクション（またはUAVの「集荷と配達」）で拾います。巣の卵をすべて取り除くと巣は破壊されます。</p>`],
['カードの疑問','UAVはどう動く？ 通路・ドア・イントルーダーは？',`<h3>未探査の部屋へ行けるカード／行けないカード</h3><div class="tbl"><table><tr><th>カード</th><th>UAVの移動</th></tr><tr><td>探査（EXPLORATION）</td><td><span class="uavb ok">未探査OK</span> 選択肢Bで未探査の通路の先へ動かして探査（進入時効果なし）。選択肢Aの「最大2回移動」は発見済みの部屋だけ。</td></tr><tr><td>自爆（AUTODESTRUCTION）</td><td><span class="uavb no">発見済みのみ</span> 最大4回移動</td></tr><tr><td>防衛システム（DEFENSE SYSTEMS）</td><td><span class="uavb no">発見済みのみ</span> 最大2回移動（選択肢Bは自分がUAVのところへ移動）</td></tr><tr><td>集荷と配達（PICKUP AND DELIVERY）</td><td><span class="uavb none">移動なし</span> 回収後、UAVを自分の部屋に置く</td></tr></table></div><p class="note">新しい部屋を探査できるのは「探査」の選択肢Bだけ。他の「最大○回移動」は、ロボットと同じく発見済みの部屋の間だけを動くと読むのが自然です（カードに未探査の通路を通れるとは書かれていないため）。アイテムの「探査ドローン」は、移動せずに隣の部屋を探査できます。</p><p>カードから分かること：</p><ul><li>UAVオペレーターのアクションで「UAVを最大○回移動」。<b>自分の移動ではないので騒音ロールは書かれていません。</b></li><li>防衛システム：UAVが隣の部屋にあれば、騒音ロールなしでその部屋へ移動できる。リアクションでUAVの部屋の攻撃を1回防ぐ。</li><li>探査：未探査の通路を通してUAVを動かし探査（進入時効果なし）。</li><li>集荷と配達：UAVの部屋から卵・戦術装備・アイテムを1つ取り、UAVを自分の部屋へ戻す。</li><li>自爆：UAVの部屋と隣の通路すべてでドア破壊、イントルーダー全員にクリティカル、キャラクターは3HP減。UAVは除去。</li></ul><p class="note">要確認：UAVの移動の細かいルール（部屋→部屋か、ドアやイントルーダーのいる通路を越えられるか）は、手元の資料（基本ルール・和訳）に載っていません。UAVオペレーターのキャラクター資料で確認してください。</p>`],
['カードの疑問','「迅速な再装填（FAST RELOAD）」の弾薬はサプライから？',`<p><b>いいえ、自分が持っている弾薬トークン</b>を1つ武器に入れます。サプライから新しく取るわけではありません。装填と射撃（または掃射）は好きな順番で行えます。</p>`],
['カードの疑問','メカニックの「作業用通路（TECHNICAL CORRIDORS）」は騒音ロールが要る？',`<p><b>要ります（訂正）。</b>黄アイテムのある部屋から、カードを1枚追加で捨てて、施設内の黄アイテムのある別の部屋へ移動し、パスします。</p><ul><li>ルールブックの「秘密の通路」：距離に関係なく特定の部屋へ移動できる効果は、<b>方向を選ぶステップ以外は通常の移動の手順どおり</b>に解決する。→ 今いる部屋のイントルーダーからの<b>追撃</b>を受け、着いたら<b>騒音ロール</b>。</li><li>作業用通路の入口（部屋）の和訳注記にも「移動した後に、通常と同様に騒音ロールを行う」とあります。</li><li>サバイバーの「通気口」も同じ考え方で、移動後に騒音ロール。</li></ul><p class="note">以前この項目で「騒音ロールは不要」と書いていましたが誤りでした。</p>`],
['カードの疑問','「鋼の心臓（NERVES OF STEEL）」はいつ使う？',`<p><b>リアクション</b>です。自分の手番中にイントルーダー1体から攻撃を受けるとき（追撃・奇襲など）に、その攻撃を防ぎます。攻撃カードを引く前に宣言します。自分の手番の外（イベントフェイズの攻撃など）には使えません。</p>`],
['カードの疑問','「フルオート射撃（FULL AUTO）」は1アクションで何回でも撃てる？',`<p><b>はい、弾薬が続く限り何回でも掃射できます。</b>1回ごとに弾薬を消費し、撃つたびに別の通路を選べます。途中で装填はできません。</p>`],
['カードの疑問','「扇状射撃（FANNING）」の「任意の数の弾丸」とは？',`<p>旧式六連発拳銃の弾丸（汎用マーカー）を<b>好きな数だけ一度に使い</b>、その数と同じヒットを、隣の通路か自分の部屋のイントルーダー1体に与えます。ダイスは振りません。弾丸は残った分だけ使えます。</p>`],
['カードの疑問','旧式六連発拳銃はリロードできる？',`<p><b>弾薬トークンでは装填できません。</b>弾丸は銃に置いた汎用マーカー6個です。補充できるのは「六連発弾薬カートリッジ（6発に戻す）」と「一握りの弾丸」の効果だけです。</p>`],
['カードの疑問','「気絶（STUN）」の使い方',`<p>2つから1つを選びます。</p><ul><li><b>選択肢A</b>：手札3枚以下のキャラクター1人に、手札を全部捨てさせてパスさせる（裏切り者や邪魔なプレイヤーを止める）。</li><li><b>選択肢B</b>：自分の武器に故障マーカーを置き、感染カードを1枚受け取って、部屋のイントルーダーを1体撃退する（緊急脱出用）。</li></ul>`],
['カードの疑問','「細胞標本」とは？ 探査アームは？',`<p>細胞標本はトークン（マーカー）で、科学者系の効果（生体解剖など）の威力を上げたり、条件として使ったりします。<b>探査アーム（PROBE ARM）</b>は近接武器として使え、近接攻撃のたびに細胞標本を1つ得ます。ただし近接攻撃なので毎回感染カードを1枚受け取ります。</p>`],
['カードの疑問','閃光手榴弾は通路のイントルーダーも止められる？',`<p>閃光手榴弾は「移動し、その移動中の攻撃をすべて防ぐ」アイテムです。<b>イントルーダーがいる部屋から出るときの追撃を防げる</b>ので、群れのいる場所からも安全に離脱できます。</p><p class="note">移動後の騒音ロールや探査カードの進入時効果による攻撃は防げません。閉じたドアは通れません。</p>`],
['カードの疑問','個人ログコード・緊急用生命維持システムコードは何に使う？',`<ul><li><b>個人ログコード</b>：コンピューターのある部屋で、施設内のキャラクター1人の目的カードをこっそり見る。裏切りを警戒したり協力相手を決めたりするのに使う。</li><li><b>緊急用生命維持システムコード</b>：コンピューターのある部屋から、どのセクションの生命維持でも1つ切り替える。遠くのセクションの酸素を復旧できる。</li></ul>`],
['カードの疑問','ロボット制御器・サポートロボット制御器は何に使う？',`<ul><li><b>ロボット制御器</b>：どこにいるロボットでも起動できる。または捨てて、ロボットの空きスロットに戦術装備トークンを補充。</li><li><b>サポートロボット制御器</b>（支援装備）：どこにいるロボットでも起動、またはロボットを自分の部屋に呼び寄せる（未発見なら公開してから）。何度でも使えるのが強み。</li></ul>`],
['カードの疑問','リン酸塩・工具・消火器は何に使う？',`<ul><li><b>リン酸塩</b>：隣の空の通路を1つ補強するか、火災マーカーを取り除く。</li><li><b>工具</b>：故障マーカーを1つ外すか、手の届くドアを1つ開け閉めする。</li><li><b>消火器</b>：火災マーカーを取り除くか、部屋のイントルーダーを1体撃退する。</li></ul>`],
['カードの疑問','境界セキュリティデバイス・塹壕掘削器の使い方',`<ul><li><b>境界セキュリティデバイス</b>：新しい部屋を発見するとき、騒音ダイスの急襲の結果を無視する。探査役が持つと奇襲を受けにくい（数字の目は普通に解決）。</li><li><b>塹壕掘削器</b>：手の届くドアを1つ壊すか、セキュアトークンを2個置く。何度でも使える。壊したドアは二度と閉じられない。</li></ul>`],
['カードの疑問','火炎放射器・ガトリング銃・グレネードランチャーの強み',`<ul><li><b>火炎放射器</b>：射撃・掃射が強力。★や弾薬マークで自分の部屋に火災マーカーが置かれ、生命維持停止中のセクションでは酸素も払うのが代償。</li><li><b>ガトリング銃</b>：掃射の後、弾薬を使わず同じ通路へ2回目の掃射。<b>1回目は普通に弾薬が減ります。</b>1回目に★が出ると故障して2回目は撃てない。</li><li><b>グレネードランチャー</b>：掃射の前か代わりに、この武器のグレネードを好きな数だけ撃てる。1アクションで複数の通路を一掃できる。</li></ul>`],
['カードの疑問','セキュリティシステム制御装置・騒音スキャナの使い方',`<ul><li><b>セキュリティシステム制御装置</b>：自分のセクションのセキュアトークンがある部屋を選び、トークンを1つ捨てて、その部屋の隣の通路に掃射ダイス分のヒット。離れた場所から攻撃でき、自分は危険にさらされない。</li><li><b>騒音スキャナ</b>：施設内のどこかの騒音マーカーを1つ取り除いて騒音ロール。安全な場所で先にイントルーダーを出させたり、危ない騒音マーカーを処理したりできる。</li></ul><p class="note">どちらも使ってもなくなりません（何度でも使える）。</p>`],

['よくある疑問','重傷の治し方（治療の方法一覧）',`<p><b>重傷は休んでも自然には治りません。</b>決まった<b>部屋・アイテム・カード</b>でだけ取り除けます（ルールブック「重傷」）。<b>医療パックトークンや休憩ではHPは戻っても重傷は治りません</b>。</p>
<h4>部屋（ルームアクション＝コスト2）</h4><ul>
<li><b>救急処置室</b>：<b>2HP回復</b> または <b>重傷を1つ取り除く</b>（どちらか1つ）。</li>
<li><b>手術室</b>：<b>ラーヴァ除去＋感染カードのスキャン</b> または <b>重傷を1つ取り除く</b>（どちらか1つ）。ルールブックでも「重傷を捨てる一番簡単な方法」。</li></ul>
<p class="note">どちらも「またはどちらか一方」。両方やりたければ2回使う（コスト2を2回）。部屋に故障マーカーがあると使えません。</p>
<h4>アイテム（アイテムの使用＝コスト1）</h4><ul>
<li><b>医療キット</b>（緑）：重傷を1つ取り除く <b>および／または</b> 3HP回復（両方できる）。</li>
<li><b>医療用ホチキス</b>（緑）：重傷を1つ取り除く、または別の効果（カードの2つ目の効果は実物で確認してください＝<b>要確認</b>）。</li>
<li><b>医療パック</b>（緑アイテムのカード）：2HP回復 または 医療パックトークン1つ取得。<b>重傷は治らない</b>。</li></ul>
<h4>キャラクターのカード</h4><ul>
<li><b>メディカルサポート「野戦手術」</b>：カード1枚を追加で捨てて、<b>同じ部屋のキャラクター1人の重傷を1つ</b>取り除く（自分でも仲間でも）。その後、自分が医療パック1つを捨てるか、治された人が感染カード1枚。仲間を治すには本人の同意が必要。</li>
<li><b>サバイバー「屈強」</b>：アイテム1つを捨てて重傷を1つ取り除く（またはカードを引く効果）。</li>
<li><b>ラボラット「奇妙な代謝」</b>：<b>巣にいるとき</b>、2HP回復 または 重傷を1つ取り除く。</li></ul>
<h4>その他</h4><ul>
<li><b>医療ロボット</b>：同じ部屋のキャラクター1人の重傷を1つ取り除く または 2HP回復。</li>
<li><b>サングレヴォア「血の盟約」</b>（血の穢れ）：同じ部屋の別の人に1HPを失わせ、自分は2HP回復 または 重傷を1つ取り除く。</li>
<li><b>ソロ・協力の蘇生</b>：手術室で蘇生したキャラクターは重傷をすべて捨てる。</li></ul>
<h4>治すときの細かいルール</h4><ul>
<li>重傷が複数あるときは、<b>どれを捨てるか自分で選べる</b>。残った重傷は<b>左へ詰める</b>。</li>
<li>重傷を捨ててもヘルスマーカーは<b>動かない</b>（HPは別に回復が必要）。空いたセクションの分だけ最大HPが戻る。</li>
<li>同じ重傷が2枚あるときは、<b>2枚とも治すまで</b>その悪影響は消えない。</li></ul>
<h4>優先して治したい重傷</h4><ul>
<li><b>出血・肺・内臓</b>：パスするたびにHP・酸素・感染が積み重なる。<b>長引くほど危険</b>。</li>
<li><b>胴体</b>：毎ラウンド手札が1枚減る＝行動量が落ち続ける。</li>
<li><b>腕</b>：両手持ちの装備が持てない。<b>眼</b>：射撃の結果+1。<b>手・脚・膝</b>：特定のアクションが重くなる。</li></ul>
<p class="note">アプリの「🎒 装備」で重傷を登録しておくと、治したときにタップで外せます。</p>`],
['よくある疑問','同じ重傷を2枚負ったら効果は2倍？（例：眼が2枚で射撃+2？）',`<p><b>いいえ、+1のままです。</b>まったく同じ重傷を2枚負うことはありますが、<b>効果は重ねません</b>（ルールブック「重傷」）。</p><ul><li>ただしカードは2枚とも置きます。それぞれヘルスセクションを1つずつふさぐので、<b>HPの最大値はちゃんと2枚分減ります</b>。</li><li>1枚を治しても、もう1枚が残っていれば悪影響は続きます。2枚とも治して初めて消えます。</li><li>重傷を複数持っているときは、治す効果でどれを捨てるか選べます。残りは左へ詰めます（ヘルスマーカーは動かしません）。</li></ul>`],

['ネオフレッシュ','狂信者（カルティスト）とは？ 何をしてくる？ 倒すと何が起きる？',`<p>マザーブレインにつながれた半死半生の人間。ネオフレッシュカルトの<b>力の源（バッテリー）</b>です。ネオフレッシュで遊ぶときだけ登場します。</p>
<h3>どう出てくる？</h3><ul><li>ネオフレッシュの探査カードで、<b>新しく発見した部屋にコンピューターがあると狂信者が1体置かれる</b>。</li></ul>
<h3>狂信者は何もしない（ふだんは）</h3><ul><li>特に指示がない限り、<b>移動しない・攻撃しない</b>（イントルーダーの攻撃ステップでも攻撃しない）。イベントカードでも移動しない。</li><li>狂信者しかいない部屋にいるキャラクターは<b>戦闘中ではない</b>。部屋の使用・慎重な移動など「非戦闘中」のアクションができる。</li></ul>
<h3>何をされる？（生きているだけで不利）</h3><ul><li>ネオフレッシュのイベントカードには「狂信者が○人以上生き残っていれば〜」（1〜5人）という効果が多い。<b>生き残りが多いほどイベントがひどくなる</b>。例：<ul><li>1人以上：コンピューターの部屋のキャラクターが感染チェック、寄生されたキャラクターがその場で羽化の手順（躯体からの離脱）、ロボットの部屋に火災とHP減</li><li>2人以上：着陸地点にスラッシャーがいれば<b>着陸機を除去</b>、全員が急襲</li><li>3人以上：着陸機が14マス目なら除去、それ以外は<b>5マス遅れる</b>／トゥイッチリングが着陸地点へ行き戦術装備を消す</li><li>4人以上：<b>自爆プロシージャーを起動</b></li><li>5人以上：生命維持をすべて停止</li></ul></li><li>数え方：「死んだネオフレッシュ狂信者タイル」の上で、死んだ狂信者モデルに覆われずに見えているアイコンの数。</li><li>狂信者のスキル（有効な間）：狂信者にヒットかクリティカルを与えるたびに、<b>そのキャラクターは騒音ロール</b>。1回のアクションで何ヒット与えても騒音ロールはアクション後に1回。倒したときも行う。</li></ul>
<h3>倒すとどうなる？（大きな見返り）</h3><ol><li>狂信者のモデルを死んだ狂信者タイルに置く → 見えるアイコンが減り、<b>以後のイベントが弱くなる</b>。</li><li><b>有効なスキルカードを1枚選んで無効化</b>（裏返す）。スラッシャーの2回攻撃、クロールマインの爆発、アイアンクラッドの盾、ファイアスピッターの反撃、トゥイッチリングの耐久、狂信者の騒音ロールから好きなものを消せる。</li></ol>
<h3>倒し方</h3><ul><li>射撃・掃射など「イントルーダーを対象にできるアクション」で狙える。体力は<b>アダルトと同じルール</b>。</li><li>スキルの無効化は騒音ロールの<b>前</b>に行う。最初の1体を倒したときに「狂信者のスキル」を無効化すれば、その騒音ロールもしなくてよい。</li><li>キャラクター以外（ジリアンなど）が倒した場合は、番号が一番大きいスキル（＝まず狂信者のスキル）が自動で無効になり、騒音ロールもしない。</li></ul>
<h3>強み・弱み（まとめ）</h3><ul><li><b>強み（敵側）</b>：放っておくとイベントが強化され続ける。撃つたびに騒音ロールでイントルーダーを呼ぶ。</li><li><b>弱み（敵側）</b>：動かず攻撃もしないので、安全に狙える的。倒すたびにカルトのスキルを1つ剥がせる。</li><li><b>おすすめ</b>：見つけたら早めに倒す。1体目では狂信者のスキル、次は今いちばん困っているスキル（例：アイアンクラッドやスラッシャー）を無効化する。</li></ul>`],
['ジリアン','忠誠とは？（ジリアンへの忠誠カード）',`<p><b>忠誠</b>は、1人のキャラクターだけが<b>ジリアンと一時的に手を組める</b>仕組みです。忠誠カードを持つと、ジリアンの妨害の一部を受けなくなり、<b>ジリアンを自分の都合で動かせる</b>ようになります（ジリアン拡張ルールブック「ジリアンへの忠誠」）。</p>
<h4>忠誠トークンはどこに出る？</h4><ul>
<li>準備で<b>忠誠カード</b>を「利用可能」の面でマップの近くに置き、<b>忠誠トークン1個</b>を脇に置く。</li>
<li><b>ジリアン探査カード</b>（ジリアン1体と忠誠トークンを置くほう）を引くと、移動先の部屋に<b>ジリアン1体と忠誠トークン</b>が置かれる。</li></ul>
<h4>忠誠を誓う（1アクション）</h4><ul>
<li>忠誠トークンのある<b>部屋にいる</b>とき、<b>アクションカード1枚</b>を捨てて忠誠トークンをゲームから取り除く。</li>
<li>忠誠カードを<b>「獲得」の面</b>にして自分のキャラクターボードの横に置く。この瞬間から効果が有効。</li>
<li><b>1ゲームに1人だけ</b>。一度取られたら他の人は取れない。持ち主が<b>死亡するとカードはゲームから除去</b>。</li></ul>
<h4>持っているとどうなる？</h4><ul>
<li><b>守られる</b>：ジリアン行動カードの<b>下段「それ以外のジリアン」</b>を解決するとき、ジリアンは<b>あなたを無視</b>する（例：「最も近いキャラクターへ移動」の対象にならない）。</li>
<li><b>説得できる</b>：<b>あなたの部屋にジリアンがいる</b>とき、<b>アクションカード1枚＋アイテム1個</b>を捨てて、<b>ジリアンの行動を1回解決</b>させられる（ジリアン行動カードを1枚引いて解決）。<b>この行動中、ジリアンはあなたを完全に無視</b>する。</li>
<li><b>制約</b>：<b>ジリアンに武器を使えない</b>（射撃・近接攻撃などで撃てない）。</li></ul>
<p class="note">守られるのは「下段」だけ。ジリアンが<b>あなたと同じ部屋</b>にいると、通常の行動では<b>上段（部屋への攻撃）</b>が解決され、あなたも巻き込まれます（説得のアクション中を除く）。</p>
<h4>注意するイベント</h4><ul>
<li><b>奴隷狩り</b>（ジリアンイベント）：以後のジリアンフェイズで<b>すべてのジリアンが忠誠カードを持つキャラクターへ2回移動</b>。持ち主に集まってくる＝上段の攻撃を受けやすくなる。</li></ul>
<h4>使いどころ</h4><ul>
<li><b>説得</b>でジリアンを動かすと、行動カードの効果で<b>イントルーダーやクイーンにクリティカル</b>を与えたり、巣の卵を壊させたりできることがある（何が出るかは運）。</li>
<li>ただし着陸機の除去・自爆起動・コールドスリープ停止など<b>脱出を邪魔する効果</b>もデッキに入っている。引くカードは選べないので、脱出手段が整った終盤ほど危険。</li>
<li>ジリアンを2回倒して<b>ジリアンアイテム</b>を狙いたいなら、倒す役は忠誠を持たない仲間に。</li></ul>`],
['ジリアン','ジリアンアイテムの取得方法（倒す→拾う→装備）',`<p><b>ジリアンアイテム</b>は、ジリアンを<b>2回倒す</b>と手に入るハイテク装備（3種類・すべて<b>アーマー</b>）。拾うと<b>重傷1枚を捨ててHP3回復</b>もでき、とても強力です（ジリアン拡張ルールブック「ジリアンの死」「ジリアンアイテム」）。</p>
<h4>1. ジリアンを倒す（2回）</h4><ul>
<li>射撃は<b>アダルトと同じ判定</b>。イントルーダー扱いなので、ヒットを与えるカード効果やグレネードも使える。<b>掃射はできない</b>（ジリアンは通路にいない）。</li>
<li>ジリアンに<b>1ヒット以上与えたアクションの後は毎回騒音ロール</b>（倒しても倒せなくても）。</li>
<li><b>1回目の死亡</b>：死なずにヒットをすべて取り除き、<b>負傷トークン（Injured面）</b>をモデルの下に置く。</li>
<li><b>2回目の死亡</b>（負傷トークンがある状態）：モデルをゲームから除去（二度と戻らない）。<b>負傷トークンを裏返す＝ジリアンアイテムトークン</b>として、その部屋に残る。</li></ul>
<p class="note">倒す前にジリアンが痕跡トークンに置き換わるなど<b>マップから離れると、負傷トークンも取り除かれる</b>＝やり直し。2回目は一気に倒すのが大事です。</p>
<h4>2. 拾う（1アクション）</h4><ul>
<li>条件：ジリアンアイテムトークンのある<b>部屋にいる</b>＋<b>戦闘中ではない</b>（同じ部屋にイントルーダーがいない）。</li>
<li>コスト：<b>アクションカード2枚</b>を捨てる（1アクション扱い）。</li>
<li>拾ったらトークンをゲームから除去し、この順で解決：<ol><li><b>重傷を1枚捨て、HPを3回復</b>（装備する前に行う）。</li><li><b>ジリアンアイテムカードをランダムに1枚</b>獲得。</li></ol></li></ul>
<h4>3. 装備する（アーマー）</h4><ul>
<li>通常のアーマーとして扱う＝<b>瀕死セクション</b>に置き、ヘルスマーカーが入ると壊れる。</li>
<li><b>すでにアーマーがある</b>ときはどちらかを選ぶ。ただし<b>治療効果（重傷1枚・HP3）を受けるにはジリアンアイテムを装備する必要がある</b>（治療だけ受けて元のアーマーを残すことはできない）。</li>
<li>すでに<b>瀕死</b>でアーマーを置けない状態なら、通常のアーマーと同じく装備できない点に注意。</li></ul>
<h4>ジリアンアイテム3種類</h4><ul>
<li><b>戦闘技術</b>：イントルーダーに攻撃された後、死んでいなければ<b>攻撃したイントルーダーにクリティカル</b>。</li>
<li><b>ステルス技術</b>：騒音ロールで<b>急襲以外の結果をすべて無視</b>（騒音マーカーを置かなくてよい）。</li>
<li><b>生命維持技術</b>：<b>パスするたびに酸素を獲得</b>、手番終了時の<b>火災によるHP減を無視</b>。<span class="note">（獲得する酸素の数は手元データの読み取りが不確かなため実物で確認＝要確認）</span></li></ul>
<h4>知っておくと得なこと</h4><ul>
<li>ジリアンは最大3体なので、<b>アイテムも最大3つ</b>。</li>
<li>イベント「<b>新たな指令</b>」がラウンド5以前に出ると、「公式命令」の目的には<b>ジリアンアイテムを持った人が1人以上脱出</b>が追加される。</li>
<li><b>忠誠カード</b>を持つ人はジリアンに武器を使えないので、倒すのは他の人の役目。</li>
<li>ジリアンと同じ部屋でも戦闘中ではないので、<b>ジリアンがいる部屋でも拾える</b>（イントルーダーがいなければ）。</li></ul>`],
['ジリアン','ジリアンイベントカードってどれ？ 引いたら？',`<p>ジリアン拡張に入っている専用のイベントカード<b>3枚</b>（新たな指令／奴隷狩り／クイーンの追跡）のうち、準備で<b>ランダムに1枚だけ</b>通常のイベントデッキに混ぜたカードです（残り2枚は使わない）。混ぜるときは、デッキの一番上がジリアンのカードにならないようにします。</p>
<ul><li><b>見分け方</b>：裏面の絵柄が通常のイベントカードと違うので、デッキの一番上に来たら分かります（デッキの途中を覗いて探すのは禁止）。</li>
<li><b>引いたら</b>：①「このカードを引いた際に」の指示を解決 ②<b>イベントカードをもう1枚引いて普通に解決</b>。</li></ul>
<h3>3枚の効果</h3><ul><li><b>新たな指令</b>：ジリアンが2体以下ならコールドスリープルームにジリアン1体。ラウンド5以前なら作戦任務に追加条件（ジリアンアイテムを持った人が1人以上脱出）。</li><li><b>奴隷狩り</b>：コールドスリープルームに痕跡トークン。以後ジリアンフェイズごとに全ジリアンが<b>忠誠カードの持ち主へ2回移動</b>。</li><li><b>クイーンの追跡</b>：コールドスリープルームに痕跡トークン。以後ジリアンフェイズごとに全ジリアンが<b>クイーンへ移動してクリティカル</b>。</li></ul>`],
['ジリアン','探査ロボット（UAV・探査ドローン）がジリアン探査カードを引いたら？',`<p><b>結論（推奨の読み方）：ジリアン探査カードの効果はふつうに解決し、「あなた」はロボット（UAV）として読む。</b></p>
<ul><li>探査ロボットなどは「探査の手順を解決する。<b>探査カードの進入時効果は解決しない</b>」。とばすのはカード<b>一番下の進入時効果</b>だけ。ジリアン探査カードの指示は進入時効果ではないので解決する。</li>
<li>「ジリアントークンをバッグに加える」→そのまま。</li>
<li>「ジリアン1体と忠誠トークンを、<b>あなたが移動した先の部屋</b>に置く」→<b>ロボットが移動して発見した部屋</b>に置く（探査ドローンなら、探査した隣の部屋）。</li>
<li>「痕跡トークンを<b>あなたの移動元の部屋</b>に置く」→<b>ロボットが出発した部屋</b>に置く。</li>
<li>「このカードをゲームから取り除き、探査カードをもう1枚引いて解決」→もう1枚引いて、その部屋を普通に探査（そのカードの進入時効果もとばす）。</li></ul>
<p class="note">要確認：ロボットやUAVが引いた場合の扱いは、手元のルールブック・FAQに書かれていません。上は「進入時効果だけをとばす」というカードの文から読んだ扱いです。迷ったら黄金律（プレイヤーに不利な方）で決めてください。</p>`],
['ジリアン','ジリアンの行動カードってどれ？ どう読む？',`<p>ジリアン拡張の専用の山札<b>「ジリアン行動デッキ」</b>（Xyrian Activation、全10枚）。準備のとき<b>イントルーダーの攻撃デッキの隣</b>に伏せて置く山です。</p>
<h3>いつ引く？</h3><ul><li>マップにジリアンがいるとき、毎ラウンドのイベントフェイズの最初（<b>ジリアンフェイズ</b>）に1枚。</li><li>マップにジリアンがいる状態で、バッグから<b>ジリアントークン</b>が引かれたときにも1枚。</li><li>マップにジリアンがいなければ引かない。</li></ul>
<h3>読み方（ジリアンごとに上段か下段のどちらかに従う）</h3><ul><li><b>上段「キャラクターと同じ部屋のジリアン」</b>：キャラクターがいる部屋のジリアン。主にその部屋への攻撃（ステータスカード・重傷・HP減など）。</li><li><b>下段「それ以外のジリアン」</b>：残りのジリアン。着陸地点へ向かう、自爆起動、コールドスリープ停止など。</li><li><b>負傷トークンがあるジリアン</b>は行動せず、代わりにトークンを捨てる。</li><li>カードによっては一番下にも効果がある（例：このカードをデッキに戻してシャッフル）。</li><li>解決したカードは行動デッキの<b>一番下</b>に戻す。</li></ul>
<p>カード検索で「ジリアン行動カード」と入力するか、種類「ジリアン」を選ぶと10枚すべて見られます。</p>
<p class="note">要確認：一番下の効果が、キャラクターと同じ部屋かどうかに関係なく全員に効くのかは、ルールブックに書かれていません。</p>`],
['よくある疑問','トレードは1回で何個でも渡せる？ 片方だけ渡すのは？',`<p><b>個数の制限はありません。片方だけ渡すこともできます。</b></p><ul><li>トレードのアクション（コスト1）を使うと、<b>同じ部屋にいるキャラクター全員</b>が、お互いの同意があればアイテムや戦術装備トークンを見せ合って交換できる。</li><li><b>1個もらって2個渡す、何ももらわずに1個渡す、1個渡して何ももらわない</b>、どれもOK（ルールブック：一方のキャラクターだけが見返りなしに与えることもできる）。</li><li>交換は基本的に<b>トレードをした本人と</b>。本人が許可すれば、他のキャラクター同士も直接交換できる。</li><li>同意が必要なので、無理やり奪うことはできない。</li><li>重量アイテムは空いているハンドスロットが必要（両手がふさがっていれば何かを捨てて持ち替える）。バックパックのアイテムは何個でも持てる。</li><li><b>戦術装備トークン（弾薬・グレネード・酸素・医療パック）も渡したりもらったりできる</b>。受け取る側に合う空きスロットが必要（戦術ベルトの灰色スロットは何でも可。武器の弾薬スロットには弾薬だけ）。</li><li>武器に<b>すでに装填されている弾薬</b>は別の武器へ移せない（装填のルール）。武器ごと渡せば、装填された弾薬も一緒に移る。</li></ul>`],
['ジリアン','ジリアンは毎ラウンド行動する？ ジリアントークンを引かないと行動しない？',`<p><b>マップにジリアンが1体でもいれば、毎ラウンド行動します。</b>ジリアントークンを引かなくても行動カードは引きます。</p>
<ul><li><b>毎ラウンド1回</b>：イベントフェイズの最初の<b>ジリアンフェイズ</b>で行動カードを1枚引き、マップ上の全ジリアンがそのカードに従う（キャラクターと同じ部屋なら上段、それ以外は下段）。</li><li><b>追加の行動</b>：マップにジリアンがいる状態でバッグから<b>ジリアントークン</b>が引かれると、その場で行動カードをもう1枚（そのあと痕跡トークンがジリアンに変わる）。</li><li>それ以外のとき（キャラクターの手番ごと・部屋に入られたとき・攻撃されたとき）は<b>行動しない</b>。</li><li>マップにジリアンがいないラウンドは、ジリアンフェイズごととばす。ジリアントークンは「痕跡トークン→ジリアン」に変えて出現させるためのもの。</li></ul>`],
['ジリアン','ジリアンを攻撃→騒音ロールで急襲されたら、誰が攻撃される？ その後ジリアンは？',`<h3>急襲で出てきたイントルーダーが攻撃するのは</h3><ul><li><b>キャラクター（攻撃した本人）</b>。イントルーダーはジリアンを<b>完全に無視</b>するので、ジリアンが狙われることはない。</li><li>急襲：バッグからトークンを1個引き、そのイントルーダーをキャラクターの部屋に置く→すぐにそのキャラクターを攻撃（標的の選び方どおり。原因を作ったキャラクターが優先）。</li><li>出目が数字なら通常の騒音ロールどおり（隣の通路に騒音マーカー、すでにあれば出現、通路にイントルーダーがいれば1体が部屋へ入って攻撃）。</li></ul>
<h3>ジリアンはどうする？</h3><ul><li><b>その場では何もしない</b>。ジリアンは行動カードでしか動かず、反撃もしない。</li><li>次に行動カードが引かれたとき（ジリアンフェイズ、またはバッグからジリアントークンが出たとき）、そのジリアンが<b>キャラクターと同じ部屋</b>にいれば上段（部屋への攻撃：キャラクターはステータスカードや重傷・HP減、<b>同じ部屋のイントルーダーにはクリティカル</b>）。</li><li>つまり急襲で出てきたイントルーダーは、次のジリアンの行動でまとめて倒されることもある（キャラクターも巻き込まれる）。</li><li>ジリアンを1回倒していれば負傷トークンがあり、次の行動は休む（トークンを捨てるだけ）。</li></ul>`],
['ネオフレッシュ','ネオフレッシュの「スキル」とは？',`<p>ネオフレッシュのイントルーダーが持つ<b>特殊能力</b>のカード6枚（1〜6番）。ゲーム開始時は<b>全部有効</b>で、色の付いた面を上にして番号の大きい順に並べておきます。</p>
<ol><li><b>スラッシャー</b>：攻撃で重傷かHP減を与えたら2回目の攻撃。</li><li><b>クロールマイン</b>：部屋で倒されると攻撃カード3枚を引き、Boom!があれば爆発（部屋の全員HP3減）。</li><li><b>アイアンクラッド</b>：いる場所では最初に狙わなければならない。通路では2ヒット必要。部屋で倒しても撃退になるだけ。</li><li><b>ファイアスピッター</b>：いる通路を掃射すると、先に体数分のHPを失う。</li><li><b>トゥイッチリング</b>：部屋ではアダルトと同じ判定（1ヒットで即死しない）。</li><li><b>狂信者</b>：狂信者にヒットを与えたら騒音ロール。</li></ol>
<h3>スキルを消す（無効化）</h3><ul><li><b>狂信者を倒すたびに、有効なスキルを1枚選んで裏返す</b>（以後そのスキルは効かない）。</li><li>キャラクター以外（ジリアンなど）が狂信者を倒した場合は、番号が一番大きい有効なスキルが自動で無効になる。</li><li>番号は、同じ通路に複数種類いるときにどれが先に部屋へ入るかの順番にも使う（小さい番号が先）。</li></ul><p>見分け方の画像は「図鑑」のネオフレッシュにあります。</p>`],
['サングレヴォア','サングレヴォアの「汚染カード」とは？',`<p>サングレヴォアで<b>感染カードの代わり</b>に使うカード。サングレヴォアの攻撃やイベントで受け取ります。</p>
<h3>受け取ったら</h3><ul><li><b>アクションデッキに入れてシャッフル</b>（捨て山には入れない）。いずれ手札に来る。</li><li>手札に来ても<b>コストの支払いに使えない</b>し、自由に捨てられない＝手札が1枚分ふさがる。</li></ul>
<h3>手放す方法</h3><ol><li>カードの<b>下半分の効果をアクションとして使う</b>→そのカードはデッキから取り除かれる（完全に消える）。</li><li><b>パスするときにHPを1失う</b>→手札の汚染カードを何枚でも全部捨て山へ（HPは1だけ）。</li><li><b>休憩</b>カードを使うと、追加コストなしで手札の汚染カードを捨て山へ。</li></ol><p class="note">2と3は捨て山に行くだけなので、デッキを作り直すとまた戻ってきます。完全に消せるのは1だけ。</p>
<h3>ゲーム終了時</h3><ul><li>汚染カードを（デッキ・手札・捨て山のどこかに）持っている人は、<b>汚染カードを感染カードとして</b>羽化の手順を行い、汚染カードを引いたら死亡。</li><li>カードを取り除く・捨てる効果は汚染カードにも使える。汚染カードはすべて「陽性（INFECTED）」扱い。</li></ul>`],
['ジリアン','ジリアンとは？ 何をしてくる？ 強み・弱み・どうなるといい？',`<p>人類ともイントルーダーとも敵対する、知能の高い<b>第三勢力</b>（拡張「ジリアン」）。最大3体。味方にもなり得るが、基本は予測不能な災害です。</p>
<h3>どう出てくる？</h3><ol><li>ジリアン探査カード（3枚）やジリアンイベントで、部屋に<b>痕跡トークン</b>が置かれ、バッグに<b>ジリアントークン</b>が入る。痕跡トークンには何もできない。</li><li>バッグの発展などでジリアントークンが引かれると：①マップにジリアンがいれば行動カード1枚 ②<b>痕跡トークンすべてがジリアンに変わる</b> ③トークンは捨てる。</li><li>マップにジリアンがいる間、毎ラウンドのイベントフェイズ最初に<b>ジリアンフェイズ</b>：行動カード1枚、ジリアントークンをバッグへ、同じ部屋に2体以上いたら一番元気な1体が痕跡トークンに戻る。</li></ol>
<h3>基本ルール</h3><ul><li><b>部屋にしかいない</b>。部屋から部屋へ移動し、<b>ドアもイントルーダーも無視して通り抜ける</b>。通過した通路の一番大きいイントルーダーにクリティカル。</li><li>行動カードでしか動かない・攻撃しない。部屋に入ってきても追撃・攻撃はしない。</li><li>キャラクターは同じ部屋にいても<b>戦闘中ではない</b>。ただしジリアンの部屋にはセキュアトークンを置けない。</li><li>イントルーダーはジリアンを無視。火災ダメージやイベントカードの移動も受けない。</li></ul>
<h3>何をされる？（行動カード）</h3><ul><li><b>キャラクターと同じ部屋のジリアン</b>：部屋を攻撃（ステータスカード：拘束／毒／標的。持っていたら重傷）、2HP減、キャラクターを連れて通路を移動（ドア破壊・騒音ロール）、騒音マーカーをばらまく など。同じ部屋のイントルーダーにもクリティカル。</li><li><b>それ以外のジリアン</b>：着陸地点へ向かい<b>着陸機を除去・遅らせる</b>、戦術装備を消す、冷却システムで<b>自爆起動</b>、生命維持を反転、<b>コールドスリープを停止</b>、故障マーカー・火災マーカー、巣の卵を壊す、クイーンを追いかけてクリティカル など。</li><li>負傷トークンがあるジリアンは、行動の代わりにトークンを捨てて休む。</li></ul>
<h3>強み（敵として怖いところ）</h3><ul><li>ドアもセキュアトークンも通じない。脱出手段（着陸機・コールドスリープ・自爆）を直接いじってくる。</li><li><b>2回倒さないと死なない</b>（1回目は負傷で生き残る）。</li><li>攻撃すると<b>毎回騒音ロール</b>（鬱陶しい戦闘）：ジリアンにヒット以上を与えたアクションの後、生死に関係なく騒音ロール。</li></ul>
<h3>弱み・役に立つところ</h3><ul><li>イントルーダーやクイーンにも容赦なくクリティカル。クイーンの追跡イベントでは自分からクイーンを狩りに行く。狂信者も殺す（騒音ロールなし）。</li><li>射撃はアダルトと同じ。クリティカルで1回分倒せる（掃射は通路にいないので不可）。</li><li>負傷中のジリアンは次の行動を休む。</li></ul>
<h3>倒すと？</h3><ul><li>2回目の死亡で除去され、負傷トークンを裏返すと<b>ジリアンアイテム</b>になる。戦闘中でなければ<b>アクションカード2枚（1アクション）</b>で拾える。</li><li>拾うと<b>重傷1枚を捨て、3HP回復</b>してから、ランダムにアーマーを1つ：<b>生命維持技術</b>（パスで酸素7、火災ダメージ無視）、<b>戦闘技術</b>（攻撃されたら相手にクリティカル）、<b>ステルス技術</b>（騒音ロールで急襲以外を無視）。どれも非常に強力。既存アーマーとはどちらか選ぶ。</li></ul>
<h3>忠誠（味方にする）</h3><ul><li>忠誠トークンのある部屋で<b>アクションカード1枚</b>を捨てると忠誠カードを獲得（1人だけ）。</li><li>効果：ジリアンに武器を使えなくなる。行動カードの「それ以外のジリアン」部分で無視される。同じ部屋にジリアンがいれば<b>アクションカード1枚＋アイテム1個</b>を捨てて、自分を無視させたまま行動を1回起こせる（他の人やイントルーダーにぶつける）。</li><li>注意：イベント「奴隷狩り」が出ると、全ジリアンが忠誠カードの持ち主へ2回ずつ寄ってくる。</li></ul>
<h3>どうなるといい？</h3><ul><li>理想：ジリアンが<b>イントルーダーやクイーンのそばで暴れて</b>数を減らし、自分たちには近寄らない。</li><li>近づいてきたら同じ部屋に長居しない（同じ部屋だと攻撃を受ける）。</li><li>着陸地点・冷却システム・コールドスリープルームへ向かい出したら、脱出計画を確認（着陸機の除去・自爆起動・コールドスリープ停止の危険）。</li><li>余裕があれば2回倒してジリアンアイテムを狙う（重傷が治り、強いアーマーが手に入る）。攻撃のたびに騒音ロールなので、火力をまとめて一気に。</li></ul>`],
];

function renderQA(){
  const q=($('#qaSearch').value||'').trim();
  const by={};QA.forEach(x=>by[x[1]]=x);const used=new Set();
  const chs=QCH.map(([en,ja,items])=>[en,ja,items.filter(([o])=>by[o]).map(([o,n])=>{used.add(o);return [n,o,by[o][2]]})]);
  const rest=QA.filter(x=>!used.has(x[1])).map(x=>[x[1],x[1],x[2]]);
  if(rest.length)chs.push(['MISC','その他',rest]);
  let h='';if(!q)h+=`<nav class="qidx">${chs.map(([en,ja,L],i)=>`<a href="#qch${i}"><small>${en}</small>${ja}<em>${L.length}</em></a>`).join('')}</nav>`;
  let first=true;
  chs.forEach(([en,ja,L],i)=>{const M=L.filter(([n,o,b])=>!q||(n+o+(b==='__ICONS__'?'アイコン':b)).includes(q));if(!M.length)return;
    h+=`<div class="qch" id="qch${i}"><span>${en}</span><h2>${ja}</h2></div>`;
    M.forEach(([n,o,b])=>{h+=`<details class="qa" ${q?'open':''}><summary>${n}</summary><div class="a">${b==='__ICONS__'?iconGlossary():b}</div></details>`});first=false});
  $('#qaList').innerHTML=h&&!first?h:'<p class="note">該当する項目がありません。</p>';
  $('#qaList').querySelectorAll('.qidx a').forEach(a=>a.onclick=e=>{e.preventDefault();const t=document.querySelector(a.getAttribute('href'));if(t)goTo(t,1)});
}

$('#qaSearch').oninput=renderQA;

  const hasOr=c.e.some(([k])=>k==='または');let opt=0;const AB='ABCDE';
  return c.e.map(([k,v],i)=>{
    let lab='',cls='';
    if(hasOr&&(k===''||k==='または')&&!(k===''&&i>0&&c.e[i-1][0]==='リアクション')){lab='選択肢'+AB[opt++]+(opt===1?'（どちらか1つを選ぶ）':'');cls=' opt'}
    else if(k==='リアクション'){lab=ELBL[k];cls=' re'}
    else if(k){lab=ELBL[k]||k}
    else if(c.c==='ジリアン'&&c.s==='行動'&&i>0){lab='カード最下段の効果'}
    return `<div class="er${cls}">${lab?`<span class="cond">${ic(lab)}</span>`:''}<div>${ic(v)}</div></div>`}).join('');
}

/td></tr><tr><th>ジャニター<small>Janitor</small></th><td>まだ動くはずだ・掃除・その場しのぎ・脅威に身を潜める・コンピュータースキル</td><td>高圧洗浄機・釘打ち機</td></tr><tr><th>サイエンティスト<small>Scientist</small></th><td>リスク評価・イントラネット・アクセスブロック・脅威に身を潜める・コンピュータースキル</td><td>科学者の拳銃・ホロコンピューター搭載車椅子</td></tr><tr><th>サバイバー<small>Survivor</small></th><td>やけくそな攻撃・通気口・屈強・目くらまし・常に準備万端</td><td>即席アーマー・サバイバーのお気に入り</td></tr><tr><th>ラボラット<small>Lab Rat</small></th><td>奇妙な代謝・鋭敏な聴覚・影に潜む・隠密移動・脅威に身を潜める</td><td>ラボラットの拳銃・血塗られた迷彩</td></tr><tr><th>ハッカー<small>Hacker</small></th><td>脳神経接続・上書き・隠密移動・常に準備万端・コンピュータースキル</td><td>チートコード・スマートガン</td></tr><tr><th>ゼノバイオロジスト<small>Xenobiologist</small></th><td>思考占拠・実地経験・生体解剖・脅威に身を潜める・コンピュータースキル</td><td>ゼノバイオロジストの拳銃・探査アーム</td></tr><tr><th>パイロット<small>Pilot</small></th><td>接続・操縦・弱点・常に準備万端・コンピュータースキル</td><td>パイロットのショットガン・軌道操縦システム</td></tr></tbody></table></div>\n<p class=\"note\">Contractors拡張の内容物：アクションカード60枚（1人5枚）、キャラクターアイテム24枚（1人2枚）、同行者選択カード12枚、両面キャラクタータイル6枚。他の拡張と組み合わせられます。</p>";

 weak:'固有カードの攻撃手段は限られる。',
 play:'着陸機の位置とタイミングを管理。',
 win:'着陸機で確実に脱出。',
 item:'パイロットのショットガン、軌道操縦システム'}
];

const ZK_NEO=[['スラッシャー','slasher','1','鎌のような「S字」','近接で2回殴ってくる殺し屋。部屋に入れると危険'],
['クロールマイン','crawlmine','2','トゲの付いた丸（歯車）','歩く地雷。部屋で倒すと爆発のおそれ'],
['アイアンクラッド','ironclad','3','盾（下向きの五角形）','装甲の盾役。最初に狙わされ、硬い'],
['ファイアスピッター','firespitter','4','照準マーク','通路を掃射すると反撃してくる射手'],
['トゥイッチリング','twitchling','5','脚の生えた小さなドーム','死体を運ぶ小型（ラーヴァ役）。感染をばらまく'],
['狂信者','cultist','6','両手を広げた人型','動かない電池役の人間。生き残りが多いとイベントが悪化'],
['マザーブレイン','','—','攻撃カードで「脳の形＋丸の数」（丸＝取り込まれた死体の数）','クイーン役。死体を取り込むほど強くなる']];
function neoGuide(){return `<div class="card neo"><div class="eyebrow">How to tell them apart</div><h3 style="margin:0 0 4px">ネオフレッシュカルトの見分け方</h3>
<p class="note">ネオフレッシュは「アダルト」が4種類に分かれ、イベントカードや攻撃カードはアイコンで種類を指定します。スキルカード（1〜6番）のミニチュア写真とアイコンで見分けてください。番号は、同じ通路に複数種類いるときに<b>どれが先に部屋へ入るか</b>（小さい番号が優先、マザーブレインが最優先）にも使います。</p>
<div class="neogrid">${ZK_NEO.map(([n,k,no,ic,r])=>`<div class="neoc">${k&&ZKIMG[k]?`<img src="${ZKIMG[k]}" alt="${n}のスキルカード">`:''}<div><b>${no!=='—'?no+'. ':''}${n}</b><small>アイコン：${ic}</small><span>${r}</span></div></div>`).join('')}</div>
<p class="note">アダルト相当：スラッシャー・クロールマイン・アイアンクラッド・ファイアスピッター（バッグのアダルトトークンにどれが出るか描かれている）。ラーヴァ相当：トゥイッチリング。ドローン相当は存在しない。クイーン相当：マザーブレイン。狂信者は独自の存在。</p></div>`}
const ZKMAP={"トゥイッチリング": "twitchling", "スラッシャー": "slasher", "クロールマイン": "crawlmine", "アイアンクラッド": "ironclad", "ファイアスピッター": "firespitter", "狂信者": "cultist"};
function renderZukan(){
  const q=norm(($('#zkQ')&&$('#zkQ').value)||'');const mode=S.zkMode||'enemy';
  const box=$('#p-zukan');
  const head=`<div class="card"><div class="eyebrow">Field guide</div><h2>敵とキャラクター図鑑</h2>${ZK_GEN}
  <div class="seg" style="margin-top:8px"><button data-zm="enemy" aria-pressed="${mode==='enemy'}">敵（イントルーダーなど）</button><button data-zm="char" aria-pressed="${mode==='char'}">キャラクター</button></div>
  <input class="search" id="zkQ" type="search" placeholder="名前で絞り込み（例：クイーン、スラッシャー、メディック）" value="${esc(($('#zkQ')&&$('#zkQ').value)||'')}" style="margin-top:8px"></div>`;
  let body='';
  if(mode==='enemy'){
    const L=ZK_ENEMY.filter(e=>!q||norm(e.n+e.en+e.g+e.who+e.act+e.harm).includes(q));
    let g='';
    L.forEach(e=>{if(e.g!==g){g=e.g;body+=`<h2 class="zkg">${esc(g)}</h2>`;if(g.startsWith('ネオフレッシュ'))body+=neoGuide()}
      body+=`<details class="zk"><summary><span class="zt">▸ 詳細</span><b>${esc(e.n)}</b> <span class="en">${esc(e.en)}</span><span class="zw"><b class="zq">概要</b>${e.who}</span></summary>
      ${ZKMAP[e.n]&&ZKIMG[ZKMAP[e.n]]?`<img class="zkimg" src="${ZKIMG[ZKMAP[e.n]]}" alt="${esc(e.n)}のスキルカード">`:''}<dl><dt>行動パターン</dt><dd>${e.act}</dd><dt>受ける被害</dt><dd>${e.harm}</dd><dt>強み</dt><dd>${e.str}</dd><dt>弱み</dt><dd>${e.weak}</dd><dt>倒し方</dt><dd>${e.kill}</dd><dt>対策・理想の展開</dt><dd>${e.tip}</dd></dl>${e.btn?`<button class="lnk" data-zc="${esc(e.btn)}">${esc(e.btn)}を見る</button>`:''}</details>`});
  }else{
    const L=ZK_CHAR.filter(e=>!q||norm(e.n+e.en+e.role+e.can+e.str).includes(q));
    body+='<p class="note">キャラクターの能力は各キャラクターのアクションカードと初期装備から整理しています。共通カード（修理・休憩・探索・安全確保・破壊工作・指揮系統など）はほぼ全員が持っています。</p>';
    let gx=-1;
    L.forEach(e=>{const x=e.x?1:0;if(x!==gx){gx=x;body+=x?`<h2 class="zkg">同行者（Contractors拡張）</h2><div class="card"><p>過去の Nemesis シリーズのキャラクターを「同行者」として使う拡張です。<b>1ゲームに1人だけ</b>。</p><details class="cond"><summary>選び方と使うカード（詳しく）</summary>${CONHTML}</details></div>`:`<h2 class="zkg">基本キャラクター</h2>`}
      body+=`<details class="zk chz" style="--chc:${chCol(e.en)}"><summary><span class="zt">▸ 詳細</span><b><i class="chdot"></i>${esc(e.n)}</b> <span class="en">${esc(e.en)}</span><span class="zw"><b class="zq">概要</b>${e.role}。${e.str.split('。')[0]}。</span></summary>
      <dl><dt>できること</dt><dd>${e.can}</dd><dt>強み</dt><dd>${e.str}</dd><dt>弱み</dt><dd>${e.weak}</dd><dt>使い方</dt><dd>${e.play}</dd><dt>勝つコツ</dt><dd>${e.win}</dd><dt>初期装備</dt><dd>${e.item}</dd></dl>
      <button class="lnk" data-zc="${esc(e.en)}">この人のカードを見る</button></details>`});
  }
  box.innerHTML=head+body;
  box.querySelectorAll('[data-zm]').forEach(b=>b.onclick=()=>{S.zkMode=b.dataset.zm;save();renderZukan()});
  const zq=$('#zkQ');zq.oninput=()=>{const p=zq.selectionStart;renderZukan();const n=$('#zkQ');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
  box.querySelectorAll('[data-zc]').forEach(b=>b.onclick=()=>{cat='すべて';renderChips();$('#cSearch').value=b.dataset.zc;renderCards();showTab('cards')});
}
