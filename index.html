<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nemesis: Retaliation 進行コンソール（共有版）</title>
<style>
/* Layout: 卓上でスマホ片手に使う一列レイアウト。上部に常時見えるラウンド計器、下にタブ。 */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#F4F6F7; --fg:#162027; --muted:#56646E; --line:#CBD4D9;
  --accent:#B9531A; --accent-ink:#FFFFFF; --teal:#126F74; --danger:#B3261E; --ok:#2C7A4B; --warn:#8F5C00;
  --chip:#E4EAEE; --chip-ink:#23313A; --hl:#FFF1E3;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-disp:"Orbitron","Zen Kaku Gothic New",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1317; --surface:#161F25; --sunk:#11191E; --fg:#E2E9ED; --muted:#93A2AC; --line:#2A3740;
  --accent:#EE8A4C; --accent-ink:#1A0E06; --teal:#53C1C3; --danger:#FF7469; --ok:#71C994; --warn:#E6B04D;
  --chip:#22303A; --chip-ink:#D5E0E6; --hl:#2A2018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1317; --surface:#161F25; --sunk:#11191E; --fg:#E2E9ED; --muted:#93A2AC; --line:#2A3740;
  --accent:#EE8A4C; --accent-ink:#1A0E06; --teal:#53C1C3; --danger:#FF7469; --ok:#71C994; --warn:#E6B04D;
  --chip:#22303A; --chip-ink:#D5E0E6; --hl:#2A2018; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── top gauge ── */
.gauge{position:sticky;top:0;z-index:10;background:var(--bg);padding-block:calc(10px + env(safe-area-inset-top,0px)) 8px;border-bottom:1px solid var(--line)}
.g-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.g-round{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 6px}
.g-round .lbl{font-size:11px;color:var(--muted);letter-spacing:.08em;writing-mode:horizontal-tb}
.g-round .val{font-family:var(--f-disp);font-weight:700;font-size:30px;line-height:1;min-width:2.1ch;text-align:center}
.g-round .of{font-size:12px;color:var(--muted)}
.ib{border:1px solid var(--line);background:var(--sunk);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:18px;line-height:1}
.g-tokens{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;align-items:center}
.tk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px}
.tk b{font-family:var(--f-disp);font-weight:600}
.tk .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--teal)}
.tk.auto .dot{background:var(--danger);color:#fff}
.tk.off{opacity:.55}
.g-alert{margin-top:8px;max-height:7.5em;overflow-y:auto;border-radius:8px;padding:6px 10px;font-size:13.5px;background:var(--hl);border:1px solid var(--accent)}
.g-alert strong{color:var(--accent)}

/* ── tabs ── */
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:700;font-size:14px}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}

section.panel{padding-top:18px;display:grid;gap:16px}
.lead{color:var(--muted);font-size:13.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15px;margin:12px 0 4px}
.eyebrow{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--teal);text-transform:uppercase;font-weight:600}
p{margin:.4em 0}
ul,ol{margin:.3em 0;padding-left:1.3em}
li{margin:.15em 0}
.note{font-size:13px;color:var(--muted)}
.warn{border-left:3px solid var(--warn);padding:4px 10px;background:var(--sunk);border-radius:0 6px 6px 0;font-size:13.5px;margin:8px 0}
.warn b{color:var(--warn)}
.danger{border-left-color:var(--danger)} .danger b{color:var(--danger)}
.ic{display:inline-block;background:var(--chip);color:var(--chip-ink);border-radius:5px;padding:0 5px;font-size:.88em;line-height:1.5;margin:0 1px;white-space:nowrap}

/* setup controls */
.ctrl{display:flex;flex-wrap:wrap;gap:14px 20px}
.ctrl label.t{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface)}
.tog input{accent-color:var(--accent);width:18px;height:18px}

/* bag */
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:6px}
.tok{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:var(--sunk)}
.tok .n{font-family:var(--f-disp);font-size:34px;font-weight:700;line-height:1}
.tok .k{font-size:13px;font-weight:700;margin-top:4px}
.tok .s{font-size:11.5px;color:var(--muted)}
.tok.total{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tok.total .s{color:var(--bg);opacity:.75}

/* checklist */
.cl{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:2px}
.cl li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:5px 4px;border-radius:6px}
.cl li:hover{background:var(--sunk)}
.cl input{width:18px;height:18px;margin-top:4px;accent-color:var(--ok)}
.cl li.done>span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.cl .tag{font-size:11px;font-weight:700;color:var(--teal);margin-right:4px}
.resetrow{display:flex;justify-content:flex-end}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* flow */
.phase{border-radius:var(--r);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.phase>header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.phase>header .pn{font-family:var(--f-disp);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--teal)}
.phase>header h2{font-size:16px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer}
.phase>header+.step{border-top:0}
.step .no{font-family:var(--f-disp);font-weight:700;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:14px;color:var(--muted)}
.step h3{font-size:15px;margin:3px 0 2px}
.step .body{font-size:14px;min-width:0}
.step .body ul{margin-top:2px}
.step.cur{background:var(--hl)}
.step.cur .no{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.step.past .no{border-color:var(--ok);color:var(--ok)}
.step.past h3{color:var(--muted)}
.step .xp{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--teal);color:var(--teal);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.flowbar{position:sticky;bottom:0;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;justify-content:center}
.flowbar .btn{padding:10px 18px;font-size:15px}

/* Q&A */
details.qa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.qa>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:baseline}
details.qa>summary::-webkit-details-marker{display:none}
details.qa>summary::before{content:"▸";font-family:var(--f-disp);color:var(--accent);font-weight:700}
details.qa[open]>summary{border-bottom:1px solid var(--line)}
details.qa .a{padding:10px 14px 14px;font-size:14.5px}
.qgrp{font-family:var(--f-disp);font-size:12px;letter-spacing:.12em;color:var(--muted);margin:10px 2px -6px;font-weight:600}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
.timeline{display:grid;gap:0;margin:6px 0}
.tl{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.tl:last-child{border-bottom:0}
.tl .w{font-size:12px;font-weight:700;color:var(--teal)}

/* cards */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cres{display:grid;gap:10px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.cc .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cc .ja{font-weight:700;font-size:16px}
.cc .en{font-family:var(--f-disp);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.cc .meta{margin-left:auto;font-size:11.5px;color:var(--teal);font-weight:700}
.cc .ef{margin-top:6px;display:grid;gap:5px;font-size:14px}
.cc .ef .cond{font-size:11.5px;font-weight:700;color:var(--accent);display:block}
.cc .ef div{white-space:pre-line}
.cc .nt{margin-top:8px;font-size:12.5px;color:var(--muted);white-space:pre-line;border-top:1px dashed var(--line);padding-top:6px}
.count{font-size:12.5px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
@media (prefers-reduced-motion:no-preference){.step,.tab{transition:background .15s}}

/* rulebook-texture header band (always dark, both themes) */
.gauge{--surface:rgba(8,12,14,.55);--sunk:rgba(255,255,255,.08);--line:rgba(255,255,255,.2);--fg:#E8EEF1;--muted:#AEBBC2;--bg:#0F161A;--hl:rgba(36,22,12,.88);--accent:#F09252;--accent-ink:#1A0E06;--teal:#62CBCC;--chip:rgba(255,255,255,.12);--chip-ink:#E8EEF1;
  color:var(--fg);background:linear-gradient(rgba(6,10,12,.25),rgba(6,10,12,.6)),var(--tex,#18222A) center top/cover no-repeat,#151D22;
  margin-inline:-16px;padding-inline:16px;border-bottom:1px solid rgba(0,0,0,.4);color-scheme:dark}
.gauge .btn{background:rgba(255,255,255,.08);color:var(--fg)}
.gauge .tab{color:#C4D0D6}
.gauge .tab[aria-selected="true"]{background:#E8EEF1;color:#0F161A}
.gauge .card{background:rgba(10,15,18,.82);backdrop-filter:blur(2px)}
.phase>header{background:linear-gradient(rgba(6,10,12,.35),rgba(6,10,12,.55)),var(--tex-round,#1C262D) center/cover;border-bottom:0}
.phase>header h2{color:#E8EEF1}.phase>header .pn{color:#7FD6D7}
.ico{height:1.25em;width:auto;vertical-align:-.28em;margin-right:3px;background:#24313A;border-radius:4px;padding:1px 2px}
.ico.big{height:24px;margin:0;padding:2px;border-radius:50%}
.ico.big.wide{border-radius:5px;height:20px}
.ic{padding-left:2px}
.icogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:4px 0 8px}
.icocell{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:center;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:6px}
.icocell img{width:44px;height:36px;object-fit:contain;background:#24313A;border-radius:6px;padding:3px}
.icocell span{font-size:13px;line-height:1.35;min-width:0}
.icocell small{display:block;color:var(--muted);font-size:11.5px}
.mv{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0;padding:10px;background:var(--sunk);border-radius:10px}
.mv-box{border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;font-size:14px;text-align:center;background:var(--surface)}
.mv-box small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.mv-box.cor{border-style:dashed;border-color:var(--teal)}
.mv-box.tgt{border-color:var(--accent)}
.mv-ar{color:var(--accent);font-weight:700}
.cc.story{border:2px solid var(--accent);scroll-margin-top:200px}
.cc.story .ef div{font-size:15px;line-height:1.9}

.resetrow{gap:8px;flex-wrap:wrap}
.tk.ng{padding:3px 10px;font-weight:700;color:var(--accent)}
.cc .meta{display:flex;gap:6px;align-items:center}
.cc .badge{background:var(--teal);color:var(--accent-ink);border-radius:999px;padding:1px 8px;font-size:11px}
.cc .sub{color:var(--muted);font-weight:600}
.cc .k{display:block;font-size:11px;font-weight:800;letter-spacing:.04em;margin-bottom:2px}
.cc .one{margin-top:8px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--accent) 12%,transparent);border-left:4px solid var(--accent);font-weight:700;font-size:15px;line-height:1.6}
.cc .one .k{color:var(--accent)}
.cc .ef{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;gap:8px}
.cc .efh{font-size:11px;font-weight:800;color:var(--muted)}
.cc .er{white-space:pre-line}
.cc .er.opt{border-left:3px solid var(--teal);padding-left:8px}
.cc .er.re{border-left:3px dashed var(--accent);padding-left:8px}
.cc .er .cond{margin-bottom:2px}
.cc .tip{margin-top:8px;font-size:13.5px;line-height:1.65;padding:6px 10px;border-radius:8px}
.cc .tip.str{background:color-mix(in srgb,var(--teal) 12%,transparent)}
.cc .tip.str .k{color:var(--teal)}
.cc .tip.warn{background:color-mix(in srgb,#d9822b 14%,transparent)}
.cc .tip.warn .k{color:#c26a12}
.cc details.nt summary{cursor:pointer;font-weight:700}
.cc details.nt div{margin-top:4px}
.primer{background:var(--surface);border:2px solid var(--teal);border-radius:var(--r);padding:10px 14px;font-size:14px;line-height:1.7}
.primer .k{display:block;font-weight:800;color:var(--teal);font-size:12px}
dl.guide{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:8px 0}
dl.guide dt{margin:0}dl.guide dd{margin:0;font-size:13.5px;line-height:1.6}
.lnk{background:none;border:1px solid var(--teal);color:var(--teal);border-radius:999px;padding:2px 10px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
@media (max-width:480px){dl.guide{grid-template-columns:1fr}dl.guide dd{margin-bottom:6px}}
.gearbox{margin-top:10px;border:2px solid var(--accent);border-radius:10px;padding:8px 10px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.gearbox .gh{font-weight:800;color:var(--accent);font-size:13px;margin-bottom:4px}
.gearbox .gg{margin-top:6px}
.gearbox .gt{display:block;font-size:11.5px;font-weight:800;color:var(--teal)}
.gearbox .gi{font-size:13.5px;line-height:1.55;padding:2px 0}
.gearbox.gcc{border:2px solid var(--cc);background:color-mix(in srgb,var(--cc) 9%,var(--surface));padding:0 0 8px;overflow:hidden}
.gearbox.gcc .gh{background:var(--cc);color:var(--ccfg);margin:0 0 2px;padding:7px 12px;font-size:13.5px;letter-spacing:.02em}
.gearbox.gcc .gg{margin:8px 10px 0;padding-left:9px;border-left:4px solid var(--cc)}
.gearbox.gcc .gt{color:var(--fg);opacity:.78;font-size:12px}
.gearbox.gcc .gi{color:var(--fg)}
.gearbox.gcc .gi b{color:var(--fg);background:color-mix(in srgb,var(--cc) 22%,transparent);padding:0 4px;border-radius:4px}
.glist{display:grid;gap:6px;margin-top:6px}
.grow{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.grow small{color:var(--muted)}
.grow .gone{font-size:12.5px;color:var(--muted);margin-top:2px}
.gtg{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.gtg span{font-size:11px;border:1px solid var(--teal);color:var(--teal);border-radius:999px;padding:0 6px}
.zkg{font-size:15px;margin:14px 0 6px;color:var(--teal)}
details.zk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
details.zk summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
details.zk summary b{font-size:16px}
details.zk .en{font-size:12px;color:var(--muted);font-family:var(--f-disp)}
details.zk .zw{width:100%;font-size:13.5px;line-height:1.6}
details.zk .zq{display:block;font-size:11.5px;color:var(--accent)}
details.zk .zt{order:9;width:100%;font-size:11px;color:var(--teal)}
details.zk[open] .zt{display:none}
details.zk dl{margin:8px 0 6px;display:grid;gap:4px}
details.zk dt{font-size:12px;font-weight:800;color:var(--accent);margin-top:6px}
details.zk dd{margin:0;font-size:14px;line-height:1.7}
.neo{margin-bottom:10px}
.neogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:8px}
.neoc{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--surface)}
.neoc img{width:100%;border-radius:6px;display:block}
.neoc b{font-size:15px;display:block}.neoc small{display:block;color:var(--teal);font-weight:700;font-size:12px}.neoc span{font-size:13px;line-height:1.55}
.zkimg{width:100%;max-width:420px;border-radius:8px;margin-top:8px;display:block}
.qidx{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:6px}
.qidx a{display:flex;flex-direction:column;text-decoration:none;color:var(--ink,inherit);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13.5px;position:relative}
.qidx a small{font-family:var(--f-disp);font-size:10px;letter-spacing:.14em;color:var(--teal);font-weight:600}
.qidx a em{position:absolute;right:8px;top:7px;font-style:normal;font-size:11px;color:var(--muted)}
.qch{margin:18px 2px 2px;scroll-margin-top:250px;border-left:4px solid var(--accent);padding-left:10px}
.qch span{font-family:var(--f-disp);font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:700}
.qch h2{margin:0;font-size:19px;letter-spacing:.04em}
details.qa[open]>summary::before{content:"▾"}
.cc details.cinfo{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cc details.cinfo summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--teal)}
.cc details.cinfo dl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin:8px 0 2px;font-size:13px;line-height:1.6}
.cc details.cinfo dt{font-weight:800;color:var(--muted);white-space:nowrap}

:"Private","en":"CORPORATE CONTRACT","ja":"企業契約","e":[["","プレイヤー5の⟦キャラクター⟧を生還させるな。\n（あなた自身がプレイヤー5だった場合には、この目的を選択することはできない ）"],["または","唯一の生還者になれ。"]],"n":"生還者とは、ゲームの最後に行われる羽化の手順の後でまだ生きているキャラクターの事を指す。"},{"c":"目的","s":"Private","en":"EXPERIMENTAL SUBJECTS","ja":"実験対象","e":[["","施設から脱出したすべての⟦キャラクター⟧が持っている感染カードの合計が、3枚以上であること。\n（そのキャラクター達が、脱出後に最後まで生存しているかどうかは問わない）"]],"n":"あなた自身も含めて、脱出したキャラクター全員が持っている感染カードをカウントする。ゲームの最後に行われる羽化の手順で死亡したキャラクターがいても、脱出していればそのキャラクターの持つ感染カードはカウントに含める。\n脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。"},{"c":"目的","s":"Private","en":"LUXURIOUS OFFER","ja":"魅力的なオファー","e":[["","巣（セクションCの部屋）にあるイントルーダーの卵を持って生還しろ。"]],"n":"生還者とは、ゲームの最後に行われる羽化の手順の後でまだ生きているキャラクターの事を指す。"},{"c":"目的","s":"Private","en":"QUARANTINE","ja":"検疫","e":[["","誰一人として、着陸機（セクションA）を使って施設から脱出させるな。"]],"n":"あなた自身も着陸機を使ってはならない。コールドスリープルームと脱出シャトルは使用してよい。"},{"c":"目的","s":"Private","en":"THE GREAT HUNT","ja":"大物狩り","e":[["","クイーンを殺せ"]],"n":"クイーンヘルスカードのデッキが尽きると、クイーンは死亡する。また、施設が破壊された場合にもクイーンは死亡する。\n施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Private","en":"VENI. VIDI. VICI","ja":"来た、見た、勝った","e":[["","巣（セクションCの部屋）を破壊しろ。"]],"n":"巣を破壊するには、施設全体を破壊するか、セクション境界ピースCに置かれている卵をすべて取り除く。卵を取り除くには、巣で卵を破壊するか、卵を持ち出す。\n施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Private","en":"SHUTDOWN","ja":"シャットダウン","e":[["","すべての生命維持システムトークンを⟦生命維持：停止⟧にせよ。または、ゲームから取り除け。"],["さらに","（セクションBのサーバールームから取得できる）データトークンを手に入れろ。"]],"n":"生命維持システムは、『A』『B』『C』の生命維持システム制御室で停止させることができる。\nまた、セクションＣにある反応炉をシャットダウンすることでも停止させることができる。シャットダウンを行うには、反応炉のルームアクションを使用する。"},{"c":"目的","s":"Mission Task","en":"PRIMARY SAMPLES","ja":"第一のサンプル","e":[["","施設から脱出した⟦キャラクター⟧達が持っているイントルーダーの卵の合計が、2個以上あること。\n（そのキャラクター達が、脱出後に最後まで生存しているかどうかは問わない）"]],"n":"脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。脱出した後、ゲームの最後に行われる羽化の手順で死亡しても、脱出は達成される。"},{"c":"目的","s":"Mission Task","en":"PERIMETER CLEARING","ja":"周辺警戒掃討","e":[["","反応炉（セクションCの部屋）を（その部屋のルームアクションを使って）シャットダウンせよ。"],["さらに","3つの『A』のルームタイルすべてを発見済みにせよ。"]],"n":""},{"c":"目的","s":"Mission Task","en":"THE SUPPLY ROUTE","ja":"補給路の確保","e":[["","着陸地点（セクションAの部屋）から生命維持システム制御室Cまで、補強された通路が連続したルートを確保すること。"],["さらに","施設を破壊させるな。"]],"n":"施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Mission Task","en":"ESSENTIAL DATA","ja":"重要データの回収","e":[["","データトークンを持った⟦キャラクター⟧が1人以上、着陸機（セクションA）を使って施設から脱出せよ。\n（データトークンはセクションBのサーバールームから取得できる）"],["さらに","セクションAに未探査の通路が存在しないこと。"]],"n":"データトークンは、セクションBにあるサーバールームを使用することで取得できる。1度手に入れたトークンは、失われたり交換されたりすることはない。"},{"c":"目的","s":"Mission Task","en":"ERADICATION","ja":"駆逐作戦","e":[["","クイーンを殺せ"],["さらに","施設を破壊させるな。"]],"n":"クイーンヘルスカードのデッキが尽きると、クイーンは死亡する。また、施設が破壊された場合にもクイーンは死亡する。\n施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Mission Task","en":"ESCORT MISSION","ja":"護衛任務","e":[["","⟦ロボット⟧を反応炉（セクションCの部屋）に到達させろ。到達したらこのカードのボックスをマークする。その後、⟦ロボット⟧は反応炉から移動しても構わない。"],["さらに","データトークンを持った⟦キャラクター⟧が1人以上、施設から脱出せよ。\n（データトークンはセクションBのサーバールームから取得できる）"]],"n":"データトークンは、セクションBにあるサーバールームを使用することで取得できる。1度手に入れたトークンは、失われたり交換されたりすることはない。\n脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。脱出した後、ゲームの最後に行われる羽化の手順で死亡しても、脱出は達成される。"},{"c":"目的","s":"Mission Task","en":"FACILITY RESTART","ja":"施設の再起動","e":[["","コールドスリープルームを（生命維持システム制御室Cのルームアクションを使って）⟦コールドスリープ稼働⟧にせよ。"],["さらに","反応炉（セクションCの部屋）を（その部屋のルームアクションを使って）シャットダウンせよ。"]],"n":""},{"c":"目的","s":"Mission Task","en":"RECONNAISSANCE","ja":"偵察任務","e":[["","『A』『B』『C』のルームタイルすべてを発見済みにせよ。"]],"n":""},{"c":"目的","s":"Mission","en":"OFFICIAL ORDER","ja":"公式命令","e":[["","作戦任務を達成せよ。"]],"n":""},{"c":"目的","s":"Mission","en":"ULTERIOR MOTIVE","ja":"裏の動機","e":[["","作戦任務の達成を阻止せよ。"]],"n":""},{"c":"目的","s":"Mission","en":"SELF-SERVING","ja":"自己保身","e":[["","唯一の生還者になれ。"]],"n":"生還者とは、ゲームの最後に行われる羽化の手順の後でまだ生きているキャラクターの事を指す。"},{"c":"目的","s":"Solo/Coop","en":"CLEAN-UP","ja":"掃討","e":[["","巣（セクションCの部屋）を破壊しろ。"]],"n":"巣を破壊するには、施設全体を破壊するか、セクション境界ピースCに置かれている卵をすべて取り除く。卵を取り除くには、巣で卵を破壊するか、卵を持ち出す。\n施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Solo/Coop","en":"FACEOFF","ja":"対決","e":[["","クイーンを殺せ"]],"n":"クイーンヘルスカードのデッキが尽きると、クイーンは死亡する。また、施設が破壊された場合にもクイーンは死亡する。\n施設の破壊：火災マーカーを置こうとした時にサプライにもうマーカーが無かった場合、施設は破壊される。また、起動された自爆プロシージャーが制限時間内に停止されなかった場合にも、施設は破壊される。"},{"c":"目的","s":"Solo/Coop","en":"CLOSEDOWN","ja":"閉鎖された施設","e":[["","すべての生命維持システムトークンを⟦生命維持：稼働⟧にせよ。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"CRUCIAL INTELLIGENCE","ja":"重要な情報","e":[["","データトークンを持った⟦キャラクター⟧が1人以上、着陸機を使って施設から脱出せよ。"]],"n":"データトークンは、セクションBにあるサーバールームを使用することで取得できる。1度手に入れたトークンは、失われたり交換されたりすることはない。\n脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。脱出した後、ゲームの最後に行われる羽化の手順で死亡しても、脱出は達成される。"},{"c":"目的","s":"Solo/Coop","en":"SCIENTIFIC SAMPLE","ja":"科学的サンプル","e":[["","1人の⟦キャラクター⟧が巣（セクションCの部屋）にあるイントルーダーの卵を持って脱出しろ。"]],"n":"脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。脱出した後、ゲームの最後に行われる羽化の手順で死亡しても、脱出は達成される。"},{"c":"目的","s":"Solo/Coop","en":"NO CORNER UNCOVERED","ja":"死角は残さず","e":[["","『B』のルームタイルすべてを発見済みにせよ。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"ENTRANCE INSPECTION","ja":"入場口の検査","e":[["","セクションAに未探査の通路が存在しないこと。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"CULINARY SAMPLE","ja":"調理サンプル","e":[["","1人の⟦キャラクター⟧が巣（セクションCの部屋）にあるイントルーダーの卵を持って脱出しろ。"]],"n":"脱出とは、着陸機または脱出シャトルを使って施設から逃れることを指す。コールドスリープをして生き延びても脱出したことにはならない。脱出した後、ゲームの最後に行われる羽化の手順で死亡しても、脱出は達成される。"},{"c":"目的","s":"Solo/Coop","en":"DEEP SEARCH","ja":"深層の探索","e":[["","『C』のルームタイルすべてを発見済みにせよ。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"SAFETY PROCEDURE","ja":"安全処置","e":[["","コールドスリープルームを（生命維持システム制御室Cのルームアクションを使って）⟦コールドスリープ稼働⟧にせよ。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"SHUTDOWN","ja":"シャットダウン","e":[["","反応炉（セクションCの部屋）を（その部屋のルームアクションを使って）シャットダウンせよ。"]],"n":""},{"c":"目的","s":"Solo/Coop","en":"SYSTEMS BACKUP","ja":"システムのバックアップ","e":[["","⟦ロボット⟧を反応炉（セクションCの部屋）に配置せよ。"]],"n":""},{"c":"部屋","s":"","en":"DRILLING STATION","ja":"掘削基地","e":[["","⟦ロボット⟧のいる部屋から、新しい通路を1つ設置する 。"]],"n":"この新しい通路は、発見済みの部屋または未発見の部屋につながるようにして設置できる。"},{"c":"部屋","s":"","en":"LANDING ZONE","ja":"着陸地点","e":[["","着陸地点のスロットに置かれた戦術装備トークンを任意の数だけ取得する。"],["または","⟦着陸機⟧に乗り込むために、騒音ロールを1回行う。"]],"n":"取得したすべての戦術装備トークンは、空の戦術装備スロットに置く必要がある。このアクションを実施する前かアクションの最中に、任意の数のあなたの戦術装備トークンを1回だけ破棄することができる。\n着陸機が着陸地点にすでにある場合にのみ、着陸機に乗り込むことができる。\n騒音ロールの結果を解決した時点でイントルーダーがあなたの部屋にいた場合には、このアクションは失敗となる。\n詳細については、「Lander（着陸機）」（ルールブックの37ページ）および「Escaping（脱出）」（38ページ）を参照。"},{"c":"部屋","s":"","en":"LIFE SUPPORT CONTROL A","ja":"生命維持システム制御室A","e":[["","セクションAの、⟦生命維持：稼働⟧/⟦生命維持：停止⟧の生命維持システムトークンを、反対側に裏返す。"],["または","施設内の部屋を1つ選んで⟦火災マーカー⟧を取り除く。"]],"n":"この部屋の1つ目の効果により、セクションAの生命維持システムを稼働中または停止中にすることができる。"},{"c":"部屋","s":"","en":"SURGERY ROOM","ja":"手術室","e":[["","手札の⟦アクションカード⟧をすべて捨てて、キャラクターボードからラーヴァを取り除き、デッキと捨て山にあるすべての感染カードをスキャンする。\nスキャンの結果が「陽性（Infected）」だったカードを、ゲームから取り除く。"],["または","重傷を1つ取り除く。"]],"n":"キャラクターボードにラーヴァがない場合には、この部屋の1つ目効果は使用できない。ただし、感染カードは1枚も持っていなくても1つ目の効果を使用できる。\nこのルームアクションを実行した後、取り除かれずに残ったスキャン済みの感染カードをすべてデッキに戻し、デッキ全体をシャッフルする。"},{"c":"部屋","s":"","en":"HIBERNATORIUM","ja":"コールドスリープルーム","e":[["","コールドスリープするために、騒音ロールを1回行う。"]],"n":"コールドスリープルームが稼働中の場合にのみ、この部屋の効果を使用できる。コールドスリープルームは生命維持システム制御室Cで稼働させることができる。\n騒音ロールの結果を解決した時点でイントルーダーがあなたの部屋にいた場合には、このアクションは失敗となる。\nコールドスリープの詳細については、ルールブックの38ページを参照してください。"},{"c":"部屋","s":"","en":"LIFE SUPPORT CONTROL B","ja":"生命維持システム制御室B","e":[["","セクションBの、⟦生命維持：稼働⟧/⟦生命維持：停止⟧の生命維持システムトークンを、反対側に裏返す。"],["または","両方の対空防御トークンを秘密裏に確認して、任意の順番で再配置する。"]],"n":"この部屋の1つ目の効果により、セクションBの生命維持システムを稼働中または停止中にすることができる。\n2枚重ねにされた対空防御トークンのうちの、上側にあるトークンが対空防御システムの状態を示している事に注意すること。\nトークンがどのような順番で配置されていたか、あなたがトークンの上下を入れ替えたかどうかについては、他のプレイヤーに情報を共有する必要はない。"},{"c":"部屋","s":"","en":"SERVER ROOM","ja":"サーバールーム","e":[["","施設内の⟦コンピューター⟧がある発見済みの部屋を1つ選んで、その部屋を使用する。"],["または","（もしまだ持っていなければ）データトークンを1つ取得する。"]],"n":"この効果によって故障マーカーがある部屋を使用することはできない事に注意すること。"},{"c":"部屋","s":"","en":"COOLING SYSTEM","ja":"冷却システム","e":[["","自爆プロシージャーを起動する。"]],"n":"自爆プロシージャーの詳細については、ルールブックの38ページを参照。"},{"c":"部屋","s":"","en":"LIFE SUPPORT CONTROL C","ja":"生命維持システム制御室C","e":[["","セクションCの、⟦生命維持：稼働⟧/⟦生命維持：停止⟧の生命維持システムトークンを、反対側に裏返す。"],["または","コールドスリープルームを⟦コールドスリープ停止⟧から⟦コールドスリープ稼働⟧へと裏返す。"]],"n":"この部屋の1つ目の効果により、セクションCの生命維持システムを稼働中または停止中にすることができる。\nこの部屋の2つ目の効果により、コールドスリープルームを稼働させることだけができる（停止させることはできない）。"},{"c":"部屋","s":"","en":"REACTOR","ja":"反応炉","e":[["","すべての⟦生命維持：稼働⟧/⟦生命維持：停止⟧の生命維持システムトークン 、⟦自爆トークン⟧と、2つの対空防御トークンの両方を、ゲームから取り除く。"]],"n":"これらのトークンを取り除いた後は、すべてのセクションは生命維持システムが停止しているものとして扱う。対空防御システムは停止しているものとして扱う。\n自爆トークンは既にラウンドトラックに配置されている場合（自爆プロシージャーが開始されている場合）でも、取り除く。\n停止された生命維持システム、対空防御システムと自爆プロシージャーは、再度オンにすることはできない。"},{"c":"部屋","s":"","en":"ESCAPE SHUTTLE","ja":"脱出シャトル","e":[["","脱出シャトルに乗り込むために、騒音ロールを1回行う。"]],"n":"騒音ロールの結果を解決した時点でイントルーダーがあなたの部屋にいた場合には、このアクションは失敗となる。\nキャラクターの1人が脱出シャトルを使用して脱出した場合、そのゲーム中には脱出シャトルを再度使用することはできない。使用可能なシャトルは1つだけしかない。\n『脱出シャトルへの乗り込み』の詳細については、ルールブックの38ページを参照。"},{"c":"部屋","s":"","en":"NEST","ja":"イントルーダーの巣","e":[["","イントルーダー卵を1つ取得するか、または破壊する。\n騒音ロールを1回行う。"]],"n":"『C』のセクション境界ピースにある巣スペースにあるイントルーダーの卵を1つ、取得するか破壊する。\n卵は重量アイテムであることに注意すること！\n巣の詳細については、ルールブックの20ページを参照。"},{"c":"部屋","s":"","en":"SPRINKLERS CONTROL","ja":"スプリンクラー制御室","e":[["","セクションを1つ選んで、そのセクションから⟦火災マーカー⟧をすべて取り除く。"]],"n":""},{"c":"部屋","s":"","en":"SHELTER","ja":"シェルタールーム","e":[["","キャラクターボード上にラーヴァがない場合に限り：\n手札にあるすべての感染カードを、スキャンをせずにゲームから取り除く。"]],"n":""},{"c":"部屋","s":"","en":"EMERGENCY ROOM","ja":"救急処置室","e":[["","2⟦HP⟧を回復する。"],["または","重傷を1つ取り除く。"]],"n":""},{"c":"部屋","s":"","en":"SUPPLY ROOM","ja":"備品室","e":[["","緑、赤、黄色のアイテムを1つずつ引く。その中から2つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"部屋","s":"","en":"ARMORY","ja":"武器庫","e":[["","任意の数の⟦弾薬トークン⟧と⟦グレネードトークン⟧を取得する。"]],"n":"取得したすべての戦術装備トークンは、空の戦術装備スロットに置く必要がある。このアクションを実施する前かアクションの最中に、任意の数のあなたの戦術装備トークンを1回だけ破棄することができる。"},{"c":"部屋","s":"","en":"DOOR CONTROL ROOM","ja":"ドアコントロール室","e":[["","セクションを1つ選んで、任意の数のドアを開く、および/または、閉じる。"]],"n":"ドアを閉じることができるのは、ドアスロットがある場所のみ。"},{"c":"部屋","s":"","en":"SECURITY ROBOT ROOM","ja":"セキュリティロボット室","e":[["","⟦ロボット⟧がいる部屋に⟦セキュアトークン⟧を1つ置く。"],["または","⟦ロボット⟧がいる部屋に隣接する空の通路を1つ選んで、補強する。"]],"n":"未探査の通路は空の通路とはみなされないので、補強できない。"},{"c":"部屋","s":"","en":"GUNNERY ROOM","ja":"砲術室","e":[["","⟦赤アイテム⟧があり、かつ⟦故障マーカー⟧がない部屋に隣接する通路を1つ選択する。掃射ダイスを1回ロールして、ロールの結果に等しいヒットをその通路に与える。"]],"n":"この掃射ダイスのロールは掃射アクションではないため、弾薬トークンを消費する必要はない。"},{"c":"部屋","s":"","en":"PRESSURE CONTROL","ja":"気圧制御室","e":[["","施設内にいる⟦イントルーダー⟧1体を移動させる。"]],"n":"このイントルーダーは任意の方向へ移動させることができる（部屋から通路へ、または通路から部屋へ移動させる）。"},{"c":"部屋","s":"","en":"ALARM ROOM","ja":"警報室","e":[["","施設内の通路を1つ選んで、その通路にある⟦騒音マーカー⟧を解決するか、取り除く。"]],"n":"※騒音マーカーを解決するを実行する場合は、騒音マーカーが存在する通路を選択する必要がある（という理解であっている？）⇒あっている。"},{"c":"部屋","s":"","en":"EXPERIMENTAL MILITARY LAB","ja":"軍事実験研究室","e":[["","任意の数の⟦弾薬トークン⟧を取得する。"],["または","支援装備をランダムに2枚引く。その中から1枚を選んで取得し、もう1枚は捨てる。"]],"n":"取得したすべての戦術装備トークンは、空の戦術装備スロットに置く必要がある。このアクションを実施する前かアクションの最中に、任意の数のあなたの戦術装備トークンを1回だけ破棄することができる。\n戦術装備のデッキには、ゲームのセットアップ時の戦術装備の選択に使用されたカードは含まれていないことを確認すること。"},{"c":"部屋","s":"","en":"TECHNICAL CORRIDOR ENTRANCE","ja":"作業用通路の入口","e":[["","施設内の任意の部屋へ移動する。イントルーダーの攻撃を1回解決する（アダルトによる攻撃として処理する）。"]],"n":"イントルーダーの攻撃カードを1枚引いて、アダルトによる攻撃として解決する。ただし、マップにイントルーダーは配置しない。\nこの攻撃に対してセキュアトークンは機能しない（この攻撃によってイントルーダーが部屋に進入していないため）。\n移動した後に、通常と同様に騒音ロールを行う。"},{"c":"部屋","s":"","en":"DECONTAMINATION ROOM","ja":"除染室","e":[["","2⟦酸素⟧を消費し、手札の⟦アクションカード⟧をすべて捨てる。デッキと捨て山にあるすべての感染カードをスキャンせずに取り除く。"]],"n":"酸素の残量が1以下の場合（2酸素を失うと窒息トークンを受け取る場合）には、このルームアクションを行うことはできない。"},{"c":"部屋","s":"","en":"UNDISCOVERED HIBERNATORIUM","ja":"未発見のコールドスリープルーム","e":[["","この部屋にある⟦ロボット⟧は、起動する事が出来ない。\nこの部屋に隣接する通路には⟦騒音マーカー⟧が置かれることは無い。\n\nいずれかの部屋とコールドスリープルームが接続された際に：\nロボットカードを公開する。（この時点で、ロボットは起動することが可能になる）\nこのトークンをゲームから取り除く。"]],"n":""},{"c":"アクション","s":"COMMON","en":"CHAIN OF COMMAND","ja":"指揮系統","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋にいる、あなたよりランクが低い⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"],["リアクション","⟦指令⟧カードがあなたに対してプレイされた場合：\nその効果を無視する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"DEMOLITION","ja":"破壊工作","e":[["","アクセス可能なドアを1つ破壊する。"],["または","あなたの部屋に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"アクション","s":"COMMON","en":"REPAIRS","ja":"修理","e":[["","⟦アクションカード⟧を1枚捨てて、⟦故障マーカー⟧を1つ取り除く。"],["または","アクセス可能なドアを1つ開く、または閉じる。"]],"n":""},{"c":"アクション","s":"COMMON","en":"FAST REPAIRS","ja":"迅速な修理","e":[["","⟦故障マーカー⟧を1つ取り除く。"],["または","アクセス可能なドアを1つ開く、または閉じる。"]],"n":""},{"c":"アクション","s":"COMMON","en":"REST","ja":"休憩","e":[["","感染チェック手順を解決する。スキャンの結果が陰性だったカードをすべて、捨て山へ移動せずにゲームから取り除く。\n\n感染チェック手順：\n手札にあるすべての感染カードをスキャンする。結果が陽性のカードが1枚以上あれば、あなたのキャラクターボードにラーヴァを1体配置する。その後、手札にある感染カードをすべて捨て山に移動する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"SEARCH","ja":"探索","e":[["","あなたの部屋のアイテムアイコンごとに、対応する種類のアイテムを1つずつ引く。その中から1つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"COMMON","en":"SECURE","ja":"安全確保","e":[["","⟦セキュアトークン⟧を2つ置く。"],["または","⟦アクションカード⟧を1枚捨てる。⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"FAST SECURE","ja":"迅速な安全確保","e":[["","⟦セキュアトークン⟧を2つ置く。"],["または","⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"TAKING AIM","ja":"狙いを定める","e":[["","射撃攻撃か掃射攻撃を行う。\nこの攻撃での1回目のロール結果を振り直ししてもよい。2回目の結果を必ず適用する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"COMPUTER SKILLS","ja":"コンピュータースキル","e":[["","⟦コンピューター⟧がある部屋にいる場合、その部屋を使用する。"],["または","⟦コンピューター⟧がある部屋にいる場合、施設内のドアを1つ選んで開く、または閉じる。"]],"n":""},{"c":"アクション","s":"COMMON","en":"ALWAYS PREPARED","ja":"常に準備万端","e":[["","部屋を使用する。\nその後、あなたの部屋にいるすべての⟦イントルーダー⟧があなたを攻撃する。"],["または","⟦アクションカード⟧を1枚捨てる。アイテムデッキを1つ選んで、そこからアイテムを2つ引く。その中から1つを選んで取得し、残りを捨てる。"]],"n":"戦闘中でなくても（イントルーダーの攻撃が発生しない状況であっても）1つ目の効果で部屋を使用することができる。\n※Awaken Realms社に確認済み"},{"c":"アクション","s":"COMMON","en":"DUCK AND COVER","ja":"脅威に身を潜める","e":[["","⟦アクションカード⟧を1枚捨てて、移動する。この移動中には、イントルーダーからの攻撃を1回阻止できる。"],["リアクション","あなたが部屋にいる⟦イントルーダー⟧の1体から攻撃を受ける際に、その部屋に別の⟦キャラクター⟧がいる場合：\nその⟦イントルーダー⟧はあなたではなく、その⟦キャラクター⟧を攻撃する。"]],"n":"複数のイントルーダーからの攻撃に対してもリアクションを使用することができるが、そのうちの1回分の攻撃のみに対して使用できる。\n移動中の攻撃を阻止した場合、探査カードの進入時効果や騒音ロールの結果発生した攻撃は、阻止できない。"},{"c":"アクション","s":"COMMON","en":"WEAK SPOT","ja":"弱点","e":[["","⟦イントルーダー⟧1体に1ヒットを与える。その後、そのイントルーダーに射撃攻撃か近接攻撃を行う。"]],"n":""},{"c":"アクション","s":"COMMON","en":"FORCING FIRE","ja":"強襲射撃","e":[["","遠距離武器の⟦弾薬⟧を消費して、あなたの部屋にいるすべての⟦イントルーダー⟧を撃退する。"]],"n":""},{"c":"アクション","s":"COMMON","en":"MOVE QUIETLY","ja":"隠密移動","e":[["","騒音ロールをせずに、発見済みの部屋へ移動する。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"FIRE AT WILL","ja":"自由射撃","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋を選択する。その部屋に隣接する通路を1つ選択する。あなたが選択した部屋にいるすべての⟦キャラクター⟧は、あなたが選択した通路に対して掃射攻撃を行う。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"FIRST IN COMMAND","ja":"部隊指揮官","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋にいる、あなたよりランクが低い⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"LET'S GO!","ja":"行くぞ！","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","移動する。あなた以外の⟦キャラクター⟧1人を伴って移動してもよい。一緒に移動するキャラクターは騒音ロールを行わない。"]],"n":"一緒に移動するキャラクターの同意を得る必要はありません。\n（コンバットエンジニアの似たようなカードには「with agree」と明記されているので、こっちは合意は不要という理解）"},{"c":"アクション","s":"OFFICER","en":"OFFICER'S CHANNEL","ja":"指揮官からの通信","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧カードを1枚プレイする。そのカードの効果を（あなたの部屋や隣の部屋に対してではなく）施設内の任意の部屋に対して解決する。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"STAY CALM","ja":"落ち着け","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋を選択する。その部屋にいるすべての⟦キャラクター⟧は、⟦アクションカード⟧を1枚引く。"],["リアクション","あなたの部屋でいずれかの⟦キャラクター⟧が⟦イントルーダー⟧1体から攻撃を受ける際に：\nその攻撃を阻止する。"]],"n":""},{"c":"アクション","s":"RECON","en":"SPRINT","ja":"全力疾走","e":[["","移動する。\nその後、1⟦酸素⟧を支払ってもう一度移動してもよい。"]],"n":""},{"c":"アクション","s":"RECON","en":"SCOUTING","ja":"偵察","e":[["","発見済みの部屋へ、慎重な移動を行う。"],["または","未探査の通路を通って移動を行い、探査の手順を解決する。その後、移動先の部屋のアイテムアイコンごとに、対応する種類のアイテムを1つずつ引く。その中から1つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"RECON","en":"SHOOT FIRST","ja":"先制射撃","e":[["","空の通路を通って移動する。\nこの移動中の任意のタイミングで（移動前やイントルーダーの攻撃の直前であっても）射撃攻撃または掃射攻撃を1回行ってよい。"]],"n":"※掃射攻撃する⇒空になった通路を移動する、は実行可能？それとも、先に移動先の空の通路を決める必要がある？（少なくとも、部屋の周りの全ての通路にイントルーダーがいたら、この効果は使えない？）"},{"c":"アクション","s":"COMBAT ENGINEER","en":"EXPLOSIVES","ja":"爆発物","e":[["","⟦グレネードトークン⟧を1つ捨てる。あなたの部屋から別の発見済みの部屋へと通じる新しい通路を1つ設置する。"],["または","あなたの部屋に⟦黄アイテム⟧があれば：⟦グレネードトークン⟧を1つ取得する。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"TACTICAL RETREAT","ja":"戦術的撤退","e":[["","⟦アクションカード⟧を1枚捨てて、あなたの遠距離武器から⟦弾薬⟧を消費し、空の通路を通って移動する。\nあなた以外の⟦キャラクター⟧1人の同意を得て、そのキャラクターを伴って移動してもよい。一緒に移動するキャラクターは騒音ロールを行わない。\nこの移動中には、イントルーダーの攻撃はすべて阻止される。"]],"n":"移動中の攻撃を阻止した場合、探査カードの進入時効果や騒音ロールの結果発生した攻撃は、阻止できない。"},{"c":"アクション","s":"COMBAT ENGINEER","en":"PYROTECHNICS","ja":"花火","e":[["","⟦火災マーカー⟧を1つ取り除く。"],["または","⟦グレネードトークン⟧を1つ捨てる。隣接する通路を1つ選んで、その通路にいるすべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。"]],"n":""},{"c":"アクション","s":"CONTRACTORS","en":"BASIC SECURE","ja":"基本的な安全確保","e":[["","⟦アクションカード⟧ を1枚捨てる。⟦セキュアトークン⟧を2つ置く。"],["または","⟦アクションカード⟧を1枚捨てる。⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"SHARPSHOOTER","en":"HEADSHOT","ja":"頭部への一撃","e":[["","⟦弾薬⟧があるスナイパーライフルを持っている場合、⟦アクションカード⟧を1枚捨てて、隣接する部屋にいるイントルーダーの1体に⟦クリティカル⟧を与える。"]],"n":""},{"c":"アクション","s":"SHARPSHOOTER","en":"HOLD POSITION","ja":"陣地確保","e":[["","あなたの部屋に⟦セキュアトークン⟧が2個以上ある場合、⟦アクションカード⟧を2枚引く。"]],"n":"アクションカードをプレイする時には、その効果を解決してから捨て山に移動する。そのため、このカードの効果によりデッキが作り直しされる場合には、このカードは新しいデッキには含まない。"},{"c":"アクション","s":"SHARPSHOOTER","en":"ONE BY ONE","ja":"一つずつ","e":[["","⟦弾薬⟧があるスナイパーライフルを持っている限り、この効果を繰り返し何度でも解決できる：\n\n隣接する通路に1ヒットを与える。射撃ダイスを1つロールする。ロールの結果が⟦射撃ダイス（クリティカル）⟧または⟦射撃ダイス（弾薬）⟧であれば、スナイパーライフルの⟦弾薬⟧を消費する。"]],"n":"この効果を複数回適用しても、ドローンを倒すことはできない。通路にいるドローンを倒すには1回の攻撃で2ヒットを与える必要があるため。その他の2ヒットを必要とする対象についても同様（例：アイアンクラッド）。\n※BGGより（AR確認済み）"},{"c":"アクション","s":"UAV OPERATOR","en":"AUTODESTRUCTION","ja":"自爆","e":[["","UAVを最大4回まで移動する。"],["または","UAVのある部屋とその部屋に隣接するすべての通路に対して：\nすべてのドアを破壊し、すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。すべての⟦キャラクター⟧は3⟦HP⟧を失う。その部屋に⟦故障マーカー⟧と⟦火災マーカー⟧を置く。UAVをゲームから取り除く。"]],"n":"対象の通路にあるドアは、そのドアが配置されている位置に関係なくすべて破壊される（対象の部屋に隣接するドアだけでなく、その反対側にあるドアも破壊される）。\n※Awaken Realms社に確認済み"},{"c":"アクション","s":"UAV OPERATOR","en":"DEFENSE SYSTEMS","ja":"防衛システム","e":[["","UAVを最大2回まで移動する。"],["または","UAVが隣接する部屋にある場合、騒音ロールを行わずにその部屋へ移動する。"],["リアクション","UAVがある部屋でいずれかの⟦キャラクター⟧が⟦イントルーダー⟧1体から攻撃を受ける際に：その攻撃を阻止する。"]],"n":""},{"c":"アクション","s":"UAV OPERATOR","en":"EXPLORATION","ja":"探査","e":[["","UAVを最大2回まで移動する。"],["または","未探査の通路を通ってUAVを移動し、探査の手順を解決する。探査カードの進入時効果は解決しない。"]],"n":"進入時効果（Entrance effect）とは、探査カードの一番下に書かれている効果の事を指す。（進入時効果には、騒音ロールに関連する効果が書かれていることが多い）"},{"c":"アクション","s":"UAV OPERATOR","en":"PICKUP AND DELIVERY","ja":"集荷と配達","e":[["","UAVのある部屋によって以下の効果のうちの1つを解決する：\n\n・巣…巣から卵を1つ取得する。\n・着陸地点…着陸地点にある利用可能な戦術装備トークンを1つ取得する。\n・その他の部屋…UAVのある部屋のアイテムアイコンを1つ選んで、対応する種類のアイテムを1つ取得する。\n\nその後、UAVをあなたの部屋に配置する。"]],"n":""},{"c":"アクション","s":"BIOENHANCEMENT EXPERT","en":"ADRENALINE BOOST","ja":"アドレナリン放出","e":[["","あなたは、1⟦酸素⟧を支払って⟦アクションカード⟧を2枚引いてもよい。\nあなたのセクションにいる他の⟦キャラクター⟧は、1⟦酸素⟧を支払って⟦アクションカード⟧を2枚引いてもよい。\nこれを実行したキャラクターは、接続トークンを（まだ持っていなければ）受け取る。"]],"n":""},{"c":"アクション","s":"BIOENHANCEMENT EXPERT","en":"SLOWER METABOLISM","ja":"代謝の低下","e":[["","あなたは、1⟦HP⟧を支払って2⟦酸素⟧を獲得してもよい。\nあなたのセクションにいる他の⟦キャラクター⟧は、1⟦HP⟧を支払って2⟦酸素⟧を取得してもよい。\nこれを実行したキャラクターは、接続トークンを（まだ持っていなければ）受け取る。"]],"n":""},{"c":"アクション","s":"BIOENHANCEMENT EXPERT","en":"NEURAL CONNECTION","ja":"神経接続","e":[["","あなたは射撃攻撃か掃射攻撃を行ってもよい。\nあなたのセクションにいる他の⟦キャラクター⟧は、射撃攻撃か掃射攻撃を行ってもよい。\nこれを実行したキャラクターは、接続トークンを（まだ持っていなければ）受け取る。"]],"n":"他のキャラクターが射撃攻撃か掃射攻撃を行う際には、そのキャラクターはコストを支払う必要はない。\n※Awaken Realms社に確認済み"},{"c":"アクション","s":"BIOENHANCEMENT EXPERT","en":"TAKEOVER","ja":"掌握","e":[["","あなたのセクションにいる接続トークンを持った⟦キャラクター⟧を1人選択する。\nその⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"],["リアクション","施設内の接続トークンを持ったいずれかの⟦キャラクター⟧がアクションを実行する際に：そのアクションを無効にする。その⟦キャラクター⟧ はそのアクションに要したコストをそのまま支払う。"]],"n":""},{"c":"アクション","s":"HEAVY GUN OPERATOR","en":"BREAKTHROUGH","ja":"突破口","e":[["","遠距離武器を使って掃射攻撃を行う。その後、掃射攻撃を行った通路を通って移動する。この移動中には、イントルーダーの攻撃はすべて阻止される。"]],"n":"移動中の攻撃を阻止した場合、探査カードの進入時効果や騒音ロールの結果発生した攻撃は、阻止できない。"},{"c":"アクション","s":"HEAVY GUN OPERATOR","en":"CONTINUOUS FIRE","ja":"連続射撃","e":[["","⟦弾薬⟧があるブレン軽機関銃を持っている場合、任意の数の⟦アクションカード⟧を捨てて、捨てたカードの数に等しいヒットを隣接する通路の1つに与える。\nその後、ブレン軽機関銃を使って掃射攻撃を行ってもよい。"]],"n":"最後の掃射攻撃は、アクションカードを捨てることでヒットを与えた通路とは別の通路を対象にしてもよい。（同じ通路を対象にしなければならないという記載がないため）"},{"c":"アクション","s":"HEAVY GUN OPERATOR","en":"FAST RELOAD","ja":"迅速な再装填","e":[["","遠距離武器を1つ選んで、次の内容を任意の順番で行う：\n・選択した武器にあなたの⟦弾薬トークン⟧を1つ置く。\n・射撃攻撃か掃射攻撃を行う。"]],"n":"※弾薬トークンの数が1つに限定されることは、Awaken Realms社に確認済み"},{"c":"アクション","s":"MEDICAL SUPPORT","en":"COMBAT DRUGS","ja":"戦闘用薬物","e":[["","⟦医療パック⟧を1つ捨てて、あなたの部屋にいる⟦キャラクター⟧を1人選択する。そのキャラクターは手札の⟦アクションカード⟧が3枚になるまで⟦アクションカード⟧を引く。"]],"n":"感染カードもアクションカードとしてカウントする。よって、引いたカードの種類に関わらず、手札が3枚になったらそれ以上はカードを引くことはできない。\nアクションカードをプレイする時には、その効果を解決してから捨て山に移動する。そのため、このカードの効果によりデッキが作り直しされる場合には、このカードは新しいデッキには含まない。"},{"c":"アクション","s":"MEDICAL SUPPORT","en":"FIELD SURGERY","ja":"野戦手術","e":[["","⟦アクションカード⟧を1枚捨てる。あなたの部屋にいる⟦キャラクター⟧を1人選んで、そのキャラクターの重傷を1つ取り除く。その後、あなたが⟦医療パック⟧を1つ捨てるか、そのキャラクターが感染カードを1枚受け取る。"]],"n":"他のキャラクターを治療する場合には、そのキャラクターの同意が必要となる。ただし、その後で医療パックトークンと感染カードのどちらを選択するのかは、あなたが自由にきめることができる。\n※Awaken Realms社に確認済み"},{"c":"アクション","s":"MEDICAL SUPPORT","en":"FIRST AID","ja":"応急処置","e":[["","1⟦HP⟧を回復する。"],["または","あなたの部屋に⟦緑アイテム⟧があれば：⟦医療パック⟧を1つ取得する。"]],"n":""},{"c":"アクション","s":"MEDICAL SUPPORT","en":"HIPPOCRATIC OATH","ja":"ヒポクラテスの誓い","e":[["","あなたの部屋に、重傷を1つ以上負っているあなた以外の⟦キャラクター⟧がいる場合：\n⟦イントルーダー⟧1体に2ヒットを与える 。その後、そのイントルーダーに射撃攻撃か近接攻撃を行う。"]],"n":""},{"c":"アクション","s":"MECHANIC","en":"FIGHT FIRE WITH FIRE","ja":"火には火を","e":[["","⟦火災マーカー⟧を取り除く。"],["または","アイテム1つか戦術装備トークン1つを捨てて、⟦火災マーカー⟧ を部屋に置く。"]],"n":""},{"c":"アクション","s":"MECHANIC","en":"TECHNICAL CORRIDORS","ja":"作業用通路","e":[["","あなたの部屋に⟦黄アイテム⟧があれば：⟦アクションカード⟧を1枚捨てて、施設内の⟦黄アイテム⟧がある他の部屋へ移動する。その後、パスをする。"]],"n":""},{"c":"アクション","s":"SOLDIER","en":"NERVES OF STEEL","ja":"鋼の心臓","e":[["","あなたのターン中、あなたが⟦イントルーダー⟧1体から攻撃を受ける際に：\nその攻撃を阻止する。"]],"n":""},{"c":"アクション","s":"SOLDIER","en":"FULL AUTO","ja":"フルオート射撃","e":[["","ソルジャーの銃を使用して、任意の回数だけ掃射攻撃を行う。"]],"n":""},{"c":"アクション","s":"SCOUT","en":"ADRENALINE","ja":"アドレナリン","e":[["","あなたの部屋に⟦イントルーダー⟧が1体だけいれば：\n⟦アクションカード⟧を2枚引く。"]],"n":"アクションカードをプレイする時には、その効果を解決してから捨て山に移動する。そのため、このカードの効果によりデッキが作り直しされる場合には、このカードは新しいデッキには含まない。"},{"c":"アクション","s":"SCOUT","en":"RECONNAISSANCE","ja":"偵察任務","e":[["","未探査の通路を通って移動する。探査カードを2枚引き、その中から1枚を選んで探査シーケンスを解決する。選択しなかった方をデッキに戻してシャッフルする。"]],"n":""},{"c":"アクション","s":"SCOUT","en":"SCAVENGING","ja":"ガラクタ漁り","e":[["","あなたの部屋のアイテムアイコンごとに、対応する種類のアイテムを1つずつ引く。その中から2つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"CAPTAIN","en":"FANNING","ja":"扇状射撃","e":[["","旧式六連発拳銃から任意の数の弾丸を消費する。\n消費した弾丸と同じ数のヒットを、隣接する通路の1つに与える。または、あなたの部屋にいる⟦イントルーダー⟧1体に与える。"]],"n":""},{"c":"アクション","s":"CAPTAIN","en":"FISTFUL OF BULLETS","ja":"一握りの弾丸","e":[["","旧式六連発拳銃に弾丸を1つ装填する。\n任意の数の⟦アクションカード⟧を捨てて、捨てたカードの数に等しい弾丸を旧式六連発拳銃にさらに装填する。"]],"n":""},{"c":"アクション","s":"CAPTAIN","en":"BASH WITH THE BARREL","ja":"銃身による殴打","e":[["","旧式六連発拳銃を使って近接攻撃を行う。\n反撃によって攻撃を受ける場合、武器に⟦故障マーカー⟧を置かずにその攻撃を阻止する。"]],"n":""},{"c":"アクション","s":"CAPTAIN","en":"AUTHORITY","ja":"権限","e":[["","あなたの部屋か隣の部屋にいる⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"]],"n":""},{"c":"アクション","s":"SENTRY","en":"DEFENSE PLAN","ja":"防衛計画","e":[["","⟦セキュアトークン⟧を最大3つ置く。"],["または","⟦アクションカード⟧を1枚捨てる。隣接する空の通路を1つ選んで補強する。"]],"n":""},{"c":"アクション","s":"SENTRY","en":"STUN","ja":"気絶","e":[["","⟦アクションカード⟧が3枚以下の⟦キャラクター⟧を1人選択する。そのキャラクターは⟦アクションカード⟧をすべて捨てて、パスをする。"],["または","⟦故障マーカー⟧を1つあなたの武器に置いて、感染カードを1枚受け取る。あなたの部屋にいる⟦イントルーダー⟧を1体撃退する。"]],"n":""},{"c":"アクション","s":"JANITOR","en":"IT SHOULD WORK","ja":"まだ動くはずだ","e":[["","部屋を使用する。その部屋に⟦故障マーカー⟧があっても使用できる。"],["または","アイテムか⟦ロボット⟧から⟦故障マーカー⟧を1つ取り除く。"]],"n":""},{"c":"アクション","s":"JANITOR","en":"CLEAN UP","ja":"掃除","e":[["","⟦故障マーカー⟧を1つ取り除く。"],["または","⟦火災マーカー⟧を取り除く。"]],"n":""},{"c":"アクション","s":"JANITOR","en":"JURY RIGGING","ja":"その場しのぎ","e":[["","⟦アクションカード⟧を1枚と⟦黄アイテム⟧を1つ捨てて、支援装備カードを3枚引く。その中から1枚を選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"SCIENTIST","en":"RISK ASSESSMENT","ja":"リスク評価","e":[["","⟦コンピューター⟧がある部屋にいる場合、イベントデッキの一番上にあるカードを秘密裏に確認する。\nその後、そのカードをデッキの一番上か一番下に戻す。"]],"n":""},{"c":"アクション","s":"SCIENTIST","en":"INTRANET","ja":"イントラネット","e":[["","⟦コンピューター⟧がある部屋にいる場合、施設内の⟦コンピューター⟧がある別の部屋を使用する。"]],"n":""},{"c":"アクション","s":"SCIENTIST","en":"BLOCKING ACCESS","ja":"アクセスブロック","e":[["","⟦コンピューター⟧がある部屋にいる場合、その部屋を使用する。"],["または","⟦コンピューター⟧がある部屋にいる場合、施設内の⟦コンピューター⟧がある別の部屋に⟦故障マーカー⟧を1つ置く。"]],"n":""},{"c":"アクション","s":"SURVIVOR","en":"DESPERATE ATTACK","ja":"やけくそな攻撃","e":[["","⟦イントルーダー⟧1体に2ヒットを与えて、そのイントルーダーに近接攻撃を行う。\n反撃によって攻撃を受ける場合、アイテムを1つ捨てることでその攻撃を阻止してもよい。"]],"n":""},{"c":"アクション","s":"SURVIVOR","en":"VENTS","ja":"通気口","e":[["","⟦アクションカード⟧を1枚捨てて、施設内の部屋を1つ選択する。\nその部屋とあなたの部屋にある⟦セキュアトークン⟧をすべて捨てる。\nイントルーダーの攻撃を1回解決して（アダルトによる攻撃として処理する）、選択した部屋へ移動する。"]],"n":""},{"c":"アクション","s":"SURVIVOR","en":"OBSTINATE","ja":"屈強","e":[["","⟦アクションカード⟧を1枚引く。さらに、負っている重傷と同じ数の⟦アクションカード⟧を引く。"],["または","アイテムを1つ捨てて、重傷を1つ取り除く。"]],"n":"アクションカードをプレイする時には、その効果を解決してから捨て山に移動する。そのため、このカードの効果によりデッキが作り直しされる場合には、このカードは新しいデッキには含まない。"},{"c":"アクション","s":"SURVIVOR","en":"DISTRACTION","ja":"目くらまし","e":[["","アイテム1つか戦術装備トークン1つを捨てて、移動する。\nこの移動中には、イントルーダーの攻撃はすべて阻止される。"]],"n":"移動中の攻撃を阻止した場合、探査カードの進入時効果や騒音ロールの結果発生した攻撃は、阻止できない。"},{"c":"アクション","s":"LAB RAT","en":"WEIRD METABOLISM","ja":"奇妙な代謝","e":[["","感染カードを1枚捨てて、⟦アクションカード⟧を2枚引く。"],["または","巣にいる場合、2⟦HP⟧を回復するか、重傷を1つ取り除く。"]],"n":"アクションカードをプレイする時には、その効果を解決してから捨て山に移動する。そのため、このカードの効果によりデッキが作り直しされる場合には、このカードは新しいデッキには含まない。"},{"c":"アクション","s":"LAB RAT","en":"SENSITIVE HEARING","ja":"鋭敏な聴覚","e":[["","あなたのセクションにある通路を1つ選んで、その通路にある⟦騒音マーカー⟧を取り除く。"],["または","あなたのセクションにある通路を1つ選んで、⟦騒音マーカー⟧を置く。"]],"n":""},{"c":"アクション","s":"LAB RAT","en":"INCONSPICUOUS","ja":"影に潜む","e":[["","⟦急襲（騒音ダイス）⟧を解決する際に：\nそれを解決せずに無視する。"]],"n":""},{"c":"アクション","s":"HACKER","en":"NEURAL LINK","ja":"脳神経接続","e":[["","施設内の任意の場所にいる⟦ロボット⟧を起動する。"],["または","スマートガンから⟦故障マーカー⟧を取り除く。"]],"n":""},{"c":"アクション","s":"HACKER","en":"OVERRIDE","ja":"上書き","e":[["","⟦コンピューター⟧がある部屋にいる場合、任意のセクションの⟦生命維持：稼働⟧/⟦生命維持：停止⟧の生命維持システムトークンを、反対側に裏返す。"],["または","スマートガンから⟦故障マーカー⟧を取り除く。"]],"n":""},{"c":"アクション","s":"XENOBIOLOGIST","en":"OVERMIND","ja":"思考占拠","e":[["","⟦アクションカード⟧を1枚と細胞標本を1つ捨てて、あなたのセクションの⟦イントルーダー⟧を1体移動させる。"]],"n":"イントルーダーの移動先はあなたが選択する。また、戦闘中のイントルーダーを移動させることもできる。\n※Awaken Realms社に確認済み"},{"c":"アクション","s":"XENOBIOLOGIST","en":"FIELD EXPERIENCE","ja":"実地経験","e":[["","細胞標本を1つ、あなたのキャラクターボードに置く。"],["リアクション","イントルーダーバッグからイントルーダートークンが1つ引かれた後で：\n細胞標本を1つ捨てて、そのイントルーダートークンをバッグに戻す。バッグから別のトークンを1つ引く。"]],"n":""},{"c":"アクション","s":"XENOBIOLOGIST","en":"VIVISECTION","ja":"生体解剖","e":[["","探査アームを持っている場合：\nキャラクターボードにある細胞標本に等しい数のヒットを⟦イントルーダー⟧1体に与える。その後、探査アームを使ってそのイントルーダーに近接攻撃を行う。"],["または","探査アームから⟦故障マーカー⟧を取り除く。"]],"n":""},{"c":"アクション","s":"PILOT","en":"CONNECTION","ja":"接続","e":[["","⟦コンピューター⟧がある部屋にいる場合、施設内の任意の場所にいる⟦ロボット⟧を起動する。"],["または","⟦ロボット⟧か⟦コンピューター⟧がある部屋にいる場合、その部屋を使用する。"]],"n":""},{"c":"アクション","s":"PILOT","en":"PILOTING","ja":"操縦","e":[["","⟦着陸機⟧か⟦ロボット⟧がある部屋にいる場合、隣接する通路を1つ選んで掃射ダイスを1つロールする。\nロールの結果に等しいヒットをその通路に与える。"],["または","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"]],"n":""},{"c":"アクション","s":"PILOT","en":"WEAK SPOT","ja":"弱点","e":[["","⟦イントルーダー⟧1体に1ヒットを与える。その後、そのイントルーダーに射撃攻撃か近接攻撃を行う。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"REPAIRS","ja":"修理","e":[["","⟦アクションカード⟧を1枚捨てて、⟦故障マーカー⟧を1つ取り除く。"],["または","アクセス可能なドアを1つ開く、または閉じる。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"REST","ja":"休憩","e":[["","感染チェック手順を解決する。スキャンの結果が陰性だったカードをすべて、捨て山へ移動せずにゲームから取り除く。\n\n感染チェック手順：\n手札にあるすべての感染カードをスキャンする。結果が陽性のカードが1枚以上あれば、あなたのキャラクターボードにラーヴァを1体配置する。その後、手札にある感染カードをすべて捨て山に移動する。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"SEARCH","ja":"探索","e":[["","あなたの部屋のアイテムアイコンごとに、対応する種類のアイテムを1つずつ引く。その中から1つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"SECURE","ja":"安全確保","e":[["","⟦セキュアトークン⟧を2つ置く。"],["または","⟦アクションカード⟧を1枚捨てる。⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"OFFICER","en":"DEMOLITION","ja":"破壊工作","e":[["","アクセス可能なドアを1つ破壊する。"],["または","あなたの部屋に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"アクション","s":"RECON","en":"CHAIN OF COMMAND","ja":"指揮系統","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋にいる、あなたよりランクが低い⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"],["リアクション","⟦指令⟧カードがあなたに対してプレイされた場合：\nその効果を無視する。"]],"n":""},{"c":"アクション","s":"RECON","en":"DEMOLITION","ja":"破壊工作","e":[["","アクセス可能なドアを1つ破壊する。"],["または","あなたの部屋に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"アクション","s":"RECON","en":"REPAIRS","ja":"修理","e":[["","⟦アクションカード⟧を1枚捨てて、⟦故障マーカー⟧を1つ取り除く。"],["または","アクセス可能なドアを1つ開く、または閉じる。"]],"n":""},{"c":"アクション","s":"RECON","en":"REST","ja":"休憩","e":[["","感染チェック手順を解決する。スキャンの結果が陰性だったカードをすべて、捨て山へ移動せずにゲームから取り除く。\n\n感染チェック手順：\n手札にあるすべての感染カードをスキャンする。結果が陽性のカードが1枚以上あれば、あなたのキャラクターボードにラーヴァを1体配置する。その後、手札にある感染カードをすべて捨て山に移動する。"]],"n":""},{"c":"アクション","s":"RECON","en":"SEARCH","ja":"探索","e":[["","あなたの部屋のアイテムアイコンごとに、対応する種類のアイテムを1つずつ引く。その中から1つを選んで取得し、残りを捨てる。"]],"n":""},{"c":"アクション","s":"RECON","en":"SECURE","ja":"安全確保","e":[["","⟦セキュアトークン⟧を2つ置く。"],["または","⟦アクションカード⟧を1枚捨てる。⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"RECON","en":"TAKING AIM","ja":"狙いを定める","e":[["","射撃攻撃か掃射攻撃を行う。\nこの攻撃での1回目のロール結果を振り直ししてもよい。2回目の結果を必ず適用する。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"COMPUTER SKILLS","ja":"コンピュータースキル","e":[["","⟦コンピューター⟧がある部屋にいる場合、その部屋を使用する。"],["または","⟦コンピューター⟧がある部屋にいる場合、施設内のドアを1つ選んで開く、または閉じる。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"FAST SECURE","ja":"迅速な安全確保","e":[["","⟦セキュアトークン⟧を2つ置く。"],["または","⟦キャラクター⟧または⟦ロボット⟧がいる隣接する部屋へと通じる空の通路を1つ選んで、補強する。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"FAST REPAIRS","ja":"迅速な修理","e":[["","⟦故障マーカー⟧を1つ取り除く。"],["または","アクセス可能なドアを1つ開く、または閉じる。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"CHAIN OF COMMAND","ja":"指揮系統","e":[["","ラウンドトラック上にある⟦着陸機⟧を任意の方向に1スペース分移動する。"],["または","⟦指令⟧\nあなたの部屋か隣の部屋にいる、あなたよりランクが低い⟦キャラクター⟧を1人選択する。その⟦キャラクター⟧を使って、移動か、射撃攻撃か、掃射攻撃を行う（アクションに伴う選択はすべてあなたが行う）。"],["リアクション","⟦指令⟧カードがあなたに対してプレイされた場合：\nその効果を無視する。"]],"n":""},{"c":"アクション","s":"COMBAT ENGINEER","en":"REST","ja":"休憩","e":[["","感染チェック手順を解決する。スキャンの結果が陰性だったカードをすべて、捨て山へ移動せずにゲームから取り除く。\n の通路に⟦騒音マーカー⟧を置く。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"LEAVING THE FRAME","ja":"躯体からの離脱","e":[["移動","いずれの⟦イントルーダー⟧も移動しない。"],["主効果","狂信者が1人以上生き残っていれば：\nキャラクターボード上にトゥイッチリングがある⟦キャラクター⟧は：\n感染カードを1枚受け取り、⟦アクションカード⟧をすべて捨てる。デッキを作り直してシャッフルする。\nその後、羽化の手順を解決する。\nその他の⟦キャラクター⟧は、⟦コンピューター⟧がある部屋にいれば：\n⟦アクションカード⟧を4枚引いて感染チェック手順を解決する。その後、すべての⟦アクションカード⟧を捨てる。"],["副次効果","イベントデッキを作り直してシャッフルする。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"CRYOSLEEP CHAMBERS EXPLOSION","ja":"冬眠カプセルの破裂","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nマザーブレインがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","コールドスリープルームに⟦火災マーカー⟧と⟦故障マーカー⟧を置く。"],["副次効果","狂信者が2人以上生き残っていれば：\nすべての⟦キャラクター⟧は⟦急襲（騒音ダイス）⟧を解決する。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"DETONATION PROTOCOL","ja":"連鎖起爆プロトコル","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nクロールマインがいる通路のすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が2人以上生き残っていれば：\nクロールマインがいるすべての部屋に対して：\n⟦故障マーカー⟧と⟦火災マーカー⟧を1つずつ置く。その部屋にいる⟦キャラクター⟧は3⟦HP⟧を失う。\nその部屋のクロールマインをすべてサプライにもどす。"],["副次効果","⟦騒音マーカー⟧がない未探査の通路に⟦騒音マーカー⟧を置く。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"SYSTEM OVERLOAD","ja":"回路の暴走","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nクロールマインがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が2人以上生き残っていれば：\n⟦コンピューター⟧があるすべての部屋に⟦火災マーカー⟧を置く。⟦キャラクター⟧がいる⟦火災マーカー⟧がある部屋の周りのドアをすべて閉じる。"],["副次効果","⟦騒音マーカー⟧がない未探査の通路に⟦騒音マーカー⟧を置く。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"DAMAGING FIRE","ja":"火災ダメージ","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nクロールマインがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","⟦火災マーカー⟧があるすべての部屋に⟦故障マーカー⟧を置く。\nすべての部屋の⟦火災マーカー⟧が、騒音番号が最も小さい通路を通って隣の部屋へ延焼する。"],["副次効果","狂信者が4人以上生き残っていれば：\nすべての⟦キャラクター⟧は⟦急襲（騒音ダイス）⟧を解決する。"]],"n":"通路の騒音番号（騒音ロールを行った際に参照する1～4、または0、の番号）を参照する事に注意すること。場合によっては、一つの部屋から複数の通路/部屋へと延焼する可能性がある。"},{"c":"イベント","s":"Neoflesh","en":"PURGE PROTOCOL","ja":"異物浄化プロトコル","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nクロールマインがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が4人以上生き残っていれば：\n自爆プロシージャーを起動する。"],["副次効果","すべての⟦キャラクター⟧は騒音ロールを1回行う。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"SABOTAGE PROTOCOL","ja":"妨害命令","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nアイアンクラッドがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が2人以上生き残っていれば：\nセクション毎に、番号が最も大きい部屋に対して：\nその部屋の⟦セキュアトークン⟧を1つ捨てて、トゥイッチリングを1体配置する。"],["副次効果","未探査の通路にあるすべての⟦騒音マーカー⟧を解決する。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"LIFE SUPPORT FAILURE","ja":"生命維持システムの故障","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nアイアンクラッドがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","すべての⟦生命維持：稼働⟧の生命維持システムトークンを⟦生命維持：停止⟧の側に裏返す。\nすべての生命維持システム制御室に⟦故障マーカー⟧を置く。"],["副次効果","狂信者が5人生き残っていれば：\nすべての⟦キャラクター⟧は⟦急襲（騒音ダイス）⟧を解決する。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"OXYGEN ABSORPTION PROTOCOL","ja":"酸素枯渇プロトコル","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nアイアンクラッドがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が5人生き残っていれば：\nすべての⟦生命維持：停止⟧の生命維持システムトークンをゲームから取り除く。\nすべての⟦生命維持：稼働⟧の生命維持システムトークンを⟦生命維持：停止⟧の側に裏返す。"],["副次効果","このカードをイベントデッキに戻してシャッフルする。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"FIRE BREATH","ja":"火の息","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nアイアンクラッドがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","すべての部屋の⟦火災マーカー⟧が、生命維持システムが⟦生命維持：稼働⟧のセクションにある隣の部屋へ延焼する。"],["副次効果","狂信者が4人以上生き残っていれば：\nすべての⟦キャラクター⟧は⟦急襲（騒音ダイス）⟧を解決する。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"LONG-RANGE DEFENSE PROTOCOL","ja":"長距離迎撃命令","e":[["移動","このステップではトゥイッチリングの移動は行わない。\nファイアスピッターがいる通路のすべての⟦イントルーダー⟧が移動する。その後、部屋にいるすべての⟦イントルーダー⟧が移動する。"],["主効果","狂信者が3人以上生き残っていれば：\n⟦着陸機⟧がラウンドトラックの14のスロットにあれば、それをゲームから取り除く。\nそうでなければ、ラウンドトラック上にある⟦着陸機⟧を下の方向に5スペース分移動する（ただし、14のスロットを超えて移動しない）。"],["副次効果","このカードをイベントデッキに戻してシャッフルする。"]],"n":""},{"c":"イベント","s":"Neoflesh","en":"CLEANUP PROTOCOL","ja":"一掃プロトコル","e":[["移動","いずれの⟦イントルーダー⟧も移動しない。"],["主効果","狂信者が3人以上生き残っていれば：\n未探査の通路以外にいる、⟦キャラクター⟧と同じ部屋にいないトゥイッチリングをすべて、着陸地点に移動する。\n着陸地点にいるトゥイッチリングと同じ回数、着陸地点にある全種類の戦術装備トークンを1個ずつ取り除く。"],["副次効果","未探査の通路にあるすべての⟦騒音マーカー⟧を解決する。"]],"n":"例えば、着陸地点にトゥイッチリングが2体いた場合、最大で8個（各種類、2個ずつ）の戦術装備トークンを取り除く。"},{"c":"イベント","s":"Neoflesh","en":"ARTIF 屋から⟦故障マーカー⟧か⟦火災マーカー⟧を1つ取り除く。"]],"n":"部屋から故障マーカーを取り除く場合、その部屋の中の任意の対象から故障マーカーを取り除くことができる。例えば、その部屋にいるキャラクターの持つ武器から故障マーカーを取り除くこともできる。\n※Awaken Realms社に確認済み"},{"c":"ロボット","s":"","en":"MILITARY ROBOT","ja":"軍事ロボット","e":[["","⟦ロボット⟧を1回移動する。"],["または","⟦ロボット⟧がいる部屋に隣接する通路を1つ選んで、掃射ダイスを1つロールする。ロールの結果に等しいヒットをその通路に与える。\n⟦掃射ダイス★⟧：⟦ロボット⟧に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"ロボット","s":"","en":"MEDICAL ROBOT","ja":"医療ロボット","e":[["","⟦ロボット⟧を最大2回まで移動する。"],["または","⟦ロボット⟧と同じ部屋にいる ⟦キャラクター⟧を1人選択する。そのキャラクターの重傷を1つ取り除くか、2⟦HP⟧を回復する。"]],"n":""},{"c":"ロボット","s":"","en":"SECURING ROBOT","ja":"安全確保ロボット","e":[["","⟦ロボット⟧を最大3回まで移動する。"],["または","⟦ロボット⟧に隣接するアクセス可能なドアを1つ開く、または閉じる。"],["または","⟦ロボット⟧がいる部屋に⟦セキュアトークン⟧を2つ置く。"]],"n":""},{"c":"ロボット","s":"","en":"EXPLORATION ROBOT","ja":"探査ロボット","e":[["","⟦ロボット⟧を最大2回まで移動する。"],["または","未探査の通路を通って⟦ロボット⟧を移動し、探査の手順を解決する。探査カードの進入時効果は解決しない。"]],"n":"進入時効果（Entrance effect）とは、探査カードの一番下に書かれている効果の事を指す。（進入時効果には、騒音ロールに関連する効果が書かれていることが多い）"},{"c":"重傷","s":"","en":"EYES","ja":"眼","e":[["","射撃攻撃の結果すべてに+1の補正を加える。"]],"n":""},{"c":"重傷","s":"","en":"LUNGS","ja":"肺","e":[["","パスをするたびに、 1⟦酸素⟧を失う。\nすでに0⟦酸素⟧になっている場合、 代わりに2⟦HP⟧を失う。"]],"n":""},{"c":"重傷","s":"","en":"HAND","ja":"手","e":[["","『アイテムを使用する』アクションに必要なコストが、⟦アクションカード⟧1枚分増える。"]],"n":""},{"c":"重傷","s":"","en":"ARM","ja":"腕","e":[["","利用できるハンドスロットが1つだけになる。\n両方のハンドスロットにアイテムをもっていた場合、直ちにいずれか一方のスロットからアイテムを捨てなければならない。"]],"n":""},{"c":"重傷","s":"","en":"LEG","ja":"脚","e":[["","⟦イントルーダー⟧がいる部屋から『移動する』アクションを行う場合、必要なコストが⟦アクションカード⟧1枚分増える。"]],"n":""},{"c":"重傷","s":"","en":"BODY","ja":"胴体","e":[["","「アクションカードを引く」ステップにおいて、手札が5枚になるまで⟦アクションカード⟧を引く代わりに、手札が4枚になるまで⟦アクションカード⟧を引く。"]],"n":"これは、クリーンアップフェイズ中の「アクションカードを引く」ステップのことを指す。"},{"c":"重傷","s":"","en":"KNEE","ja":"膝","e":[["","『慎重な移動』アクションに必要なコストが、⟦アクションカード⟧1枚分増える。"]],"n":""},{"c":"重傷","s":"","en":"GUTS","ja":"内臓","e":[["","パスをするたびに、感染カードを1枚受け取る。"]],"n":""},{"c":"重傷","s":"","en":"BLEEDING","ja":"出血","e":[["","パスをするたびに、 1⟦HP⟧を失う。"]],"n":""},{"c":"アイテム","s":"赤","en":"AMMO","ja":"弾薬","e":[["条件","このアイテムを取得した後すぐに使用してもよい。"],["","このアイテムを取得した後すぐに使用した場合、使用に対するアクションやコストは必要としない。"]],"n":""},{"c":"アイテム","s":"赤","en":"ANTI-AIRCRAFT CODES","ja":"対空防御システムコード","e":[["条件","⟦コンピューター⟧があり⟦故障マーカー⟧がない部屋でのみ使用可能。"],["","2枚重ねにされた対空防御トークンのうちの、上側にあるトークンが対空防御システムの状態を示している事に注意すること。\nトークンがどのような順番で配置されていたか、あなたがトークンの上下を入れ替えたかどうかについては、他のプレイヤーに情報を共有する必要はない。"]],"n":""},{"c":"アイテム","s":"赤","en":"EXPLORING DRONE","ja":"探査ドローン","e":[["","隣接する部屋に対して、その部屋へ移動せずに探査の手順を解決する。探査カードの進入時効果は解決しない。"],["","進入時効果（Entrance effect）とは、探査カードの一番下に書かれている効果の事を指す。（進入時効果には、騒音ロールに関連する効果が書かれていることが多い）"]],"n":""},{"c":"アイテム","s":"赤","en":"FLASHBANG","ja":"閃光手榴弾","e":[["","移動する。\nこの移動中には、イントルーダーの攻撃はすべて阻止される。"]],"n":""},{"c":"アイテム","s":"赤","en":"GRENADE","ja":"手榴弾","e":[["条件","このアイテムを取得した後すぐに使用してもよい。"],["隣接する通路を1つ選んで⟦グレネードトークン⟧の効果を1回解決する。","または"],["⟦グレネードトークン⟧を1つ取得する 。","このアイテムを取得した後すぐに使用した場合、使用に対するアクションやコストは必要としない。"]],"n":""},{"c":"アイテム","s":"赤","en":"PERSONAL LOG CODES","ja":"個人ログコード","e":[["条件","⟦コンピューター⟧があり⟦故障マーカー⟧がない部屋でのみ使用可能。"]],"n":""},{"c":"アイテム","s":"赤","en":"PORTABLE BARRIER","ja":"携帯遮蔽壁","e":[["","アクセス可能な閉じたドアを1つ設置する（破壊されたドアがある場所や、ドアスロットがない場所にも設置できる）。"]],"n":""},{"c":"アイテム","s":"赤","en":"MILITARY TASER","ja":"軍用テーザー銃","e":[["","部屋から⟦イントルーダー⟧を1体撃退する。"],["","または"]],"n":""},{"c":"アイテム","s":"赤","en":"REMOTE DETONATOR","ja":"遠隔起爆装置","e":[["","あなたのセクションにある⟦セキュアトークン⟧がある部屋を1つ選んで、その部屋の⟦セキュアトークン⟧を1つ捨てる。その部屋のすべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。その部屋にいる⟦キャラクター⟧は、3⟦HP⟧を失う。"]],"n":""},{"c":"アイテム","s":"緑","en":"ADRENALINE INJECTION","ja":"アドレナリン注射","e":[["","⟦アクションカード⟧を1枚引く。\nこのアイテムを使用したターン中、任意の数のアクションを実行してよい。\n最後のアクションを終えたら、パスをする。"]],"n":""},{"c":"アイテム","s":"緑","en":"ANTISEPTIC","ja":"殺菌剤","e":[["","手札から感染カード1枚を、スキャンせずに取り除く。"]],"n":""},{"c":"アイテム","s":"緑","en":"CAFFEINE PILLS","ja":"カフェイン錠剤","e":[["","⟦アクションカード⟧を3枚引く。"]],"n":""},{"c":"アイテム","s":"緑","en":"EMERGENCY LIFE SUPPORT CODES","ja":"緊急用生命維持システムコード","e":[["条件","⟦コンピューター⟧があり⟦故障マーカー⟧がない部屋でのみ使用可能。"]],"n":""},{"c":"アイテム","s":"緑","en":"MEDPACK","ja":"医療パック","e":[["条件","このアイテムを取得した後すぐに使用してもよい。"],["2⟦HP⟧を回復する。","または"],["⟦医療パック⟧を1つ取得する 。","このアイテムを取得した後すぐに使用した場合、使用に対するアクションやコストは必要としない。"]],"n":""},{"c":"アイテム","s":"緑","en":"MEDICAL STAPLER","ja":"医療用ホチキス","e":[["","重傷を1つ取り除く"],["","または"]],"n":""},{"c":"アイテム","s":"緑","en":"STIMULANTS","ja":"興奮剤","e":[["","2⟦HP⟧を回復する。"],["","または"]],"n":""},{"c":"アイテム","s":"緑","en":"TERMINATION CODES","ja":"遮断コード","e":[["条件","⟦コンピューター⟧があり⟦故障マーカー⟧がない部屋でのみ使用可能。"]],"n":""},{"c":"アイテム","s":"緑","en":"HEAVY OXYGEN TANK","ja":"大型酸素タンク","e":[["","7⟦酸素⟧を獲得する。"]],"n":""},{"c":"アイテム","s":"緑","en":"MEDKIT","ja":"医療キット","e":[["","重傷を1つ取り除く、および/または、3⟦HP⟧を回復する。"]],"n":""},{"c":"アイテム","s":"黄","en":"DUCT TAPE","ja":"ダクトテープ","e":[["","⟦故障マーカー⟧を1つ取り除く。"],["","または"]],"n":""},{"c":"アイテム","s":"黄","en":"OXYGEN TANK","ja":"酸素タンク","e":[["条件","このアイテムを取得した後すぐに使用してもよい。"],["3⟦酸素⟧を獲得する。","または"],["⟦酸素トークン⟧を1つ取得する。","このアイテムを取得した後すぐに使用した場合、使用に対するアクションやコストは必要としない。"]],"n":""},{"c":"アイテム","s":"黄","en":"PHOSPHATES","ja":"リン酸塩","e":[["","隣接する空の通路を1つ選んで補強する。"],["","または"]],"n":""},{"c":"アイテム","s":"黄","en":"TOOLS","ja":"工具","e":[["","⟦故障マーカー⟧を1つ取り除く。"],["","または"]],"n":""},{"c":"アイテム","s":"黄","en":"FIRE EXTINGUISHER","ja":"消火器","e":[["","⟦火災マーカー⟧を取り除く。"],["","または"]],"n":""},{"c":"アイテム","s":"黄","en":"ROBOT CONTROLLER","ja":"ロボット制御器","e":[["","施設内の任意の場所にいる⟦ロボット⟧を起動する。"],["","または"]],"n":""},{"c":"キャラクターアイテム","s":"HEAVY GUN OPERATOR","en":"BF GUN","ja":"ブレン軽機関銃","e":[["","⟦掃射⟧：⟦掃射1⟧を⟦掃射2⟧として扱う。\n\n⟦掃射ダイス★⟧：この武器に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"キャラクターアイテム","s":"RECON","en":"ASSAULT RIFLE","ja":"アサルトライフル","e":[["","⟦射撃⟧：射撃攻撃の後、⟦弾薬⟧を消費して同じ⟦イントルーダー⟧に対して2回目の射撃攻撃を行ってもよい。"]],"n":""},{"c":"キャラクターアイテム","s":"COMBAT ENGINEER","en":"AUTOMATIC SHOTGUN","ja":"オートマティックショットガン","e":[["","⟦射撃⟧：射撃攻撃をする前に、1ヒットを与える。\n\n⟦射撃ダイス（クリティカル）⟧：可能なら、⟦弾薬⟧を消費する。"]],"n":""},{"c":"キャラクターアイテム","s":"OFFICER","en":"SAWED-OFF SHOTGUN","ja":"ソードオフショットガン","e":[["","⟦射撃⟧：通常の射撃攻撃の代わりに、⟦弾薬⟧を消費してあなたの部屋のアダルト1体を撃退してもよい。"]],"n":""},{"c":"キャラクターアイテム","s":"MEDICAL SUPPORT","en":"CARBINE","ja":"カービン銃","e":[["","⟦射撃⟧：⟦イントルーダー⟧を殺せなかった場合、攻撃した⟦イントルーダー⟧に1ヒットを与える。"]],"n":""},{"c":"キャラクターアイテム","s":"CONTRACTOR","en":"BULLETPROOF VEST","ja":"防弾ベスト","e":[["","重傷を1つ負う際に、重傷を負う代わりにこのアイテムを捨てる。"]],"n":"1度に重傷を2つ以上負う場合、その内の１つの重傷だけをこのカードで無効にできる。"},{"c":"キャラクターアイテム","s":"CONTRACTOR","en":"HANDGUN","ja":"拳銃","e":[["","⟦掃射⟧：掃射攻撃の結果に-1の補正を加える。"]],"n":""},{"c":"キャラクターアイテム","s":"BIOENHANCEMENT EXPERT","en":"PERSONAL DEFENSE WEAPON","ja":"短機関銃","e":[["","⟦掃射ダイス★⟧：4ヒットではなく1ヒットを与える。"]],"n":""},{"c":"キャラクターアイテム","s":"SHARPSHOOTER","en":"SNIPER RIFLE","ja":"スナイパーライフル","e":[["","⟦掃射⟧：通常の掃射攻撃の代わりに、⟦弾薬⟧を消費せずに隣接する通路の1つに1ヒットを与える。"]],"n":""},{"c":"キャラクターアイテム","s":"UAV OPERATOR","en":"SMART RIFLE","ja":"スマートライフル","e":[["","⟦射撃⟧：あなたの部屋にUAVがあれば、1回目のロール結果を振り直ししてもよい。\n2回目の結果を必ず適用する。"]],"n":""},{"c":"キャラクターアイテム","s":"MECHANIC","en":"PLASMA TORCH","ja":"プラズマトーチ","e":[["","アクセス可能な閉じたドアを1つ設置する（破壊されたドアがある場所や、ドアスロットがない場所にも設置できる）。"]],"n":""},{"c":"キャラクターアイテム","s":"MECHANIC","en":"MECHANIC'S SAWED-OFF","ja":"メカニックのソードオフショットガン","e":[["","⟦射撃ダイス（弾薬）⟧：⟦クリティカル⟧を与える。"]],"n":"この効果は攻撃対象にクリティカルを与えるが、弾薬は通常通りに消費する。"},{"c":"キャラクターアイテム","s":"SCIENTIST","en":"SCIENTIST'S PISTOL","ja":"科学者の拳銃","e":[["","⟦射撃ダイス（クリティカル）⟧：⟦クリティカル⟧を与える代わりに⟦弾薬⟧を消費する。"]],"n":""},{"c":"キャラクターアイテム","s":"SCIENTIST","en":"WHEELCHAIR WITH HOLO COMPUTER","ja":"ホロコンピューター搭載車椅子","e":[["","あなたのターン中、あなたの部屋を⟦コンピューター⟧ がある部屋とみなしてよい。"]],"n":""},{"c":"キャラクターアイテム","s":"CAPTAIN","en":"CAPTAIN'S OLD SIX SHOOTER","ja":"旧式六連発拳銃","e":[["","ゲーム開始時に：この武器の弾丸として、この武器の上に汎用マーカーを6個置く。\n\nこの武器で射撃攻撃か掃射攻撃をする場合には、弾丸を1つ消費する。\n\n⟦掃射⟧：掃射攻撃の結果はすべて⟦掃射1⟧として扱う。\n⟦射撃ダイス（弾薬）⟧：⟦弾薬⟧を消費する代わりに、⟦クリティカル⟧を与える。"]],"n":"⇒ SOLDIER'S GUN にほぼ同じ効果があるがこちらは「弾薬を消費する代わりに」とはっきり書かれている。多分、この武器も同じことを言いたいのだと思う。（ので、和訳は勝手に「弾薬を消費する代わりに」を追加した）"},{"c":"キャラクターアイテム","s":"CAPTAIN","en":"SIX SHOOTER CARTRIDGE","ja":"六連発弾薬カートリッジ","e":[["","旧式六連発拳銃の弾丸を、6発になるまで補充する。"]],"n":""},{"c":"キャラクターアイテム","s":"SCOUT","en":"SCOUT'S RIFLE","ja":"スカウトのライフル銃","e":[["","⟦射撃⟧：射撃攻撃をする前に、⟦弾薬⟧を消費して2ヒットを与えてもよい。"]],"n":""},{"c":"キャラクターアイテム","s":"SCOUT","en":"MOTION SCANNER","ja":"動体スキャナー","e":[["","あなたが騒音ロールを行うたびに：\n⟦アクションカード⟧を1枚捨てて、1回目のロール結果を振り直ししてもよい。2回目の結果を必ず適用する。"]],"n":""},{"c":"キャラクターアイテム","s":"PILOT","en":"PILOT'S SHOTGUN","ja":"パイロットのショットガン","e":[["","⟦射撃⟧：射撃攻撃の後、その部屋のすべての⟦イントルーダー⟧に1ヒットずつ与える。"]],"n":""},{"c":"キャラクターアイテム","s":"PILOT","en":"ORBITAL MANEUVERING SYSTEM","ja":"軌道操縦システム","e":[["","現在のラウンドから3スペース以内に⟦着陸機⟧がある場合：\nあなたの部屋に隣接する部屋を1つ選んで、そこに⟦着陸機⟧を置く。その部屋のすべての⟦イントルーダー⟧を撃退する。その部屋にいる⟦キャラクター⟧は、2⟦HP⟧を失う。\nこの時点から、⟦キャラクター⟧は着陸地点のルームアクションと同じルールに従ってその着陸機に乗り込むことができる。"]],"n":"対空防御トークンが「稼働中」だった場合には、通常通りに着陸機は破壊され、着陸機が部屋に置かれることはない。\n※BGGより（AR確認済み）"},{"c":"キャラクターアイテム","s":"JANITOR","en":"KARCHER","ja":"高圧洗浄機","e":[["","このアイテムに⟦故障マーカー⟧を置いて、⟦火災マーカー⟧を取り除く。"],["または","このアイテムに⟦故障マーカー⟧を置いて、あなたの部屋の⟦イントルーダー⟧1体を撃退する。"]],"n":""},{"c":"キャラクターアイテム","s":"JANITOR","en":"NAIL GUN","ja":"釘打ち機","e":[["","⟦掃射⟧と⟦射撃⟧：⟦弾薬⟧を消費するたびに、その代わりにこの武器に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"キャラクターアイテム","s":"SENTRY","en":"SENTRY'S SMG","ja":"セントリーのサブマシンガン","e":[["","⟦射撃⟧：⟦イントルーダー⟧を殺した場合、⟦アクションカード⟧を1枚引く。"]],"n":""},{"c":"キャラクターアイテム","s":"SENTRY","en":"NBC SUIT","ja":"生化学防護服","e":[["","パスをするたびに、 1⟦酸素⟧を獲得する。"]],"n":""},{"c":"キャラクターアイテム","s":"HACKER","en":"CHEAT CODES","ja":"チートコード","e":[["","⟦コンピューター⟧がある部屋でのみ使用可能\n\n発見済みの任意の生命維持システム制御室を使用する。"],["または","施設内の任意の数のドアを開く、および/または閉じる。"]],"n":""},{"c":"キャラクターアイテム","s":"HACKER","en":"SMART GUN","ja":"スマートガン","e":[["","⟦射撃⟧：射撃攻撃の結果に-2の補正を加える。\n\n⟦掃射ダイス★⟧、⟦射撃ダイス（弾薬）⟧：この武器に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"キャラクターアイテム","s":"LAB RAT","en":"LAB RAT'S GUN","ja":"ラボラットの拳銃","e":[["","⟦掃射⟧：⟦掃射3⟧と⟦掃射4⟧の出目を⟦掃射2⟧の出目として扱う。"]],"n":""},{"c":"キャラクターアイテム","s":"LAB RAT","en":"BLOODY CAMOUFLAGE","ja":"血塗られた迷彩","e":[["","⟦イントルーダー⟧が部屋に進入することで攻撃してくるたびに、その部屋にいる別の⟦キャラクター⟧を選択する。⟦イントルーダー⟧はその⟦キャラクター⟧を代わりに攻撃する。"]],"n":""},{"c":"キャラクターアイテム","s":"SURVIVOR","en":"MAKESHIFT ARMOR","ja":"即席アーマー","e":[["","重傷を1つ負うたびに、このカードに⟦故障マーカー⟧を置いて、重傷を負う代わりに1⟦HP⟧を失うことを選択してもよい。"]],"n":""},{"c":"キャラクターアイテム","s":"SURVIVOR","en":"SURVIVOR'S FAVORITE","ja":"サバイバーのお気に入り","e":[["","⟦掃射⟧：掃射攻撃の結果に+1の補正を加える。\n\n⟦掃射ダイス★⟧、⟦射撃ダイス（弾薬）⟧：この武器に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"キャラクターアイテム","s":"XENOBIOLOGIST","en":"XENOBIOLOGIST'S GUN","ja":"ゼノバイオロジストの拳銃","e":[["","⟦掃射ダイス★⟧：4ヒットではなく1ヒットを与える。⟦アクションカード⟧を1枚捨てる。"]],"n":""},{"c":"キャラクターアイテム","s":"XENOBIOLOGIST","en":"PROBE ARM","ja":"探査アーム","e":[["","このアイテムを近接武器として扱ってもよい。\n\n⟦近接攻撃⟧：細胞標本を1つ取得する（キャラクターボードに汎用マーカーを1つ置く）"]],"n":""},{"c":"キャラクターアイテム","s":"SOLDIER","en":"OLD MILITARY ARMOR","ja":"旧式軍用アーマー","e":[["","⟦イントルーダー⟧から攻撃を受けるたびに、イントルーダーの攻撃カードを引き直ししてもよい。2枚目のカードの結果を必ず適用する。"]],"n":""},{"c":"キャラクターアイテム","s":"SOLDIER","en":"SOLDIER'S GUN","ja":"ソルジャーの銃","e":[["","⟦掃射⟧：⟦掃射1⟧を⟦掃射2⟧として扱う。\n⟦射撃⟧：この武器で射撃攻撃を行う際には⟦弾薬⟧を消費する。\n\n⟦射撃ダイス（弾薬）⟧：⟦弾薬⟧を消費する代わりに⟦クリティカル⟧を与える。"]],"n":""},{"c":"支援装備","s":"","en":"ASSAULT SHOTGUN","ja":"アサルトショットガン","e":[["","⟦イントルーダー⟧から攻撃を受けるたびに、この武器の⟦弾薬⟧を消費してもよい。そうした場合、その⟦イントルーダー⟧に1ヒットを与えて、その攻撃を阻止する。"]],"n":""},{"c":"支援装備","s":"","en":"AUTOLOADER BELT","ja":"自動給弾ベルト","e":[["","このカードの上の⟦弾薬トークン⟧を、あなたの各武器にあるかのように、共有して扱ってよい。"]],"n":""},{"c":"支援装備","s":"","en":"BAYONET","ja":"銃剣","e":[["","このアイテムを遠距離武器が置かれたハンドスロットに置いてもよい。⟦イントルーダー⟧から攻撃を受けるたびに、このアイテムに⟦故障マーカー⟧を置くことでその攻撃を阻止してもよい。"]],"n":""},{"c":"支援装備","s":"","en":"BIOHAZARD ARMOR","ja":"生物災害防護アーマー","e":[["","感染カードを1枚受け取るたびに、カードを受け取る代わりに1⟦HP⟧を失う。"]],"n":"この効果はアーマーを装備している限り必ず適用される。アーマーの効果を適用せずに感染カードを受け取ることを選択することはできない。"},{"c":"支援装備","s":"","en":"PERIMETER SECURITY DEVICE","ja":"境界セキュリティデバイス","e":[["","新しい部屋を発見する際に、⟦急襲（騒音ダイス）⟧を無視する（効果の発生元は問わない）。"]],"n":""},{"c":"支援装備","s":"","en":"DRUM MAG RIFLE","ja":"ドラムマガジンライフル","e":[["","特別なルールなし"]],"n":""},{"c":"支援装備","s":"","en":"ENGINEERING EQUIPMENT","ja":"野戦工兵機器","e":[["","⟦故障マーカー⟧か⟦火災マーカー⟧を取り除く。"],["または","このアイテムを捨てて、隣接する空の通路を1つ選んで補強する。"]],"n":""},{"c":"支援装備","s":"","en":"ENTRENCHING TOOL","ja":"塹壕掘削器","e":[["","アクセス可能なドアを1つ破壊する。"],["または","⟦セキュアトークン⟧を2つ置く。"]],"n":""},{"c":"支援装備","s":"","en":"FLAMETHROWER","ja":"火炎放射器","e":[["","⟦掃射⟧と⟦射撃⟧：あなたのセクションの生命維持システムが⟦生命維持：停止⟧の場合、この武器を使用する際に1⟦酸素⟧を消費する。\n\n⟦掃射ダイス★⟧、⟦射撃ダイス（弾薬）⟧：あなたの部屋に⟦火災マーカー⟧を置く。"]],"n":""},{"c":"支援装備","s":"","en":"GATLING GUN","ja":"ガトリング銃","e":[["","⟦掃射⟧：掃射攻撃の後、⟦弾薬⟧を消費せずに同じ通路に対して2回目の掃射攻撃を行ってもよい。\n\n⟦掃射ダイス★⟧：この武器に⟦故障マーカー⟧を置く。"]],"n":""},{"c":"支援装備","s":"","en":"GRENADE LAUNCHER","ja":"グレネードランチャー","e":[["","⟦掃射⟧：掃射攻撃の前か、掃射攻撃の代わりに、この武器の⟦グレネードトークン⟧を任意の数だけ使用してよい。"]],"n":""},{"c":"支援装備","s":"","en":"HEAVY ARMOR","ja":"重装甲アーマー","e":[["","重傷を1つ負うたびに、重傷を負う代わりに2⟦HP⟧を失うことを選択してもよい。"]],"n":""},{"c":"支援装備","s":"","en":"HAND CANNON","ja":"ハンドキャノン","e":[["","⟦掃射⟧：掃射攻撃の結果に-1の補正を加える。\n⟦射撃⟧：射撃攻撃の結果に-1の補正を加える。"]],"n":""},{"c":"支援装備","s":"","en":"SECURITY SYSTEM CONTROL","ja":"セキュリティシステム制御装置","e":[["","あなたのセクションにある⟦セキュアトークン⟧がある部屋を1つ選んで、その部屋の⟦セキュアトークン⟧を1つ捨てる。その部屋に隣接する通路を1つ選択する。掃射ダイスを1回ロールして、ロールの結果に等しいヒットをその通路に与える。\n\n⟦掃射ダイス★⟧：このアイテムに⟦故障マーカー⟧を置く。"]],"n":""},{"c":"支援装備","s":"","en":"NOISE SCANNER","ja":"騒音スキャナ","e":[["","施設内の任意の通路から⟦騒音マーカー⟧を1つ取り除き、騒音ロールを1回行う。ロールの結果がその通路の騒音番号と等しかった場合、イントルーダーバッグからイントルーダートークンを1つ引いて、その通路に対してトークンの内容を解決する。"]],"n":""},{"c":"支援装備","s":"","en":"PLASMA GUN","ja":"プラズマガン","e":[["","⟦掃射ダイス★⟧、⟦射撃ダイス（弾薬）⟧：この武器の上にある汎用マーカーの数を2倍した量の⟦HP⟧を失う。その後、この武器の上に汎用マーカーを1つ置く。"]],"n":""},{"c":"支援装備","s":"","en":"PORTABLE DEVICE","ja":"携帯端末","e":[["","⟦コンピューター⟧がある部屋か、何れかの生命維持システム制御室にいる場合、その部屋を使用する。部屋に⟦故障マーカー⟧があっても使用できる。"]],"n":""},{"c":"支援装備","s":"","en":"RPG LAUNCHER","ja":"RPGランチャー","e":[["","あなたが選んだ隣接する部屋とその部屋に隣接するすべての通路に対して：\nすべてのドアを破壊し、すべての⟦イントルーダー⟧に⟦クリティカル⟧を与える。すべての⟦キャラクター⟧は、3⟦HP⟧を失う。"]],"n":"対象の通路にあるドアは、そのドアが配置されている位置に関係なくすべて破壊される（対象の部屋に隣接するドアだけでなく、その反対側にあるドアも破壊される）。\n※Awaken Realms社に確認済み"},{"c":"支援装備","s":"","en":"SUBMACHINE GUN","ja":"サブマシンガン","e":[["","⟦射撃ダイス（弾薬）⟧：⟦クリティカル⟧を与える。"]],"n":"この効果は攻撃対象にクリティカルを与えるが、弾薬は通常通りに消費する。"},{"c":"支援装備","s":"","en":"SUPPORTING ROBOT CONTROLLER","ja":"サポートロボット制御器","e":[["","施設内の任意の場所にいる⟦ロボット⟧を起動する。"],["または","あなたの部屋に⟦ロボット⟧を配置する（コールドスリープルームがまだ発見されていない場合は、ロボットカードを公開してから⟦ロボット⟧を配置する）。"]],"n":""},{"c":"支援装備","s":"","en":"TACTICAL ARMOR","ja":"戦術アーマー","e":[["","イントルーダーの攻撃により⟦HP⟧を失うたびに、失う⟦HP⟧に-1の補正を加える。"]],"n":""},{"c":"支援装備","s":"",
